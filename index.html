                                    <button onClick={addAdmin} className="bg-emerald-600 text-white px-3 rounded-2xl text-xs font-bold hover:bg-emerald-700 shadow-sm">Add</button>
                                </div>
                                <ul className="space-y-2 max-h-44 overflow-y-auto pr-1 text-xs">
                                    {adminList.map((adm, idx)=>(
                                        <li key={idx} className="flex justify-between items-center p-2.5 bg-white rounded-2xl border border-emerald-100 font-medium text-slate-700">
                                            <span>{adm}</span>
                                            <button onClick={()=>removeAdmin(adm)} className="text-red-500 hover:text-red-700 p-1"><i className="fas fa-times"></i></button>
                                        </li>
                                    ))}
                                    {adminList.length === 0 && <li className="text-slate-400 text-center py-4">Belum ada Admin</li>}
                                </ul>
                            </div>
                            
                            <div className="bg-sky-50/50 p-6 border border-sky-200 rounded-3xl shadow-sm">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-sky-900 text-sm"><i className="fas fa-box mr-2 text-sky-600"></i>Kelola Produk</h3>
                                    <div className="relative">
                                        <input type="file" accept=".csv" onChange={(e) => processMasterCSVUpload(e, 'PRODUK')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Upload CSV 1 Kolom"/>
                                        <button className="text-xs bg-white text-sky-700 px-3 py-1 rounded-xl border border-sky-300 hover:bg-sky-100 font-bold pointer-events-none shadow-sm">CSV <i className="fas fa-upload"></i></button>
                                    </div>
                                </div>
                                <div className="flex space-x-2 mb-4">
                                    <input type="text" value={newProduct} onChange={(e)=>setNewProduct(e.target.value)} placeholder="Produk Baru" className="flex-1 p-2.5 bg-white border border-sky-200 rounded-2xl text-xs outline-none focus:border-sky-600 font-medium" />
                                    <button onClick={addProduct} className="bg-sky-600 text-white px-3 rounded-2xl text-xs font-bold hover:bg-sky-700 shadow-sm">Add</button>
                                </div>
                                <ul className="space-y-2 max-h-44 overflow-y-auto pr-1 text-xs">
                                    {productList.map((prod, idx)=>(
                                        <li key={idx} className="flex justify-between items-center p-2.5 bg-white rounded-2xl border border-sky-100 font-medium text-slate-700">
                                            <span>{prod}</span>
                                            <button onClick={()=>removeProduct(prod)} className="text-red-500 hover:text-red-700 p-1"><i className="fas fa-times"></i></button>
                                        </li>
                                    ))}
                                    {productList.length === 0 && <li className="text-slate-400 text-center py-4">Belum ada Produk</li>}
                                </ul>
                            </div>
                        </div>

                        {/* Kelola Akun Pengguna */}
                        <div className="bg-white p-6 md:p-8 border border-slate-200 rounded-3xl shadow-sm">
                            <h3 className="font-bold text-slate-900 mb-6 border-b border-slate-100 pb-4 text-lg"><i className="fas fa-users-cog mr-2 text-slate-600"></i>Kelola Akun Pengguna & Hak Akses</h3>
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                <input type="text" value={newUser.username} onChange={(e)=>setNewUser({...newUser, username: e.target.value})} placeholder="Username Baru" className="p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-slate-800 text-sm font-medium" />
                                <input type="text" value={newUser.password} onChange={(e)=>setNewUser({...newUser, password: e.target.value})} placeholder="Password" className="p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-slate-800 text-sm font-medium" />
                                <select value={newUser.role} onChange={(e)=>setNewUser({...newUser, role: e.target.value})} className="p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none bg-white text-sm font-medium">
                                    <option value="ao">AO / Petugas</option>
                                    <option value="admin">Admin Mikro</option>
                                </select>
                                <button onClick={addUser} className="bg-slate-900 text-white px-6 py-3 rounded-2xl text-sm font-bold hover:bg-slate-800 transition shadow-md">Buat Akun</button>
                            </div>
                            <div className="overflow-x-auto border border-slate-200 rounded-2xl">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-600">
                                        <tr><th className="p-4 font-bold">Username</th><th className="p-4 font-bold">Password</th><th className="p-4 font-bold">Role</th><th className="p-4 font-bold text-center">Aksi</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {appUsers.map((u, i) => (
                                            <tr key={i} className="hover:bg-slate-50">
                                                <td className="p-4 font-bold text-slate-900">{u.username}</td>
                                                <td className="p-4 font-mono text-xs text-slate-600">{u.password}</td>
                                                <td className="p-4"><span className={`px-2.5 py-1 rounded-xl text-xs font-extrabold ${u.role === 'admin' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}`}>{u.role.toUpperCase()}</span></td>
                                                <td className="p-4 text-center">
                                                    {(u.username.toLowerCase() !== 'admin' && u.username.toLowerCase() !== 'mikro') && <button onClick={()=>removeUser(u.username)} className="text-red-500 hover:bg-red-50 p-2 rounded-xl transition"><i className="fas fa-trash"></i></button>}
                                                    {(u.username.toLowerCase() === 'admin' || u.username.toLowerCase() === 'mikro') && <span className="text-xs text-slate-400 font-semibold italic">Akun Sistem</span>}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            if (!userRole) return <Login />;

            const isAdmin = userRole === 'admin';

            return (
                <div className="flex bg-slate-50 font-sans text-slate-800 min-h-screen">
                    {toast.show && (
                        <div className={`fixed top-4 right-4 z-50 px-6 py-3.5 rounded-2xl shadow-xl text-white font-bold text-sm flex items-center toast-enter ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} mr-3 text-lg`}></i> {toast.message}
                        </div>
                    )}

                    {isLoading && (
                        <div className="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex items-center justify-center">
                            <div className="bg-white p-6 rounded-3xl shadow-2xl flex flex-col items-center border border-slate-200">
                                <i className="fas fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
                                <p className="font-bold text-slate-700 text-sm">Menyinkronkan Cloud Database...</p>
                            </div>
                        </div>
                    )}

                    {confirmModal.open && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                                <div className="flex items-center space-x-3 text-red-600 mb-3">
                                    <div className="w-10 h-10 rounded-2xl bg-red-50 flex items-center justify-center">
                                        <i className="fas fa-exclamation-triangle text-lg"></i>
                                    </div>
                                    <h3 className="font-extrabold text-slate-900 text-lg">{confirmModal.title}</h3>
                                </div>
                                <p className="text-slate-600 text-sm mb-6 leading-relaxed">{confirmModal.message}</p>
                                <div className="flex space-x-3 justify-end">
                                    <button onClick={() => setConfirmModal({ open: false, title: '', message: '', onConfirm: null })} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition">
                                        Batal
                                    </button>
                                    <button onClick={() => { if (confirmModal.onConfirm) confirmModal.onConfirm(); }} className="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-red-600/30">
                                        Lanjutkan Hapus
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Bantuan Diagnostik Koneksi Cloud */}
                    {dbModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl border border-slate-100">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                                            <i className="fas fa-network-wired"></i>
                                        </div>
                                        <h3 className="font-extrabold text-slate-900 text-lg">Status Koneksi Cloud</h3>
                                    </div>
                                    <button onClick={() => setDbModal(false)} className="text-slate-400 hover:text-slate-600 p-2"><i className="fas fa-times"></i></button>
                                </div>
                                
                                <div className="space-y-4 text-xs text-slate-600">
                                    <div className={`p-4 rounded-2xl flex items-center space-x-3 ${cloudStatus === 'connected' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-red-50 text-red-800 border border-red-200'}`}>
                                        <i className={`fas ${cloudStatus === 'connected' ? 'fa-check-circle text-emerald-600' : 'fa-exclamation-circle text-red-600'} text-2xl`}></i>
                                        <div>
                                            <p className="font-bold text-sm">{cloudStatus === 'connected' ? 'Database Terhubung Normal' : 'Koneksi Cloud Terputus / Ditolak'}</p>
                                            <p className="text-[11px] mt-0.5 opacity-90">{cloudStatus === 'connected' ? 'Seluruh data nasabah, rekap, dan master data tersinkronisasi.' : 'Google Spreadsheet menolak akses dari perangkat ini.'}</p>
                                        </div>
                                    </div>

                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 font-mono text-[11px] break-all">
                                        <span className="font-bold text-slate-500 block mb-1">Target Endpoint Web App:</span>
                                        {sheetUrl || DEFAULT_SHEET_URL}
                                    </div>

                                    <div className="p-4 bg-amber-50 rounded-2xl border border-amber-200 text-amber-900">
                                        <p className="font-bold mb-1"><i className="fas fa-info-circle mr-1.5"></i>Panduan untuk Admin:</p>
                                        <p className="leading-relaxed">Jika HP AO tidak bisa membaca data, pastikan di Google Spreadsheet: <strong>Deploy &gt; Manage Deployments &gt; Who has access</strong> diatur ke <strong>"Anyone (Siapa saja)"</strong>, dan <strong>Execute as: "Me"</strong>.</p>
                                    </div>
                                </div>

                                <div className="mt-6 flex space-x-3 justify-end">
                                    <button onClick={() => { syncFromSheet(null, true); setDbModal(false); }} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center justify-center">
                                        <i className="fas fa-sync-alt mr-2"></i> Sinkronkan Ulang Sekarang
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className={`mobile-overlay ${isSidebarOpen ? 'open' : ''}`} onClick={() => setIsSidebarOpen(false)}></div>

                    <aside className={`sidebar-container ${isSidebarOpen ? 'open' : ''} flex flex-col`}>
                        <div className="p-6 border-b border-slate-100 flex items-center flex-col text-center">
                            <RocketLogo size={70} />
                            <h2 className="font-extrabold text-slate-900 text-base tracking-tight mt-2.5">Area Medan 1</h2>
                            <p className="text-[11px] text-slate-400 uppercase tracking-wider font-bold">{isAdmin ? 'Administrator' : 'Account Officer'}</p>
                        </div>
                        
                        <div className="p-4 overflow-y-auto hide-scroll flex-1 space-y-6">
                            <div>
                                <p className="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 px-3">Dashboard</p>
                                <button onClick={() => {setActiveTab('dashReal'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'dashReal' ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-chart-pie w-6 opacity-70"></i> Realisasi (Admin)</button>
                                <button onClick={() => {setActiveTab('dashEst'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'dashEst' ? 'bg-purple-50 text-purple-700 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-chart-line w-6 opacity-70"></i> Estimasi (AO)</button>
                            </div>

                            <div>
                                <p className="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 px-3">Input Data</p>
                                <button onClick={() => {setActiveTab('inReal'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'inReal' ? 'bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-file-invoice-dollar w-6"></i> Input Realisasi</button>
                                <button onClick={() => {setActiveTab('inEst'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'inEst' ? 'bg-purple-600 text-white font-bold shadow-md shadow-purple-600/30' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-edit w-6"></i> Input Estimasi</button>
                            </div>

                            <div>
                                <p className="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 px-3">Laporan CSV</p>
                                <button onClick={() => {setActiveTab('repKol1'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'repKol1' ? 'bg-amber-50 text-amber-800 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-exclamation w-6 text-amber-500"></i> KOL 1 (1-10 Hari)</button>
                                <button onClick={() => {setActiveTab('repLar'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'repLar' ? 'bg-orange-50 text-orange-800 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-exclamation-circle w-6 text-orange-500"></i> LAR 11 - 30 Hari</button>
                                <button onClick={() => {setActiveTab('repNpl'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'repNpl' ? 'bg-red-50 text-red-800 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-times-circle w-6 text-red-500"></i> NPL (KOL 3 - 5)</button>
                                <button onClick={() => {setActiveTab('repKlaim'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'repKlaim' ? 'bg-teal-50 text-teal-800 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-shield-alt w-6 text-teal-500"></i> Tindak Lanjut Klaim</button>
                                <button onClick={() => {setActiveTab('repReal'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'repReal' ? 'bg-blue-50 text-blue-800 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-file-alt w-6 text-blue-500"></i> Report Realisasi</button>
                            </div>

                            {isAdmin && (
                                <div>
                                    <p className="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 px-3">Khusus Admin</p>
                                    <button onClick={() => {setActiveTab('rekReal'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'rekReal' ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-history w-6 opacity-70"></i> Rekap Realisasi</button>
                                    <button onClick={() => {setActiveTab('rekEst'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'rekEst' ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-list-ul w-6 opacity-70"></i> Rekap Estimasi</button>
                                    <button onClick={() => {setActiveTab('admin'); setIsSidebarOpen(false)}} className={`w-full text-left px-4 py-3 rounded-2xl mb-1 transition flex items-center text-sm font-semibold ${activeTab === 'admin' ? 'bg-slate-900 text-white font-bold shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}><i className="fas fa-cogs w-6 opacity-70"></i> Kelola & Setting</button>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="main-content">
                        <header className="flex justify-between items-center mb-8 bg-white p-4 md:px-6 rounded-3xl shadow-sm border border-slate-200">
                            <div className="flex items-center">
                                <button onClick={() => setIsSidebarOpen(true)} className="lg:hidden mr-4 text-slate-500 hover:text-slate-800 focus:outline-none"><i className="fas fa-bars text-xl"></i></button>
                                <div>
                                    <h2 className="text-lg font-black text-slate-800 hidden sm:block">Portal Area Medan 1</h2>
                                    <p className="text-xs text-slate-400 font-medium hidden sm:block">{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-3">
                                {/* Lencana Status Koneksi Cloud */}
                                <button 
                                    onClick={() => setDbModal(true)}
                                    className={`px-3 py-1.5 rounded-2xl text-xs font-bold flex items-center transition shadow-sm border ${cloudStatus === 'connected' ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' : 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100 animate-pulse'}`}
                                    title="Cek Status Database Cloud"
                                >
                                    <span className={`w-2 h-2 rounded-full mr-2 ${cloudStatus === 'connected' ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                                    <span className="hidden sm:inline">{cloudStatus === 'connected' ? 'Cloud Terhubung' : 'Cloud Terputus'}</span>
                                </button>

                                <button onClick={() => syncFromSheet(null, true)} className="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 hover:bg-blue-100 transition flex items-center justify-center border border-blue-200 shadow-sm" title="Sinkronisasi Data Sheet">
                                    <i className="fas fa-sync-alt"></i>
                                </button>
                                
                                <div className="bg-slate-50 px-4 py-2 rounded-2xl flex items-center border border-slate-200 shadow-sm">
                                    <i className="fas fa-user-circle text-slate-400 mr-2 text-lg"></i>
                                    <span className="text-xs font-bold text-slate-700 mr-3 hidden sm:inline">Hi, {isAdmin ? 'Admin' : 'AO'}</span>
                                    <button onClick={() => {setUserRole(null); localStorage.removeItem('userRole');}} className="text-xs text-red-600 hover:text-red-700 font-extrabold border-l pl-3 border-slate-300">Logout <i className="fas fa-sign-out-alt ml-1"></i></button>
                                </div>
                            </div>
                        </header>

                        <div className="pb-10">
                            {activeTab === 'dashReal' && <Dashboard type="realisasi" />}
                            {activeTab === 'dashEst' && <Dashboard type="estimasi" />}
                            {activeTab === 'inReal' && <InputForm type="realisasi" />}
                            {activeTab === 'inEst' && <InputForm type="estimasi" />}
                            {activeTab === 'rekReal' && <DataRekap type="realisasi" />}
                            {activeTab === 'rekEst' && <DataRekap type="estimasi" />}
                            {activeTab === 'repKol1' && <Kol1View />}
                            {activeTab === 'repLar' && <LarView />}
                            {activeTab === 'repNpl' && <NplView />}
                            {activeTab === 'repKlaim' && <KlaimView />}
                            {activeTab === 'repReal' && <ReportRealisasiView />}
                            {activeTab === 'admin' && isAdmin && <AdminPanel />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
