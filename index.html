                syncMasterToSheet(aoList, updated, adminList, cabangList); showToast('Produk dihapus', 'error');
            };

            const addUser = () => {
                if (!newUser.username.trim() || !newUser.password.trim()) return showToast('Isi Username & Password!', 'error');
                if (appUsers.some(u => u.username.toLowerCase() === newUser.username.trim().toLowerCase())) return showToast('Username sudah terdaftar!', 'error');
                const updated = [...appUsers, { username: newUser.username.trim(), password: newUser.password.trim(), role: newUser.role }];
                setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated));
                syncUsersToSheet(updated); setNewUser({ username: "", password: "", role: "ao" }); showToast('User baru berhasil dibuat');
            };

            const removeUser = (username) => {
                if (username.toLowerCase() === 'admin' || username.toLowerCase() === 'mikro') return showToast('Akun bawaan sistem terproteksi!', 'error');
                const updated = appUsers.filter(u => u.username !== username);
                setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated));
                syncUsersToSheet(updated); showToast('User dihapus', 'error');
            };

            const microColumnSets = {
                kol1: ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'],
                lar: ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'],
                npl: ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'],
                klaim: ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG', 'TINDAK LANJUT KLAIM']
            };
            const reportColumns = ['NAMA_CABANG', 'TARGET_OSL', 'REALISASI_OSL', 'PENCAPAIAN_OSL', 'TARGET_NPL', 'REALISASI_NPL', 'PENCAPAIAN_NPL', 'TARGET_LAR', 'REALISASI_LAR', 'PENCAPAIAN_LAR', 'TARGET_RATA2', 'REALISASI_RATA2', 'PENCAPAIAN_RATA2', 'TARGET_NOA', 'REALISASI_NOA', 'PENCAPAIAN_NOA'];
            const microInputColumns = [...new Set(Object.values(microColumnSets).flat())];
            const normalizeExcelHeader = (value) => String(value || '').replace(/\u00a0/g, ' ').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

            const parseExcelUpload = async (file, type) => {
                if (!window.XLSX) throw new Error('Pustaka Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
                const workbook = window.XLSX.read(await file.arrayBuffer(), { cellDates: true });
                const requiredColumns = type === 'MIKRO' ? microInputColumns : reportColumns;
                const aliases = type === 'MIKRO'
                    ? { 'CABANG': ['CABANG', 'NAMA CABANG'], 'TINDAK LANJUT KLAIM': ['TINDAK LANJUT KLAIM', 'TINDAK LANJUT'] }
                    : { 'NAMA_CABANG': ['NAMA_CABANG', 'NAMA CABANG', 'CABANG'] };
                let bestMatch = null;

                for (const sheetName of workbook.SheetNames) {
                    const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, raw: false, defval: '', blankrows: false });
                    const scanLimit = Math.min(rows.length, 40);
                    for (let rowIndex = 0; rowIndex < scanLimit; rowIndex++) {
                        const headers = rows[rowIndex] || [];
                        const headerIndex = {};
                        headers.forEach((header, index) => {
                            const clean = normalizeExcelHeader(header);
                            if (clean && headerIndex[clean] === undefined) headerIndex[clean] = index;
                        });
                        const columnIndexes = {};
                        const missing = [];
                        requiredColumns.forEach(column => {
                            const candidates = (aliases[column] || [column]).map(normalizeExcelHeader);
                            const matched = candidates.find(candidate => headerIndex[candidate] !== undefined);
                            if (matched === undefined) missing.push(column);
                            else columnIndexes[column] = headerIndex[matched];
                        });
                        const score = requiredColumns.length - missing.length;
                        if (!bestMatch || score > bestMatch.score) bestMatch = { rows, rowIndex, columnIndexes, missing, score, sheetName };
                        if (missing.length === 0) break;
                    }
                    if (bestMatch && bestMatch.missing.length === 0) break;
                }

                if (!bestMatch || bestMatch.missing.length > 0) {
                    const missing = bestMatch?.missing?.length ? bestMatch.missing.join(', ') : 'kolom header yang sesuai';
                    throw new Error(`Kolom wajib tidak ditemukan: ${missing}.`);
                }

                const records = bestMatch.rows.slice(bestMatch.rowIndex + 1).map(row => {
                    const record = {};
                    requiredColumns.forEach(column => {
                        const value = row[bestMatch.columnIndexes[column]];
                        record[column] = value === undefined || value === null ? '' : String(value).trim();
                    });
                    return record;
                }).filter(record => Object.values(record).some(value => value !== '') && (type !== 'MIKRO' || record.NO_KONTRAK));

                if (records.length === 0) throw new Error(`Tidak ada baris data pada sheet ${bestMatch.sheetName}.`);
                return records;
            };

            const makeCloudSheetData = (columns, rows) => [columns, ...rows.map(row => columns.map(column => row[column] ?? ''))];
            const syncExcelDataToCloud = async (datasets) => {
                const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                if (!targetUrl) return false;
                for (const { type, columns, rows } of datasets) {
                    await fetch(targetUrl, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: `upload_${type.toLowerCase()}`, data: rows === null ? [] : makeCloudSheetData(columns, rows) })
                    });
                }
                return true;
            };

            const processExcelUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsLoading(true);
                try {
                    const sourceRows = await parseExcelUpload(file, type);
                    if (type === 'MIKRO') {
                        const readNumber = value => {
                            const cleaned = String(value ?? '').replace(/[^0-9-]/g, '');
                            return cleaned ? Number(cleaned) : NaN;
                        };
                        const kol1Rows = sourceRows.filter(row => readNumber(row.KOLEKTIBILITAS) === 1 && readNumber(row.HARI_TUNGGAKAN) >= 1 && readNumber(row.HARI_TUNGGAKAN) <= 10).map(row => Object.fromEntries(microColumnSets.kol1.map(column => [column, row[column] ?? ''])));
                        const larRows = sourceRows.filter(row => readNumber(row.KOLEKTIBILITAS) === 2 && readNumber(row.HARI_TUNGGAKAN) >= 11 && readNumber(row.HARI_TUNGGAKAN) <= 30).map(row => Object.fromEntries(microColumnSets.lar.map(column => [column, row[column] ?? ''])));
                        const nplRows = sourceRows.filter(row => [3, 4, 5].includes(readNumber(row.KOLEKTIBILITAS))).map(row => Object.fromEntries(microColumnSets.npl.map(column => [column, row[column] ?? ''])));
                        const klaimRows = sourceRows.filter(row => String(row['TINDAK LANJUT KLAIM'] || '').trim().toLowerCase().replace(/[_\s]+/g, ' ') === 'segera lakukan klaim').map(row => Object.fromEntries(microColumnSets.klaim.map(column => [column, row[column] ?? ''])));

                        setKol1Data(kol1Rows); localStorage.setItem('kol1Data', JSON.stringify(kol1Rows));
                        setLarData(larRows); localStorage.setItem('larData', JSON.stringify(larRows));
                        setNplData(nplRows); localStorage.setItem('nplData', JSON.stringify(nplRows));
                        setKlaimData(klaimRows); localStorage.setItem('klaimData', JSON.stringify(klaimRows));

                        try {
                            await syncExcelDataToCloud([
                                { type: 'KOL1', columns: microColumnSets.kol1, rows: kol1Rows },
                                { type: 'LAR', columns: microColumnSets.lar, rows: larRows },
                                { type: 'NPL', columns: microColumnSets.npl, rows: nplRows },
                                { type: 'KLAIM', columns: microColumnSets.klaim, rows: klaimRows }
                            ]);
                            showToast(`Data Mikro diproses: KOL 1 ${kol1Rows.length}, LAR ${larRows.length}, NPL ${nplRows.length}, klaim ${klaimRows.length} nasabah.`);
                        } catch (cloudError) {
                            showToast('Data Mikro tersimpan di perangkat, tetapi sinkronisasi Cloud gagal.', 'error');
                        }
                    } else {
                        const reportRows = sourceRows.filter(row => row.NAMA_CABANG).map(row => Object.fromEntries(reportColumns.map(column => [column, row[column] ?? ''])));
                        if (reportRows.length === 0) throw new Error('Tidak ada baris report dengan nama cabang.');
                        setReportData(reportRows); localStorage.setItem('reportData', JSON.stringify(reportRows));
                        try {
                            await syncExcelDataToCloud([{ type: 'REPORT', columns: reportColumns, rows: reportRows }]);
                            showToast(`Report Excel berhasil diproses: ${reportRows.length} cabang.`);
                        } catch (cloudError) {
                            showToast('Report tersimpan di perangkat, tetapi sinkronisasi Cloud gagal.', 'error');
                        }
                    }
                } catch (error) {
                    showToast(`Gagal membaca Excel: ${error.message}`, 'error');
                } finally {
                    e.target.value = '';
                    setIsLoading(false);
                }
            };

            const resetData = (type) => {
                const isMicro = type === 'MIKRO';
                const label = isMicro ? 'Data Mikro' : 'Report';
                const datasets = isMicro
                    ? [
                        { type: 'KOL1', columns: microColumnSets.kol1, rows: null },
                        { type: 'LAR', columns: microColumnSets.lar, rows: null },
                        { type: 'NPL', columns: microColumnSets.npl, rows: null },
                        { type: 'KLAIM', columns: microColumnSets.klaim, rows: null }
                    ]
                    : [{ type: 'REPORT', columns: reportColumns, rows: null }];
                setConfirmModal({
                    open: true,
                    title: `Kosongkan ${label}`,
                    message: `Hapus seluruh data ${label} dari aplikasi dan database Google Sheet?`,
                    onConfirm: async () => {
                        setIsLoading(true);
                        if (isMicro) {
                            setKol1Data([]); setLarData([]); setNplData([]); setKlaimData([]);
                            ['kol1Data', 'larData', 'nplData', 'klaimData'].forEach(key => localStorage.removeItem(key));
                        } else {
                            setReportData([]); localStorage.removeItem('reportData');
                        }
                        try {
                            await syncExcelDataToCloud(datasets);
                            showToast(`${label} berhasil dikosongkan.`);
                        } catch (error) {
                            showToast(`${label} dihapus dari perangkat, tetapi sinkronisasi Cloud gagal.`, 'error');
                        }
                        setIsLoading(false);
                        setConfirmModal({ open: false, title: '', message: '', onConfirm: null });
                    }
                });
            };

            return (
                <div className="space-y-8">
                    <div className="glass-card p-6 md:p-8 rounded-3xl border border-slate-200">
                        <div className="flex items-center space-x-3 mb-2">
                            <div className="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-lg">
                                <i className="fas fa-database"></i>
                            </div>
                            <h3 className="font-extrabold text-slate-900 text-lg font-heading">
                                Koneksi Database Google Spreadsheet (Apps Script)
                            </h3>
                        </div>
                        <p className="text-xs text-slate-500 mb-4 font-medium">
                            Pastikan Web App Google Apps Script disetel dengan akses <strong>"Siapa saja / Anyone"</strong> dan Execute as: <strong>"Me"</strong>.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <input
                                type="text"
                                value={sheetInput}
                                onChange={(e) => setSheetInput(e.target.value)}
                                placeholder="https://script.google.com/macros/s/.../exec"
                                className="flex-1 p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-mono text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500"
                            />
                            <button
                                onClick={testConnection}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3.5 rounded-2xl text-xs font-bold transition flex items-center justify-center shadow-md shadow-emerald-700/20"
                            >
                                <i className="fas fa-plug mr-2"></i> Uji Koneksi & Simpan
                            </button>
                        </div>
                    </div>

                    <div>
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-black text-slate-900 font-heading">
                                Unggah Data Mikro & Report (Excel)
                            </h3>
                            <span className="text-xs text-slate-400 font-medium">Format Excel .xlsx dan .xls</span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="bg-gradient-to-br from-emerald-50 to-emerald-100/50 border border-emerald-200 p-6 rounded-3xl shadow-sm relative overflow-hidden flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <h4 className="font-extrabold text-emerald-950 text-base font-heading">Upload Data Mikro</h4>
                                            <p className="text-xs text-emerald-700 font-medium">Otomatis filter KOL 1 (1–10 hari), LAR (11–30 hari), NPL (KOL 3–5, seluruh tunggakan), dan klaim.</p>
                                        </div>
                                        <div>
                                            <button onClick={() => resetData('MIKRO')} className="px-2.5 py-1 bg-emerald-700 text-white rounded-xl text-xs hover:bg-emerald-800 font-bold shadow-xs">Reset Data Mikro</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="relative mt-4">
                                    <input type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onChange={(e) => processExcelUpload(e, 'MIKRO')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl text-xs font-bold flex items-center justify-center pointer-events-none shadow-md">
                                        <i className="fas fa-cloud-arrow-up mr-2 text-sm"></i> Pilih Excel Data Mikro
                                    </button>
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-blue-50 to-blue-100/50 border border-blue-200 p-6 rounded-3xl shadow-sm relative overflow-hidden flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <h4 className="font-extrabold text-blue-950 text-base font-heading">Upload Report</h4>
                                            <p className="text-xs text-blue-700 font-medium">Report realisasi target cabang.</p>
                                        </div>
                                        <div>
                                            <button onClick={() => resetData('REPORT')} className="px-2.5 py-1 bg-blue-700 text-white rounded-xl text-xs hover:bg-blue-800 font-bold shadow-xs">Reset Report</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="relative mt-4">
                                    <input type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onChange={(e) => processExcelUpload(e, 'REPORT')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl text-xs font-bold flex items-center justify-center pointer-events-none shadow-md">
                                        <i className="fas fa-cloud-arrow-up mr-2 text-sm"></i> Pilih Excel Report
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 className="text-lg font-black text-slate-900 font-heading mb-4">
                            Kelola Master Data Organisasi
                        </h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                            <div className="glass-card p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider font-heading">
                                            <i className="fas fa-building mr-1.5 text-emerald-600"></i>Cabang ({cabangList.length})
                                        </h4>
                                    </div>
                                    <div className="flex space-x-1.5 mb-3">
                                        <input type="text" value={newCabang} onChange={(e) => setNewCabang(e.target.value)} placeholder="Cabang Baru" className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white" />
                                        <button onClick={addCabang} className="bg-emerald-600 text-white px-3 rounded-xl text-xs font-bold hover:bg-emerald-700">Add</button>
                                    </div>
                                </div>
                                <ul className="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-xs">
                                    {cabangList.map((cab, idx) => (
                                        <li key={idx} className="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100 font-semibold text-slate-700">
                                            <span className="truncate">{cab}</span>
                                            <button onClick={() => removeCabang(cab)} className="text-slate-400 hover:text-rose-600 p-1"><i className="fas fa-times"></i></button>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="glass-card p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider font-heading">
                                            <i className="fas fa-user-tie mr-1.5 text-orange-500"></i>Account Officer ({aoList.length})
                                        </h4>
                                    </div>
                                    <div className="flex space-x-1.5 mb-3">
                                        <input type="text" value={newAo} onChange={(e) => setNewAo(e.target.value)} placeholder="AO Baru" className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white" />
                                        <button onClick={addAo} className="bg-orange-500 text-white px-3 rounded-xl text-xs font-bold hover:bg-orange-600">Add</button>
                                    </div>
                                </div>
                                <ul className="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-xs">
                                    {aoList.map((ao, idx) => (
                                        <li key={idx} className="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100 font-semibold text-slate-700">
                                            <span className="truncate">{ao}</span>
                                            <button onClick={() => removeAo(ao)} className="text-slate-400 hover:text-rose-600 p-1"><i className="fas fa-times"></i></button>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="glass-card p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider font-heading">
                                            <i className="fas fa-user-gear mr-1.5 text-blue-600"></i>Admin Mikro ({adminList.length})
                                        </h4>
                                    </div>
                                    <div className="flex space-x-1.5 mb-3">
                                        <input type="text" value={newAdmin} onChange={(e) => setNewAdmin(e.target.value)} placeholder="Admin Baru" className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white" />
                                        <button onClick={addAdmin} className="bg-blue-600 text-white px-3 rounded-xl text-xs font-bold hover:bg-blue-700">Add</button>
                                    </div>
                                </div>
                                <ul className="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-xs">
                                    {adminList.map((adm, idx) => (
                                        <li key={idx} className="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100 font-semibold text-slate-700">
                                            <span className="truncate">{adm}</span>
                                            <button onClick={() => removeAdmin(adm)} className="text-slate-400 hover:text-rose-600 p-1"><i className="fas fa-times"></i></button>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="glass-card p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider font-heading">
                                            <i className="fas fa-box-archive mr-1.5 text-purple-600"></i>Produk ({productList.length})
                                        </h4>
                                    </div>
                                    <div className="flex space-x-1.5 mb-3">
                                        <input type="text" value={newProduct} onChange={(e) => setNewProduct(e.target.value)} placeholder="Produk Baru" className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white" />
                                        <button onClick={addProduct} className="bg-purple-600 text-white px-3 rounded-xl text-xs font-bold hover:bg-purple-700">Add</button>
                                    </div>
                                </div>
                                <ul className="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-xs">
                                    {productList.map((prod, idx) => (
                                        <li key={idx} className="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100 font-semibold text-slate-700">
                                            <span className="truncate">{prod}</span>
                                            <button onClick={() => removeProduct(prod)} className="text-slate-400 hover:text-rose-600 p-1"><i className="fas fa-times"></i></button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div className="glass-card p-6 md:p-8 rounded-3xl border border-slate-200">
                        <h3 className="font-black text-slate-900 mb-6 border-b border-slate-100 pb-4 text-lg font-heading flex items-center">
                            <i className="fas fa-users-gear mr-2.5 text-slate-700"></i>
                            Kelola Akun Pengguna & Hak Akses
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6">
                            <input
                                type="text"
                                value={newUser.username}
                                onChange={(e) => setNewUser({ ...newUser, username: e.target.value })}
                                placeholder="Username Baru"
                                className="p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-slate-900 text-xs font-semibold"
                            />
                            <input
                                type="text"
                                value={newUser.password}
                                onChange={(e) => setNewUser({ ...newUser, password: e.target.value })}
                                placeholder="Password"
                                className="p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-slate-900 text-xs font-semibold"
                            />
                            <select
                                value={newUser.role}
                                onChange={(e) => setNewUser({ ...newUser, role: e.target.value })}
                                className="p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none bg-white text-xs font-bold text-slate-700"
                            >
                                <option value="ao">AO / Petugas</option>
                                <option value="admin">Admin Mikro</option>
                            </select>
                            <button
                                onClick={addUser}
                                className="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-2xl text-xs font-bold transition shadow-md"
                            >
                                <i className="fas fa-plus mr-1.5"></i> Buat Akun
                            </button>
                        </div>

                        <div className="overflow-x-auto border border-slate-200 rounded-2xl">
                            <table className="w-full text-xs text-left">
                                <thead className="bg-slate-50 border-b border-slate-200 uppercase tracking-wider text-slate-500 font-heading">
                                    <tr>
                                        <th className="p-3.5 font-bold">Username</th>
                                        <th className="p-3.5 font-bold">Password</th>
                                        <th className="p-3.5 font-bold">Role</th>
                                        <th className="p-3.5 font-bold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {appUsers.map((u, i) => (
                                        <tr key={i} className="hover:bg-slate-50/70">
                                            <td className="p-3.5 font-bold text-slate-900">{u.username}</td>
                                            <td className="p-3.5 font-mono text-slate-500">{u.password}</td>
                                            <td className="p-3.5">
                                                <span className={`px-2.5 py-1 rounded-xl text-[11px] font-extrabold ${u.role === 'admin' ? 'bg-blue-50 text-blue-800 border border-blue-200' : 'bg-orange-50 text-orange-800 border border-orange-200'}`}>
                                                    {u.role.toUpperCase()}
                                                </span>
                                            </td>
                                            <td className="p-3.5 text-center">
                                                {(u.username.toLowerCase() !== 'admin' && u.username.toLowerCase() !== 'mikro') ? (
                                                    <button onClick={() => removeUser(u.username)} className="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg transition" title="Hapus User">
                                                        <i className="fas fa-trash-can"></i>
                                                    </button>
                                                ) : (
                                                    <span className="text-[11px] text-slate-400 font-semibold italic">Akun Sistem</span>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        /* ==========================================================
   TOP-LEVEL COMPONENT: LeaderboardView (Paket 1 Enhanced with Date Range)
   (Klasemen Juara 17 Cabang & AO Bintang PT. Pegadaian Area Medan 1)
   - Khusus AO: Hanya menampilkan nama-nama Account Officer (TIDAK digabung dengan Admin Mikro)
   - Dilengkapi Filter Range Tanggal (Dari Tanggal s/d Sampai Tanggal), Harian (Hari Ini), Bulanan, Tahunan, dan Semua Data
========================================================== */
        const LeaderboardView = ({ dataPencairan, cabangList, aoList, adminList, showToast }) => {
            const [viewMode, setViewMode] = useState('cabang'); // 'cabang' | 'ao'
            const [timeframe, setTimeframe] = useState('today'); // 'today' | 'month' | 'year' | 'all' | 'custom'
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth() + 1;
            const todayStr = today.toLocaleDateString('en-CA'); // 'YYYY-MM-DD'
            const monthNamesIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const currentMonthName = monthNamesIndo[today.getMonth()];

            // Hitung jumlah hari dalam rentang jika custom
            const rangeDays = React.useMemo(() => {
                if (startDate && endDate) {
                    const d1 = new Date(startDate);
                    const d2 = new Date(endDate);
                    const diffTime = Math.abs(d2 - d1);
                    return Math.max(1, Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1);
                }
                return 1;
            }, [startDate, endDate]);

            // Format tanggal Indonesia rapi
            const formatIndoDate = (dateStr) => {
                if (!dateStr) return '';
                try {
                    const parts = dateStr.split('-');
                    if (parts.length === 3) {
                        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                    }
                    return dateStr;
                } catch (e) { return dateStr; }
            };

            // Deskripsi periode teks
            const getPeriodDescription = () => {
                if (startDate && endDate) {
                    return `Rentang Tanggal ${formatIndoDate(startDate)} s/d ${formatIndoDate(endDate)} (${rangeDays} Hari)`;
                }
                if (startDate) {
                    return `Mulai Tanggal ${formatIndoDate(startDate)}`;
                }
                if (endDate) {
                    return `Sampai Tanggal ${formatIndoDate(endDate)}`;
                }
                if (timeframe === 'today') {
                    return `Hari Ini (${today.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })})`;
                }
                if (timeframe === 'month') {
                    return `Bulan ${currentMonthName} ${currentYear}`;
                }
                if (timeframe === 'year') {
                    return `Tahun ${currentYear} (YTD)`;
                }
                return 'Semua Data';
            };

            // Filter data by timeframe & date range
            const filteredPencairan = React.useMemo(() => {
                return (dataPencairan || []).filter(item => {
                    if (!item.Tanggal) return timeframe === 'all';
                    const dStr = normalizeDate(item.Tanggal);
                    if (!dStr) return timeframe === 'all';

                    // Filter Range Tanggal eksplisit jika diisi
                    if (startDate || endDate || timeframe === 'custom') {
                        let match = true;
                        if (startDate && dStr < startDate) match = false;
                        if (endDate && dStr > endDate) match = false;
                        return match;
                    }

                    if (timeframe === 'today') {
                        return dStr === todayStr;
                    } else if (timeframe === 'month') {
                        const [y, m] = dStr.split('-').map(Number);
                        return y === currentYear && m === currentMonth;
                    } else if (timeframe === 'year') {
                        const [y] = dStr.split('-').map(Number);
                        return y === currentYear;
                    }
                    return true;
                });
            }, [dataPencairan, timeframe, startDate, endDate, currentYear, currentMonth, todayStr]);

            // Compute rankings (Strict separation: Cabang vs AO murni tanpa Admin Mikro)
            const rankingData = React.useMemo(() => {
                const cleanVal = (val) => Number(String(val || 0).replace(/\D/g, '')) || 0;

                // Set of Admin Mikro names to strictly exclude from AO leaderboard
                const adminNames = (adminList && adminList.length > 0 ? adminList : DEFAULT_ADMIN_LIST);
                const adminSet = new Set(adminNames.map(a => a.trim().toLowerCase()));

                if (viewMode === 'cabang') {
                    const map = {};
                    // Initialize with all 17 branches from cabangList
                    (cabangList && cabangList.length > 0 ? cabangList : DEFAULT_CABANG_LIST).forEach(c => {
                        const key = c.trim().toUpperCase();
                        map[key] = { name: c, totalUP: 0, noa: 0, products: {} };
                    });

                    filteredPencairan.forEach(item => {
                        const rawCab = (item.Cabang || 'Lainnya').trim();
                        const key = rawCab.toUpperCase();
                        if (!map[key]) {
                            map[key] = { name: rawCab, totalUP: 0, noa: 0, products: {} };
                        }
                        const up = cleanVal(item.Plafon);
                        map[key].totalUP += up;
                        map[key].noa += 1;
                        const prod = item.Produk || 'Lainnya';
                        map[key].products[prod] = (map[key].products[prod] || 0) + up;
                    });

                    // Target per Cabang proporsional:
                    // Harian (Hari Ini) = Rp 36.000.000 (36 Jt per hari)
                    // Range Tanggal = 36 Jt * rangeDays
                    // Bulanan = Rp 900.000.000 (900 Jt)
                    // Tahunan = Rp 10.800.000.000
                    const defaultBranchTarget =
                        (startDate || endDate || timeframe === 'custom') ? (36000000 * rangeDays) :
                            (timeframe === 'today' ? 36000000 :
                                (timeframe === 'month' ? 900000000 :
                                    (timeframe === 'year' ? 10800000000 : 15000000000)));

                    const list = Object.values(map).map(item => {
                        const target = defaultBranchTarget;
                        const achievement = target > 0 ? (item.totalUP / target) * 100 : 0;
                        const avgTicket = item.noa > 0 ? Math.round(item.totalUP / item.noa) : 0;
                        return {
                            ...item,
                            target,
                            achievement,
                            avgTicket
                        };
                    });

                    list.sort((a, b) => b.totalUP - a.totalUP || b.noa - a.noa);
                    return list;
                } else {
                    // Aggregate STRICTLY by AO (Account Officer saja, BUKAN Admin Mikro)
                    const map = {};

                    // Inisialisasi awal dengan seluruh daftar AO resmi Area Medan 1
                    const officialAoList = (aoList && aoList.length > 0 ? aoList : DEFAULT_AO_LIST);
                    officialAoList.forEach(ao => {
                        const clean = ao.trim();
                        if (!clean || adminSet.has(clean.toLowerCase())) return; // Filter ketat: jangan masukkan jika nama admin
                        const key = clean.toUpperCase();
                        map[key] = {
                            name: clean,
                            cabang: '-',
                            totalUP: 0,
                            noa: 0
                        };
                    });

                    filteredPencairan.forEach(item => {
                        // HANYA mengambil field item.AO (Pemrakarsa Kredit), TIDAK mengambil item.Petugas (Admin Mikro)!
                        const rawAO = (item.AO || '').trim();
                        if (!rawAO) return; // Lewati jika field AO kosong
                        if (adminSet.has(rawAO.toLowerCase())) return; // Filter ketat: jika nama tercatat sebagai Admin Mikro, abaikan!

                        const key = rawAO.toUpperCase();
                        if (!map[key]) {
                            map[key] = {
                                name: rawAO,
                                cabang: item.Cabang || '-',
                                totalUP: 0,
                                noa: 0
                            };
                        }
                        const up = cleanVal(item.Plafon);
                        map[key].totalUP += up;
                        map[key].noa += 1;
                        if ((!map[key].cabang || map[key].cabang === '-') && item.Cabang) {
                            map[key].cabang = item.Cabang;
                        }
                    });

                    // Target per AO proporsional:
                    // Harian (Hari Ini) = Rp 14.000.000 (14 Jt per hari)
                    // Range Tanggal = 14 Jt * rangeDays
                    // Bulanan = Rp 350.000.000 (350 Jt)
                    // Tahunan = Rp 4.200.000.000
                    const defaultAoTarget =
                        (startDate || endDate || timeframe === 'custom') ? (14000000 * rangeDays) :
                            (timeframe === 'today' ? 14000000 :
                                (timeframe === 'month' ? 350000000 :
                                    (timeframe === 'year' ? 4200000000 : 5000000000)));

                    const list = Object.values(map).map(item => {
                        const target = defaultAoTarget;
                        const achievement = target > 0 ? (item.totalUP / target) * 100 : 0;
                        const avgTicket = item.noa > 0 ? Math.round(item.totalUP / item.noa) : 0;
                        return {
                            ...item,
                            target,
                            achievement,
                            avgTicket
                        };
                    });

                    list.sort((a, b) => b.totalUP - a.totalUP || b.noa - a.noa);
                    return list;
                }
            }, [filteredPencairan, viewMode, cabangList, aoList, adminList, timeframe, startDate, endDate, rangeDays]);

            const totalAllUP = rankingData.reduce((acc, curr) => acc + curr.totalUP, 0);
            const totalAllNOA = rankingData.reduce((acc, curr) => acc + curr.noa, 0);

            // Filter by search
            const displayedRankings = rankingData.filter(item =>
                item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.cabang && item.cabang.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            // Top 3 Podium
            const top1 = rankingData[0] || null;
            const top2 = rankingData[1] || null;
            const top3 = rankingData[2] || null;

            // WA Share Generator
            const copyWAClassification = () => {
                const title = viewMode === 'cabang' ? 'KLASEMEN 17 CABANG' : 'KLASEMEN AO BINTANG';
                let text = `🏆 *${title} MIKRO AREA MEDAN 1*\n`;
                text += `📅 *Periode:* ${getPeriodDescription()}\n`;
                text += `💰 *Total Realisasi Area:* ${formatRupiah(totalAllUP)} (${totalAllNOA} Nasabah)\n\n`;
                text += `🥇 *TOP 3 JUARA:* \n`;
                if (top1 && top1.totalUP > 0) text += `1. 👑 *${top1.name}*: ${formatRupiah(top1.totalUP)} (${top1.noa} NOA) - Capaian: ${top1.achievement.toFixed(1)}%\n`;
                if (top2 && top2.totalUP > 0) text += `2. 🥈 *${top2.name}*: ${formatRupiah(top2.totalUP)} (${top2.noa} NOA) - Capaian: ${top2.achievement.toFixed(1)}%\n`;
                if (top3 && top3.totalUP > 0) text += `3. 🥉 *${top3.name}*: ${formatRupiah(top3.totalUP)} (${top3.noa} NOA) - Capaian: ${top3.achievement.toFixed(1)}%\n\n`;

                const activeList = rankingData.filter(item => item.totalUP > 0);
                if (activeList.length > 3) {
                    text += `📊 *Peringkat Selanjutnya:*\n`;
                    activeList.slice(3, 15).forEach((item, idx) => {
                        text += `${idx + 4}. ${item.name}: ${formatRupiah(item.totalUP)} (${item.noa} NOA)\n`;
                    });
                } else if (activeList.length === 0) {
                    text += `_Belum ada data pencairan yang terinput pada periode ini._\n`;
                }
                text += `\n🚀 *Mari terus pacu pencairan dan raih target bersama! Area Medan 1 Juara 1!*`;
                navigator.clipboard.writeText(text);
                showToast('Format teks Klasemen WhatsApp berhasil disalin!', 'success');
            };

            // PDF Export
            const exportPDF = () => {
                if (!window.jspdf) return showToast('Modul PDF belum siap', 'error');
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text('PT. PEGADAIAN - KANWIL MEDAN', 105, 15, { align: 'center' });
                doc.setFontSize(11);
                doc.setFont('helvetica', 'normal');
                doc.text(`LAPORAN KLASEMEN PERFORMA ${viewMode.toUpperCase()} MIKRO AREA MEDAN 1`, 105, 22, { align: 'center' });
                doc.setFontSize(9);
                doc.text(`Periode: ${getPeriodDescription()} | Dicetak: ${new Date().toLocaleDateString('id-ID')}`, 105, 27, { align: 'center' });

                const tableBody = rankingData.map((item, idx) => [
                    idx + 1,
                    item.name,
                    item.cabang || '-',
                    formatRupiah(item.totalUP),
                    item.noa,
                    formatRupiah(item.avgTicket),
                    `${item.achievement.toFixed(1)}%`
                ]);

                doc.autoTable({
                    startY: 32,
                    head: [['Rank', 'Nama', 'Cabang', 'Total Realisasi (UP)', 'NOA', 'Rata-rata UP', 'Capaian']],
                    body: tableBody,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 135, 68], textColor: 255, fontStyle: 'bold' },
                    styles: { fontSize: 8 }
                });

                doc.save(`Klasemen_${viewMode}_${Date.now()}.pdf`);
                showToast('Laporan Klasemen PDF berhasil diunduh!', 'success');
            };

            return (
                <div className="space-y-6">
                    {/* Header Banner Leaderboard */}
                    <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-amber-600 via-yellow-600 to-emerald-800 p-6 md:p-8 text-white shadow-xl border border-amber-400/30">
                        <div className="absolute top-0 right-0 w-96 h-96 bg-yellow-400/15 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex items-center space-x-4">
                                <div className="w-16 h-16 rounded-2xl bg-white/15 backdrop-blur-md flex items-center justify-center text-3xl shadow-md border border-white/20 text-yellow-300">
                                    <i className="fas fa-trophy"></i>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <span className="px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-200 border border-amber-400/30 text-[10px] font-black uppercase tracking-wider">
                                            🏆 JUARA 1 MIKRO
                                        </span>
                                        <span className="text-xs text-amber-100 font-semibold">Area Medan 1</span>
                                        {(startDate || endDate) && (
                                            <span className="px-2 py-0.5 rounded-full bg-blue-400/30 text-blue-100 border border-blue-300/40 text-[10px] font-black uppercase tracking-wider">
                                                📅 RENTANG TANGGAL
                                            </span>
                                        )}
                                        {(!startDate && !endDate && timeframe === 'today') && (
                                            <span className="px-2 py-0.5 rounded-full bg-emerald-400/30 text-emerald-100 border border-emerald-300/40 text-[10px] font-black uppercase tracking-wider animate-pulse">
                                                ⚡ LIVE HARIAN
                                            </span>
                                        )}
                                    </div>
                                    <h1 className="text-2xl md:text-3xl font-black font-heading tracking-tight text-white mt-1">
                                        Klasemen & Leaderboard Juara
                                    </h1>
                                    <p className="text-xs text-amber-100/90 font-medium mt-0.5">
                                        {viewMode === 'cabang' ? 'Peringkat performa 17 Cabang Pegadaian Area Medan 1' : 'Peringkat performa khusus Account Officer (AO) murni tanpa Admin Mikro'}
                                    </p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                <button
                                    onClick={copyWAClassification}
                                    className="px-4 py-2.5 bg-white/20 hover:bg-white/30 text-white rounded-2xl font-bold text-xs flex items-center shadow-md transition backdrop-blur-md border border-white/30"
                                    title="Salin teks klasemen siap kirim ke WhatsApp"
                                >
                                    <i className="fab fa-whatsapp text-sm mr-2 text-emerald-300"></i> Salin WA
                                </button>
                                <button
                                    onClick={exportPDF}
                                    className="px-4 py-2.5 bg-white text-slate-900 hover:bg-amber-50 rounded-2xl font-black text-xs flex items-center shadow-md transition border border-white/40"
                                    title="Unduh Laporan Klasemen dalam format PDF"
                                >
                                    <i className="fas fa-file-pdf text-sm mr-2 text-rose-600"></i> Unduh PDF
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Filter Sub-tab Bar & Timeframe Pills */}
                    <div className="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/90 dark:border-slate-800 shadow-sm">
                        {/* View Mode Toggle: Cabang vs AO */}
                        <div className="bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl flex items-center border border-slate-200 dark:border-slate-700">
                            <button
                                onClick={() => setViewMode('cabang')}
                                className={`px-5 py-2 rounded-xl text-xs font-black transition flex items-center ${viewMode === 'cabang' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}`}
                            >
                                <i className="fas fa-building mr-2"></i> Klasemen 17 Cabang
                            </button>
                            <button
                                onClick={() => setViewMode('ao')}
                                className={`px-5 py-2 rounded-xl text-xs font-black transition flex items-center ${viewMode === 'ao' ? 'bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}`}
                            >
                                <i className="fas fa-user-tie mr-2"></i> Klasemen AO Bintang
                            </button>
                        </div>

                        {/* Timeframe selector: HARI INI, Bulan Ini, Tahun Ini, Semua Data */}
                        <div className="flex flex-wrap items-center gap-2.5">
                            <div className="bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl flex flex-wrap items-center border border-slate-200 dark:border-slate-700">
                                <button
                                    onClick={() => {
                                        setStartDate('');
                                        setEndDate('');
                                        setTimeframe('today');
                                    }}
                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center ${!startDate && !endDate && timeframe === 'today' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-sm font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    <span className={`w-2 h-2 rounded-full mr-1.5 ${!startDate && !endDate && timeframe === 'today' ? 'bg-white' : 'bg-emerald-500 animate-pulse'}`}></span>
                                    Hari Ini
                                </button>
                                <button
                                    onClick={() => {
                                        setStartDate('');
                                        setEndDate('');
                                        setTimeframe('month');
                                    }}
                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${!startDate && !endDate && timeframe === 'month' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    Bulan Ini
                                </button>
                                <button
                                    onClick={() => {
                                        setStartDate('');
                                        setEndDate('');
                                        setTimeframe('year');
                                    }}
                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${!startDate && !endDate && timeframe === 'year' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    Tahun Ini (YTD)
                                </button>
                                <button
                                    onClick={() => {
                                        setStartDate('');
                                        setEndDate('');
                                        setTimeframe('all');
                                    }}
                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${!startDate && !endDate && timeframe === 'all' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'}`}
                                >
                                    Semua Data
                                </button>
                            </div>

                            <div className="relative">
                                <i className="fas fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400"></i>
                                <input
                                    type="text"
                                    placeholder={viewMode === 'cabang' ? 'Cari cabang...' : 'Cari AO...'}
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-semibold text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-amber-500 shadow-xs"
                                />
                            </div>
                        </div>
                    </div>

                    {/* DATE RANGE FILTER BAR: DARI TANGGAL S/D SAMPAI TANGGAL */}
                    <div className="bg-white dark:bg-slate-900 p-4 md:px-6 rounded-3xl border border-slate-200/90 dark:border-slate-800 shadow-sm flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
                        <div className="flex flex-wrap items-center gap-3">
                            <div className="flex items-center space-x-2 text-slate-700 dark:text-slate-200 font-bold text-xs">
                                <span className="w-7 h-7 rounded-xl bg-amber-500/15 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xs">
                                    <i className="fas fa-calendar-days"></i>
                                </span>
                                <span>Filter Rentang Tanggal {viewMode === 'ao' ? 'AO' : 'Cabang'}:</span>
                            </div>

                            <div className="flex items-center space-x-2">
                                <span className="text-[11px] font-bold text-slate-400 uppercase">Dari</span>
                                <input
                                    type="date"
                                    value={startDate}
                                    onChange={(e) => {
                                        setStartDate(e.target.value);
                                        setTimeframe('custom');
                                    }}
                                    className="p-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-amber-500 shadow-xs cursor-pointer"
                                />
                            </div>

                            <div className="flex items-center space-x-2">

function nearestDiscount(list, ratio) {
    if (!list || !list.length) return 0;
    let best = null;
    for (const [r, d] of list) {
        if (Math.abs(r - ratio) < 1e-9) return d;
        if (ratio <= r + 1e-9 && (!best || r < best[0])) best = [r, d];
    }
    if (best) return best[1];
    return list[list.length - 1][1];
}

function ceil100(n) { return Math.ceil(n / 100) * 100; }
function floor1e5(n) { return Math.floor(n / 100000) * 100000; }
function formatPct(n, d = 2) {
    return Number.isFinite(n) ? (n * 100).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%' : '-';
}

// Dedicated precise money and percentage formatters for RTT simulation
const rupiah = (n) => {
    if (n === null || n === undefined || !Number.isFinite(Number(n))) return '-';
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
    }).format(Math.round(Number(n)));
};

const pct = (n, d = 2) => {
    return Number.isFinite(n) ? (n * 100).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%' : '-';
};

// Reusable Currency Input Field Component
const CurrencyInputField = ({ label, value, onChange, readOnly = false, badge = null, helper = null }) => {
    const formatDisplay = (val) => {
        if (!val && val !== 0) return '';
        const num = Math.round(Number(val)) || 0;
        return 'Rp ' + num.toLocaleString('id-ID');
    };

    const handleChange = (e) => {
        if (readOnly) return;
        const raw = e.target.value.replace(/\D/g, '');
        const num = Number(raw) || 0;
        onChange(num);
    };

    return (
        <div className="space-y-1.5">
            <div className="flex items-center justify-between">
                <label className="text-xs font-bold text-slate-700 dark:text-slate-300">
                    {label}
                </label>
                {badge && (
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                        {badge}
                    </span>
                )}
            </div>
            <div className="relative">
                <input
                    type="text"
                    inputMode="numeric"
                    readOnly={readOnly}
                    value={formatDisplay(value)}
                    onChange={handleChange}
                    className={`w-full px-3.5 py-2.5 rounded-xl border text-sm font-semibold transition ${

            </div>

                <p className="text-[11px] text-slate-400 dark:text-slate-500">{helper}</p>

const SimulasiRttView = ({ showToast }) => {
    const [mode, setMode] = useState('mg'); // 'mg' = Multiguna, 'gr' = Griya
    
    // Multiguna State (Default 200 Jt lolos RPC/LTV)
    const [mgPlafon] = useState(500000000);

    const [mgUp, setMgUp] = useState(200000000);
    const [mgTenor, setMgTenor] = useState(48);
    const [mgRate] = useState(0.00435); // 0.435% per bulan
    const [mgThp, setMgThp] = useState(15000000);
    const [mgPayroll, setMgPayroll] = useState(2000000);

    // Griya State (Default 240 Jt lolos RPC/LTV)
    const [grPlafon] = useState(1000000000);
    const [grUpPengajuan, setGrUpPengajuan] = useState(624900000);
    const [grHps, setGrHps] = useState(1000000000);
    const [grLtv] = useState(0.99);
    const [grUp, setGrUp] = useState(240000000);
    const [grTenor, setGrTenor] = useState(240);
    const [grThp, setGrThp] = useState(10000000);
    const [grPayroll, setGrPayroll] = useState(3000000);

    // Calculation control state - data only appears after clicking "Hitung Simulasi"
    const [hasCalculated, setHasCalculated] = useState(false);
    const [isParamChanged, setIsParamChanged] = useState(false);
    const [calcData, setCalcData] = useState(null);

    // Table filter state
    const [filterPeriod, setFilterPeriod] = useState('all'); // 'all', 'year1', 'lastYear'
    const [searchMonth, setSearchMonth] = useState('');

    const onParamChange = () => {
        setIsParamChanged(true);
    };

    const handleSwitchMode = (newMode) => {
        setMode(newMode);
        setHasCalculated(false);
        setIsParamChanged(false);
        setCalcData(null);
    };

    // Reset Handlers
    const resetMG = (useExcelExample = false) => {
        setMgUpPengajuan(300000000);
        setMgHps(450000000);
        setMgUp(useExcelExample ? 250000000 : 200000000);
        setMgTenor(48);
        setMgThp(15000000);
        setMgPayroll(2000000);
        setHasCalculated(false);
        setIsParamChanged(false);
        setCalcData(null);
        if (showToast) {
            showToast(useExcelExample ? 'Diisi contoh workbook Excel (250 Jt)' : 'Parameter Multiguna direset ke default lolos (200 Jt)', 'info');
        }
    };

    const resetGR = (useExcelExample = false) => {
        setGrUpPengajuan(624900000);
        setGrHps(1000000000);
        setGrUp(useExcelExample ? 624900000 : 240000000);
        setGrTenor(240);
        setGrThp(10000000);
        setGrPayroll(3000000);
        setHasCalculated(false);
        setIsParamChanged(false);
        setCalcData(null);
        if (showToast) {
            showToast(useExcelExample ? 'Diisi contoh workbook Excel (624.9 Jt)' : 'Parameter Griya direset ke default lolos (240 Jt)', 'info');
        }
    };

    // Calculation Function: runs when user clicks "Hitung Simulasi"
    const handleHitungSimulasi = (overrideUp = null) => {
        if (mode === 'mg') {
            const currentUpVal = overrideUp !== null ? overrideUp : mgUp;
            const taksiran = mgHps * 1;
            const upMaxLtv = Math.min(mgHps * mgLtv, mgPlafon);
            const upMaxRpc = (Math.floor(((mgThp * 0.5) - mgPayroll) * mgTenor)) / (1 + (mgTenor * mgRate));
            const upMaxApproved = Math.min(mgPlafon, upMaxLtv, upMaxRpc);
            const isExceeding = currentUpVal > upMaxApproved;
            
            const ratio = taksiran > 0 ? Math.round((upMaxApproved / taksiran) * 100) / 100 : 0;
            const pokok = mgTenor > 0 ? currentUpVal / mgTenor : 0;
            const munah = taksiran * mgRate;
            const discount = nearestDiscount(RTT_DATA.mgMumah, ratio);
            const munahNett = munah * (1 - discount);
            const angsuran = ceil100(pokok + munahNett);

            let sisaPokok = currentUpVal;
            const schedule = [];
            for (let m = 1; m <= mgTenor; m++) {
                const p = currentUpVal / mgTenor;
                const mn = munahNett;
                const a = ceil100(p + mn);
                if (m === mgTenor) {
                    sisaPokok = 0;
                } else {
                    sisaPokok = Math.max(0, sisaPokok - (a - mn));
                }
                schedule.push({
                    month: m,
                    pokok: p,
                    munahNett: mn,
                    angsuran: a,
                    sisaPokok: sisaPokok
                });
            }

            setCalcData({
                mode: 'mg',
                taksiran,
                upMaxLtv,
                upMaxRpc,
                upMaxApproved,
                isExceeding,
                ratio,
                discount,
                pokok,
                munah,
                munahNett,
                angsuran,
                schedule,
                totalPokok: currentUpVal,
                totalMunah: munahNett * mgTenor,
                totalAngsuran: angsuran * mgTenor,
                tenor: mgTenor,
                up: currentUpVal
            });
        } else {
            const currentUpVal = overrideUp !== null ? overrideUp : grUp;
            const years = grTenor / 12;
            const taksiran = grHps;
            const ratio = taksiran > 0 ? Math.round((currentUpVal / taksiran) * 100) / 100 : 0;
            const discount = nearestDiscount(RTT_DATA.grMumah, ratio);
            const firstRate = Number(RTT_DATA.rateMap[String(years)]?.['1'] || 0);
            const rateVal = firstRate / 100;
            const firstMunah = taksiran * rateVal;
            const firstMunahNett = firstMunah * (1 - discount);
            const firstAngsuran = ceil100((currentUpVal / grTenor) + firstMunahNett);
            const rpcRatio = currentUpVal > 0 ? (firstMunahNett * grTenor) / currentUpVal : 0;
            const upMaxRpc = floor1e5((((grThp * 0.5) - grPayroll) * grTenor) / (1 + rpcRatio));
            const upMaxLtv = taksiran * grLtv;
            const upMaxApproved = Math.min(upMaxRpc, upMaxLtv);
            const isExceeding = currentUpVal > upMaxApproved;

            let sisaPokok = currentUpVal;
            const schedule = [];
            let totalMunahAccum = 0;
            let totalAngsuranAccum = 0;

            for (let m = 1; m <= grTenor; m++) {
                const p = currentUpVal / grTenor;
                const rateM = Number(RTT_DATA.rateMap[String(years)]?.[String(m)] || 0);
                const mn = taksiran * (rateM / 100) * (1 - discount);
                const a = ceil100(p + mn);
                if (m === grTenor) {
                    sisaPokok = 0;
                } else {
                    sisaPokok = Math.max(0, sisaPokok - (a - mn));
                }
                totalMunahAccum += mn;
                totalAngsuranAccum += a;

                schedule.push({
                    month: m,
                    rateM: rateM,
                    pokok: p,
                    munahNett: mn,
                    angsuran: a,
                    sisaPokok: sisaPokok
                });
            }

            setCalcData({
                mode: 'gr',
                years,
                taksiran,
                ratio,
                discount,
                firstRate,
                rateVal,
                firstMunahNett,
                firstAngsuran,
                rpcRatio,
                upMaxRpc,
                upMaxLtv,
                upMaxApproved,
                isExceeding,

                totalPokok: currentUpVal,
                totalMunah: totalMunahAccum,
                totalAngsuran: totalAngsuranAccum,
                tenor: grTenor,
                up: currentUpVal
            });

                            localStorage.setItem('nplData', JSON.stringify(result.npl));
                        }

                        let klaimCount = 0;
                        if (result.klaim && Array.isArray(result.klaim)) {
                            setKlaimData(result.klaim);
                            localStorage.setItem('klaimData', JSON.stringify(result.klaim));
                            klaimCount = result.klaim.length;
                        }

                            setReportData(result.report);
                            localStorage.setItem('reportData', JSON.stringify(result.report));
                        }

                                if (item.AdminMikro && String(item.AdminMikro).trim() !== '') adm.push(String(item.AdminMikro).trim());
                                if (item.Cabang && String(item.Cabang).trim() !== '') cab.push(String(item.Cabang).trim());
                            });

                            const uniqueProd = [...new Set(prod)];
                            const uniqueAdm = [...new Set(adm)];
                            const uniqueCab = [...new Set(cab)];

                            if (uniqueAo.length > 0) { setAoList(uniqueAo); localStorage.setItem('aoList', JSON.stringify(uniqueAo)); }
                            if (uniqueProd.length > 0) { setProductList(uniqueProd); localStorage.setItem('productList', JSON.stringify(uniqueProd)); }
                            if (uniqueAdm.length > 0) { setAdminList(uniqueAdm); localStorage.setItem('adminList', JSON.stringify(uniqueAdm)); }
                            if (uniqueCab.length > 0) { setCabangList(uniqueCab); localStorage.setItem('cabangList', JSON.stringify(uniqueCab)); }

                                username: u.Username || u.username,
                                password: u.Password || u.password,
                                role: u.Role || u.role
