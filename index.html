<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Area Medan 1</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #eff6ff; color: #1d4ed8; border-right: 4px solid #1d4ed8; font-weight: 600; }
        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // URL GOOGLE APPS SCRIPT TERBARU
        const GLOBAL_SHEET_URL = "https://script.google.com/macros/s/AKfycbw68rJ4Bm9RaZpoXc8uLuq7yio9EuS0t6VOsgo7NQ59FNRBQeUMC9HRkYXA5ONzuth0/exec";

        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const App = () => {
            const SvgLogo = ({ className }) => (
                <svg viewBox="0 0 400 400" className={className} xmlns="http://www.w3.org/2000/svg">
                    <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#f97316" strokeWidth="10" />
                    <path d="M 200 10 A 190 190 0 0 1 390 200" fill="none" stroke="#0f172a" strokeWidth="15" />
                    <path d="M 10 200 A 190 190 0 0 0 200 390" fill="none" stroke="#0f172a" strokeWidth="15" />
                    <path d="M 50 350 L 140 260" stroke="#f97316" strokeWidth="8" strokeLinecap="round" />
                    <path d="M 40 320 L 120 240" stroke="#fbbf24" strokeWidth="6" strokeLinecap="round" />
                    <path d="M 80 360 L 160 280" stroke="#fbbf24" strokeWidth="6" strokeLinecap="round" />
                    <g transform="translate(180, 150) rotate(45)">
                        <path d="M0,-80 C30,-30 40,40 40,80 L-40,80 C-40,40 -30,-30 0,-80 Z" fill="#ffffff" stroke="#0f172a" strokeWidth="8"/>
                        <circle cx="0" cy="-10" r="12" fill="#f97316" stroke="#0f172a" strokeWidth="4"/>
                        <path d="M-40,40 L-70,80 L-40,80 Z" fill="#0f172a"/>
                        <path d="M40,40 L70,80 L40,80 Z" fill="#0f172a"/>
                        <path d="M0,40 L0,90" stroke="#0f172a" strokeWidth="8"/>
                    </g>
                    <g transform="translate(160, 210) rotate(-15)">
                        <path d="M 0 0 L 220 0 L 200 100 L -20 100 Z" fill="#0f172a" />
                        <text x="20" y="35" fill="#ffffff" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="30" letterSpacing="1">AREA</text>
                        <text x="20" y="65" fill="#ffffff" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="30" letterSpacing="1">MEDAN</text>
                        <text x="20" y="90" fill="#f97316" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="24" letterSpacing="2">JUARA</text>
                        <text x="160" y="60" fill="#f97316" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="60">1</text>
                    </g>
                </svg>
            );

            const [activeTab, setActiveTab] = useState('dashboard');
            const [data, setData] = useState([]);
            const [estimasiData, setEstimasiData] = useState([]);
            const [sheetUrl, setSheetUrl] = useState(GLOBAL_SHEET_URL);
            const [isLoading, setIsLoading] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            const [userRole, setUserRole] = useState(null);
            const [aoList, setAoList] = useState([]);
            const [adminList, setAdminList] = useState([]);
            const [productList, setProductList] = useState([]);
            
            const [kol1Data, setKol1Data] = useState([]);
            const [larData, setLarData] = useState([]);
            const [nplData, setNplData] = useState([]);
            const [reportData, setReportData] = useState([]);

            const defaultUsers = [
                { username: 'admin', password: 'Area@123!', role: 'admin' },
                { username: 'ao', password: 'ao123', role: 'ao' }
            ];
            const [appUsers, setAppUsers] = useState(defaultUsers);
            const [loginData, setLoginData] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');

            useEffect(() => {
                const savedRole = localStorage.getItem('userRole');
                if (savedRole) {
                    setUserRole(savedRole);
                    setActiveTab('dashReal'); // Force specific initial tab
                }
                const loadData = (key, setter) => {
                    const item = localStorage.getItem(key);
                    if (item) setter(JSON.parse(item));
                };
                loadData('mikroData', setData);
                loadData('estimasiData', setEstimasiData);
                loadData('aoList', setAoList);
                loadData('adminList', setAdminList);
                loadData('productList', setProductList);
                loadData('kol1Data', setKol1Data);
                loadData('larData', setLarData);
                loadData('nplData', setNplData);
                loadData('reportData', setReportData);
                loadData('appUsers', setAppUsers);
            }, []);

            useEffect(() => {
                if (userRole && sheetUrl) syncFromSheet();
            }, [userRole]);

            const showToast = (message, type = 'success') => {
                setToastMessage({ message, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            const syncFromSheet = async () => {
                if (!sheetUrl) return;
                setIsLoading(true);
                try {
                    const response = await fetch(sheetUrl);
                    const result = await response.json();
                    
                    if(result) {
                        const processDates = (arr) => arr.filter(item => item.Tanggal || item.Nama).map(item => {
                            if (item.Tanggal) {
                                const d = new Date(item.Tanggal);
                                if (!isNaN(d.getTime())) {
                                    d.setHours(d.getHours() + 7); // Adjust timezone for Indonesia (WIB)
                                    item.Tanggal = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                                }
                            }
                            return item;
                        });

                        if(result.pencairan) { const validData = processDates(result.pencairan); setData(validData); localStorage.setItem('mikroData', JSON.stringify(validData)); }
                        if(result.estimasi) { const validEst = processDates(result.estimasi); setEstimasiData(validEst); localStorage.setItem('estimasiData', JSON.stringify(validEst)); }
                        if(result.kol1) { setKol1Data(result.kol1); localStorage.setItem('kol1Data', JSON.stringify(result.kol1)); }
                        if(result.lar) { setLarData(result.lar); localStorage.setItem('larData', JSON.stringify(result.lar)); }
                        if(result.npl) { setNplData(result.npl); localStorage.setItem('nplData', JSON.stringify(result.npl)); }
                        if(result.report) { setReportData(result.report); localStorage.setItem('reportData', JSON.stringify(result.report)); }
                        
                        if(result.master && result.master.length > 1) {
                            const ao = [], prod = [], adm = [];
                            for(let i=1; i<result.master.length; i++){
                                if(result.master[i][0]) ao.push(result.master[i][0]);
                                if(result.master[i][1]) prod.push(result.master[i][1]);
                                if(result.master[i][2]) adm.push(result.master[i][2]);
                            }
                            setAoList(ao); setProductList(prod); setAdminList(adm);
                            localStorage.setItem('aoList', JSON.stringify(ao));
                            localStorage.setItem('productList', JSON.stringify(prod));
                            localStorage.setItem('adminList', JSON.stringify(adm));
                        }
                        if(result.users && result.users.length > 0) {
                            setAppUsers(result.users);
                            localStorage.setItem('appUsers', JSON.stringify(result.users));
                        }
                        showToast('Database Tersinkronisasi!');
                    }
                } catch (error) { showToast('Gagal menarik data dari Database', 'error'); }
                setIsLoading(false);
            };

            const syncMasterToSheet = (newAoList, newProductList, newAdminList) => {
                if (!sheetUrl) return;
                const maxLength = Math.max(newAoList.length, newProductList.length, newAdminList.length);
                const twoDArray = [['AO', 'Produk', 'AdminMikro']];
                for(let i=0; i<maxLength; i++) {
                    twoDArray.push([newAoList[i] || '', newProductList[i] || '', newAdminList[i] || '']);
                }
                fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'save_master', data: twoDArray }) });
            };

            const syncUsersToSheet = (newUsersList) => {
                if (!sheetUrl) return;
                const twoDArray = [['Username', 'Password', 'Role']];
                newUsersList.forEach(u => twoDArray.push([u.username || '', u.password || '', u.role || '']));
                fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'save_users', data: twoDArray }) });
            };

            const handleLoginChange = (e) => {
                setLoginData({ ...loginData, [e.target.name]: e.target.value });
                setLoginError('');
            };

            const processLogin = (e) => {
                e.preventDefault();
                
                // --- FITUR MASTER KEY: Mencegah Anda terkunci dari aplikasi ---
                if (loginData.username === 'admin' && loginData.password === 'Area@123!') {
                    setUserRole('admin');
                    localStorage.setItem('userRole', 'admin');
                    setActiveTab('dashReal');
                    return;
                }

                const validUser = appUsers.find(u => u.username === loginData.username && u.password === loginData.password);
                if (validUser) {
                    setUserRole(validUser.role);
                    localStorage.setItem('userRole', validUser.role);
                    setActiveTab('dashReal');
                } else {
                    setLoginError('Username atau Password salah!');
                }
            };

            const handleLogout = () => {
                setUserRole(null);
                localStorage.removeItem('userRole');
                setLoginData({ username: '', password: '' });
                setActiveTab('dashboard');
            };

            const AdminPanel = () => {
                const [newAo, setNewAo] = useState('');
                const [newAdmin, setNewAdmin] = useState('');
                const [newProduct, setNewProduct] = useState('');
                const [newUser, setNewUser] = useState({ username: '', password: '', role: 'ao' });

                const addAo = () => { if(!newAo) return; const updated = [...aoList, newAo]; setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated)); syncMasterToSheet(updated, productList, adminList); setNewAo(''); showToast('AO berhasil ditambahkan'); };
                const removeAo = (ao) => { const updated = aoList.filter(c => c !== ao); setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated)); syncMasterToSheet(updated, productList, adminList); showToast('AO dihapus', 'error'); };
                
                const addAdmin = () => { if(!newAdmin) return; const updated = [...adminList, newAdmin]; setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated)); syncMasterToSheet(aoList, productList, updated); setNewAdmin(''); showToast('Admin berhasil ditambahkan'); };
                const removeAdmin = (adm) => { const updated = adminList.filter(c => c !== adm); setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated)); syncMasterToSheet(aoList, productList, updated); showToast('Admin dihapus', 'error'); };

                const addProduct = () => { if(!newProduct) return; const updated = [...productList, newProduct]; setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated)); syncMasterToSheet(aoList, updated, adminList); setNewProduct(''); showToast('Produk berhasil ditambahkan'); };
                const removeProduct = (prod) => { const updated = productList.filter(p => p !== prod); setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated)); syncMasterToSheet(aoList, updated, adminList); showToast('Produk dihapus', 'error'); };

                const addUser = () => {
                    if(!newUser.username || !newUser.password) return showToast('Username & Password wajib diisi', 'error');
                    if(appUsers.some(u => u.username === newUser.username)) return showToast('Username sudah ada!', 'error');
                    const updated = [...appUsers, newUser]; setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated)); syncUsersToSheet(updated);
                    setNewUser({ username: '', password: '', role: 'ao' }); showToast('User berhasil ditambahkan');
                };

                const removeUser = (username) => {
                    if(username === 'admin') return showToast('Admin utama tidak bisa dihapus!', 'error');
                    const updated = appUsers.filter(u => u.username !== username); setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated)); syncUsersToSheet(updated); showToast('User dihapus', 'error');
                };

                const processMasterCSVUpload = (file, type) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, '');
                            const lines = csv.split(/\r\n|\n/).map(line => line.trim().replace(/['"]/g, '')).filter(line => line.length > 0);
                            
                            if (lines.length > 0 && ['AO', 'NAMA', 'NAMA AO', 'NAMA_AO', 'ADMIN', 'ADMIN MIKRO', 'ADMIN_MIKRO', 'PRODUK', 'NAMA PRODUK', 'NAMA_PRODUK'].includes(lines[0].toUpperCase())) {
                                lines.shift();
                            }
                            if (lines.length === 0) throw new Error("File CSV kosong atau format tidak valid.");
                            
                            if (type === 'AO') {
                                const updated = [...new Set([...aoList, ...lines])]; setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated)); syncMasterToSheet(updated, productList, adminList);
                            } else if (type === 'ADMIN') {
                                const updated = [...new Set([...adminList, ...lines])]; setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated)); syncMasterToSheet(aoList, productList, updated);
                            } else if (type === 'PRODUK') {
                                const updated = [...new Set([...productList, ...lines])]; setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated)); syncMasterToSheet(aoList, updated, adminList);
                            }
                            showToast(`Berhasil menambahkan ${lines.length} data baru ke daftar ${type}!`);
                        } catch (error) { showToast(`Gagal Upload CSV ${type}: ${error.message}`, 'error'); }
                    };
                    reader.readAsText(file);
                };

                const downloadTemplateCSV = (type) => {
                    let headers = '';
                    if (type === 'REPORT') headers = 'NAMA_CABANG,TARGET_OSL,REALISASI_OSL,PENCAPAIAN_OSL,TARGET_NPL,REALISASI_NPL,PENCAPAIAN_NPL,TARGET_LAR,REALISASI_LAR,PENCAPAIAN_LAR,TARGET_RATA2,REALISASI_RATA2,PENCAPAIAN_RATA2,TARGET_NOA,REALISASI_NOA,PENCAPAIAN_NOA\n10204:CP MEDAN PETISAH,17.698.150.629,17.792.220.707,100.53%,1.66,4.33,38.33%,11.57,18.72,61.81%,16.843.528.392,16.973.417.363,100.77%,175,56,32.01%';
                    else if (type === 'KOL1') headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,TGL_JATUH_TEMPO,KOLEKTIBILITAS,HARI_TUNGGAKAN,OSL,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,01-10-2026,1,5,5000000,UPC A,CH-1,CABANG A';
                    else headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,KOLEKTIBILITAS,HARI_TUNGGAKAN,UP,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,2,45,5000000,UPC A,CH-1,CABANG A';
                    
                    const blob = new Blob([headers], { type: 'text/csv' });
                    const a = document.createElement('a'); a.href = window.URL.createObjectURL(blob); a.download = `Template_Upload_${type}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };

                const processCSVUpload = (file, type) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, '');
                            const lines = csv.split(/\r\n|\n/).filter(line => line.trim().length > 0);
                            if (lines.length < 2) throw new Error("Data kosong atau format salah");

                            let delimiter = ',';
                            if (lines[0].includes(';')) delimiter = ';';
                            else if (lines[0].includes('\t')) delimiter = '\t';
                            
                            const requiredHeadersLARNPL = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'UP', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];
                            const requiredHeadersREPORT = ['NAMA_CABANG', 'TARGET_OSL', 'REALISASI_OSL', 'PENCAPAIAN_OSL', 'TARGET_NPL', 'REALISASI_NPL', 'PENCAPAIAN_NPL', 'TARGET_LAR', 'REALISASI_LAR', 'PENCAPAIAN_LAR', 'TARGET_RATA2', 'REALISASI_RATA2', 'PENCAPAIAN_RATA2', 'TARGET_NOA', 'REALISASI_NOA', 'PENCAPAIAN_NOA'];
                            const requiredHeadersKOL1 = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];

                            const reqHeaders = type === 'REPORT' ? requiredHeadersREPORT : (type === 'KOL1' ? requiredHeadersKOL1 : requiredHeadersLARNPL);
                            const parsedData = [];
                            const twoDArrayForSheet = [reqHeaders];

                            for (let i = 1; i < lines.length; i++) {
                                const currentLine = lines[i].split(delimiter);
                                if (currentLine.length < 2) continue; 
                                const obj = {}; const rowData = [];
                                reqHeaders.forEach((reqHeader, index) => {
                                    let val = currentLine[index] ? currentLine[index].trim().replace(/['"]/g, '') : '';
                                    obj[reqHeader] = val; rowData.push(val);    
                                });
                                if (rowData.some(v => v !== '')) { parsedData.push(obj); twoDArrayForSheet.push(rowData); }
                            }
                            
                            if (parsedData.length === 0) throw new Error("File tidak memiliki baris data yang valid.");
                            
                            if(type === 'LAR') { setLarData(parsedData); localStorage.setItem('larData', JSON.stringify(parsedData)); } 
                            else if (type === 'NPL') { setNplData(parsedData); localStorage.setItem('nplData', JSON.stringify(parsedData)); } 
                            else if (type === 'KOL1') { setKol1Data(parsedData); localStorage.setItem('kol1Data', JSON.stringify(parsedData)); }
                            else if (type === 'REPORT') { setReportData(parsedData); localStorage.setItem('reportData', JSON.stringify(parsedData)); }
                            
                            if(sheetUrl) {
                                let actionType = type === 'LAR' ? 'upload_lar' : (type === 'NPL' ? 'upload_npl' : (type === 'KOL1' ? 'upload_kol1' : 'upload_report'));
                                fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: actionType, data: twoDArrayForSheet }) });
                                showToast(`Berhasil! ${parsedData.length} data ${type} berhasil diupload.`);
                            }
                        } catch (error) { showToast(`Gagal Upload ${type}: ${error.message}`, 'error'); }
                    };
                    reader.readAsText(file);
                };

                const resetData = async (type) => {
                    if(window.confirm(`Yakin ingin menghapus seluruh data ${type}? Data di Cloud Spreadsheet juga akan dikosongkan.`)) {
                        setIsLoading(true);
                        let actionKey = '';
                        if (type === 'LAR') { setLarData([]); localStorage.removeItem('larData'); actionKey = 'upload_lar'; }
                        else if (type === 'NPL') { setNplData([]); localStorage.removeItem('nplData'); actionKey = 'upload_npl'; }
                        else if (type === 'KOL1') { setKol1Data([]); localStorage.removeItem('kol1Data'); actionKey = 'upload_kol1'; }
                        else if (type === 'REPORT') { setReportData([]); localStorage.removeItem('reportData'); actionKey = 'upload_report'; }
                        
                        if(sheetUrl) { 
                            try {
                                // Await fetch ensures it executes properly before continuing
                                await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: actionKey, data: [] }) }); 
                                showToast(`Data ${type} berhasil dikosongkan!`);
                            } catch (error) {
                                showToast(`Gagal mereset data di server!`, 'error');
                            }
                        }
                        setIsLoading(false);
                    }
                };

                return (
                    <div className="space-y-6">
                        {/* KOTAK UPLOAD DATA CSV (KOL1, LAR, NPL, REPORT) */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            {/* KOL 1 */}
                            <div className="bg-yellow-50 p-5 rounded-xl shadow-sm border border-yellow-200 border-t-4 border-t-yellow-500 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-lg font-bold text-yellow-800"><i className="fas fa-exclamation mr-2"></i>Data KOL 1</h2>
                                    <p className="text-xs text-yellow-700 mt-1">Tunggakan 1 sd 10 Hari</p>
                                    <div className="mt-3 flex gap-2">
                                        <button onClick={() => downloadTemplateCSV('KOL1')} className="text-[10px] bg-white text-yellow-700 px-2 py-1 border border-yellow-300 rounded hover:bg-yellow-100 font-bold"><i className="fas fa-download mr-1"></i> Template</button>
                                        <button onClick={() => resetData('KOL1')} className="text-[10px] bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700 font-bold"><i className="fas fa-trash mr-1"></i> Reset</button>
                                    </div>
                                </div>
                                <div className="w-full relative mt-4">
                                    <input type="file" accept=".csv" onClick={(e) => { e.target.value = null; }} onChange={(e) => { if (e.target.files[0]) processCSVUpload(e.target.files[0], 'KOL1') }} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-2 rounded-lg text-sm flex justify-center items-center pointer-events-none font-medium"><i className="fas fa-upload mr-2"></i> Upload KOL 1</button>
                                </div>
                            </div>
                            
                            {/* LAR */}
                            <div className="bg-orange-50 p-5 rounded-xl shadow-sm border border-orange-200 border-t-4 border-t-orange-500 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-lg font-bold text-orange-800"><i className="fas fa-exclamation-circle mr-2"></i>Data LAR</h2>
                                    <p className="text-xs text-orange-700 mt-1">Tunggakan 11 sd 30 Hari</p>
                                    <div className="mt-3 flex gap-2">
                                        <button onClick={() => downloadTemplateCSV('LAR')} className="text-[10px] bg-white text-orange-700 px-2 py-1 border border-orange-300 rounded hover:bg-orange-100 font-bold"><i className="fas fa-download mr-1"></i> Template</button>

                        doc.setFontSize(14); doc.text(`Report Realisasi Mikro - Area Medan 1`, 14, 15);
                        doc.setFontSize(10); doc.text(`Cabang: ${selectedCabang}`, 14, 22);

                        if (selectedCabang === 'Semua') {
                            const tableColumn = ["Cabang", "Tgt OSL", "Real OSL", "Capai OSL", "Tgt NPL", "Real NPL", "Capai NPL", "Tgt LAR", "Real LAR", "Capai LAR", "Tgt Rata2", "Real Rata2", "Capai Rata2", "Tgt NOA", "Real NOA", "Capai NOA"];

                                item.TARGET_NOA || '-', item.REALISASI_NOA || '-', item.PENCAPAIAN_NOA || '-'

                        } else {
                            const currentData = reportData.find(item => item.NAMA_CABANG === selectedCabang);

                            const tableColumn = ["Komponen", "Target", "Realisasi", "Pencapaian"];
                            const tableRows = [

                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : !currentData ? (
                            <div className="p-8 text-center text-gray-500">Cabang yang dipilih tidak memiliki data.</div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-blue-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">1. OSL GROS MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-blue-600 mt-1">{currentData.PENCAPAIAN_OSL || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-red-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">2. NPL MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-red-600 mt-1">{currentData.PENCAPAIAN_NPL || '-'}</p></div></div></div>

                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-green-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">4. RATA2 MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-green-600 mt-1">{currentData.PENCAPAIAN_RATA2 || '-'}</p></div></div></div>

                            </div>
                        )}
                    </div>
                );
            };

            const Dashboard = ({ type }) => {
                const isReal = type === 'realisasi';
                const sourceData = isReal ? data : estimasiData;
                const title = isReal ? 'Dashboard Realisasi (Admin)' : 'Dashboard Estimasi (AO)';
                const todayStr = new Date().toISOString().split('T')[0];
                const [selectedPerson, setSelectedPerson] = useState('Semua');
                const [startDate, setStartDate] = useState(todayStr); 
                const [endDate, setEndDate] = useState(todayStr); 
                
                const personListData = sourceData.map(item => item.Petugas).filter(Boolean);
                const masterList = isReal ? adminList : aoList;
                const combinedList = ['Semua', ...new Set([...personListData, ...masterList])];
                const activePersons = new Set(sourceData.map(item => item.Petugas));
                const inactivePersons = masterList.filter(p => !activePersons.has(p));

                const filteredData = sourceData.filter(item => {
                    const matchPerson = selectedPerson === 'Semua' || item.Petugas === selectedPerson;
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchPerson && matchDate;
                });

                const totalPlafon = filteredData.reduce((sum, item) => sum + (Number(item.Plafon) || 0), 0);
                const productStats = filteredData.reduce((acc, item) => {
                    const prod = item.Produk || 'Belum Kategori';
                    if (!acc[prod]) acc[prod] = { count: 0, amount: 0 };
                    acc[prod].count += 1; acc[prod].amount += (Number(item.Plafon) || 0); return acc;
                }, {});

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">

                            </div>
                        </div>

                                return ( <div key={idx} className={`bg-white p-4 rounded-xl shadow-sm border border-gray-100 border-l-4 ${colors[idx % colors.length]}`}><div className="flex justify-between items-start mb-2"><span className="text-[11px] font-bold text-gray-700 uppercase leading-tight">{prod}</span><span className="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-bold">{stats.count} Nsbh</span></div><p className="text-lg font-black text-gray-800 tracking-tight">{formatRupiah(stats.amount)}</p></div> ); 
                            }) ) : ( <div className="col-span-full p-4 bg-gray-50 text-gray-500 text-center rounded-lg border border-dashed border-gray-200">Tidak ada data di rentang tanggal ini.</div> )}
                        </div></div>
                    </div>
                );
            };

            const FormInput = ({ type }) => {
                const isReal = type === 'realisasi';
                const initialForm = { Tanggal: new Date().toISOString().split('T')[0], Nama: '', NoKredit: '', Produk: productList.length > 0 ? productList[0] : '', Plafon: '', Tenor: '3', Petugas: (isReal ? (adminList.length===1?adminList[0]:'') : (aoList.length===1?aoList[0]:'')) };
                const [form, setForm] = useState(initialForm);
                const listPerson = isReal ? adminList : aoList;
                
                const handleChange = (e) => setForm({...form, [e.target.name]: e.target.value});
                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setIsLoading(true);
                    
                    const formData = {...form};
                    if(!isReal) { formData.NoKredit = '-'; formData.Tenor = '-'; } 
                    
                    const sourceData = isReal ? data : estimasiData;
                    const setter = isReal ? setData : setEstimasiData;
                    const storageKey = isReal ? 'mikroData' : 'estimasiData';
                    
                    const newData = [...sourceData, formData];
                    setter(newData); localStorage.setItem(storageKey, JSON.stringify(newData));

                    if (sheetUrl) {
                        try {
                            await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: type === 'realisasi' ? 'add_pencairan' : 'add_estimasi', data: formData }) });
                            showToast(`Data ${type} berhasil disimpan ke Cloud Database!`);
                        } catch (error) { showToast('Gagal mengirim ke Cloud Database.', 'error'); }
                    }
                    setIsLoading(false);
                    setActiveTab(type === 'realisasi' ? (userRole === 'admin' ? 'dataReal' : 'dashReal') : (userRole === 'admin' ? 'dataEst' : 'dashEst'));
                };

                return (
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 max-w-2xl">
                        <h2 className="text-xl font-bold text-gray-800 mb-6 border-b pb-4">Formulir {isReal ? 'Realisasi Pencairan (Admin)' : 'Estimasi Pencairan (AO)'}</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal</label><input type="date" name="Tanggal" value={form.Tanggal} onChange={handleChange} required className="w-full p-2.5 border rounded-lg bg-gray-50 outline-none" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nama {isReal ? 'Admin Mikro' : 'Petugas AO'}</label>
                                    {listPerson.length > 0 ? ( <select name="Petugas" value={form.Petugas} onChange={handleChange} required className="w-full p-2.5 border rounded-lg bg-white outline-none"><option value="" disabled>-- Pilih Nama --</option>{listPerson.map((p, idx) => <option key={idx} value={p}>{p}</option>)}</select> ) : ( <input type="text" name="Petugas" value={form.Petugas} onChange={handleChange} required placeholder="Ketik Manual" className="w-full p-2.5 border rounded-lg outline-none" /> )}
                                </div>
                                <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Nama Nasabah</label><input type="text" name="Nama" value={form.Nama} onChange={handleChange} required placeholder="Nama Lengkap Nasabah" className="w-full p-2.5 border rounded-lg outline-none" /></div>
                                {isReal && <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Nomor Kredit</label><input type="text" name="NoKredit" value={form.NoKredit} onChange={handleChange} required placeholder="Masukkan Nomor Kredit" className="w-full p-2.5 border rounded-lg outline-none" /></div>}
                                <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Jenis Produk</label><select name="Produk" value={form.Produk} onChange={handleChange} required className="w-full p-2.5 border rounded-lg bg-white outline-none">{productList.map((prod, idx) => <option key={idx} value={prod}>{prod}</option>)}</select></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nominal (Rp)</label><input type="number" name="Plafon" value={form.Plafon} onChange={handleChange} required placeholder="Contoh: 5000000" className="w-full p-2.5 border rounded-lg outline-none" /></div>
                                {isReal && <div><label className="block text-sm font-medium text-gray-700 mb-1">Tenor (Bulan)</label><select name="Tenor" value={form.Tenor} onChange={handleChange} required className="w-full p-2.5 border rounded-lg bg-white outline-none"><option value="3">3 Bulan</option><option value="4">4 Bulan</option><option value="6">6 Bulan</option><option value="12">12 Bulan</option><option value="18">18 Bulan</option><option value="24">24 Bulan</option><option value="36">36 Bulan</option><option value="48">48 Bulan</option><option value="60">60 Bulan</option></select></div>}
                            </div>
                            <div className="pt-4"><button type="submit" disabled={isLoading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg flex items-center justify-center space-x-2 disabled:bg-blue-300">{isLoading ? <><i className="fas fa-spinner fa-spin"></i><span>Menyimpan...</span></> : <><i className="fas fa-save"></i><span>Simpan Data</span></>}</button></div>
                        </form>
                    </div>
                );
            };

            const DataTable = ({ type }) => {
                const isReal = type === 'realisasi';
                const sourceData = isReal ? data : estimasiData;
                const title = isReal ? 'Data Rekap Realisasi' : 'Data Rekap Estimasi';
                
                const todayStr = new Date().toISOString().split('T')[0];
                const [startDate, setStartDate] = useState(todayStr); 
                const [endDate, setEndDate] = useState(todayStr); 
                const [searchTerm, setSearchTerm] = useState('');

                const filteredData = sourceData.filter(item => {
                    const matchSearch = (item.Nama && item.Nama.toLowerCase().includes(searchTerm.toLowerCase())) || (item.Petugas && item.Petugas.toLowerCase().includes(searchTerm.toLowerCase())) || (isReal && item.NoKredit && String(item.NoKredit).includes(searchTerm));
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchSearch && matchDate;
                });

                const downloadFilteredPDF = () => {
                    if (typeof window.jspdf === 'undefined') return showToast('Library PDF belum dimuat', 'error');
                    if (filteredData.length === 0) return showToast('Tidak ada data didownload', 'error');
                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(title, 14, 15);
                        doc.setFontSize(10); doc.text(`Periode: ${startDate} s/d ${endDate}`, 14, 22);
                        
                        let tableColumn = []; let tableRows = [];
                        if(isReal){
                            tableColumn = ["Tanggal", "Nama Nasabah", "No Kredit", "Produk", "Nominal", "Tenor", "Admin"];
                            tableRows = filteredData.map(item => [item.Tanggal||'-', item.Nama||'-', item.NoKredit||'-', item.Produk||'-', formatRupiah(item.Plafon||0), `${item.Tenor||0} Bln`, item.Petugas||'-']);
                        } else {
                            tableColumn = ["Tanggal", "Nama Nasabah", "Produk", "Estimasi (Rp)", "AO"];
                            tableRows = filteredData.map(item => [item.Tanggal||'-', item.Nama||'-', item.Produk||'-', formatRupiah(item.Plafon||0), item.Petugas||'-']);
                        }
                        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: [37, 99, 235] } });
                        doc.save(`Rekap_${type}_${startDate}_sd_${endDate}.pdf`);
                        showToast('File PDF berhasil didownload!');
                    } catch (error) { showToast('Gagal memproses PDF', 'error'); }
                };

                const deleteData = async (itemToDelete) => {
                    if(!window.confirm(`Hapus data ${itemToDelete.Nama}?`)) return;
                    setIsLoading(true);
                    
                    const newData = sourceData.filter(d => d !== itemToDelete);
                    if(isReal) { setData(newData); localStorage.setItem('mikroData', JSON.stringify(newData)); } 
                    else { setEstimasiData(newData); localStorage.setItem('estimasiData', JSON.stringify(newData)); }

                    if (sheetUrl) {
                        try {
                            let tglFormat = itemToDelete.Tanggal; if (tglFormat.includes('T')) tglFormat = tglFormat.split('T')[0];
                            const payload = isReal ? { action: 'delete_pencairan', NoKredit: itemToDelete.NoKredit, Nama: itemToDelete.Nama, Tanggal: tglFormat } : { action: 'delete_estimasi', Produk: itemToDelete.Produk, Nama: itemToDelete.Nama, Tanggal: tglFormat };
                            await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
                            showToast('Data dihapus dari Cloud!');
                        } catch (error) { showToast('Gagal menghapus data dari server.', 'error'); }
                    }
                    setIsLoading(false);
                };

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-6 border-b border-gray-100 space-y-4">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div><h2 className="text-xl font-bold text-gray-800">{title}</h2></div>
                                <div className="flex gap-2">
                                    <button onClick={downloadFilteredPDF} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm flex items-center space-x-2 font-medium"><i className="fas fa-file-pdf"></i><span>PDF</span></button>
                                    <button onClick={syncFromSheet} disabled={isLoading} className="px-4 py-2 bg-green-50 text-green-600 border border-green-200 rounded-lg hover:bg-green-100 transition disabled:opacity-50"><i className={`fas fa-sync-alt ${isLoading ? 'fa-spin' : ''}`}></i></button>
                                </div>
                            </div>
                            <div className="flex flex-col md:flex-row gap-4 items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                                <div className="flex items-center space-x-2 w-full md:w-auto"><label className="text-sm font-medium text-gray-600">Dari:</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="p-2 border rounded-lg text-sm w-full outline-none bg-white" /></div>
                                <div className="flex items-center space-x-2 w-full md:w-auto"><label className="text-sm font-medium text-gray-600">Sampai:</label><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="p-2 border rounded-lg text-sm w-full outline-none bg-white" /></div>
                                <div className="relative w-full md:flex-1"><i className="fas fa-search absolute left-3 top-3 text-gray-400"></i><input type="text" placeholder="Cari Nama/Petugas..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 border rounded-lg outline-none text-sm"/></div>
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead><tr className="bg-gray-50 text-gray-600 text-sm border-b"><th className="p-3 font-medium">Tanggal</th><th className="p-3 font-medium">Nama Nasabah</th><th className="p-3 font-medium">Produk</th><th className="p-3 font-medium">Nominal</th>{isReal && <th className="p-3 font-medium">Tenor</th>}<th className="p-3 font-medium">{isReal ? 'Admin' : 'AO'}</th><th className="p-3 font-medium text-center">Aksi</th></tr></thead>
                                <tbody>
                                    {filteredData.length > 0 ? filteredData.map((item, index) => (
                                        <tr key={index} className="border-b hover:bg-gray-50 text-sm">
                                            <td className="p-3 text-gray-700 whitespace-nowrap">{item.Tanggal}</td>
                                            <td className="p-3 font-medium text-gray-800 whitespace-nowrap">{item.Nama}{isReal && <><br/><span className="text-xs text-gray-400 font-normal">{item.NoKredit}</span></>}</td>
                                            <td className="p-3"><span className="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-medium border border-blue-100">{item.Produk || '-'}</span></td>
                                            <td className="p-3 text-gray-800 font-semibold whitespace-nowrap">{formatRupiah(item.Plafon)}</td>
                                            {isReal && <td className="p-3 text-gray-600 whitespace-nowrap">{item.Tenor} Bln</td>}
                                            <td className="p-3 text-gray-600 whitespace-nowrap">{item.Petugas}</td>
                                            <td className="p-3 text-center"><button onClick={() => deleteData(item)} className="text-red-500 hover:text-red-700 p-2"><i className="fas fa-trash"></i></button></td>
                                        </tr>
                                    )) : <tr><td colSpan={isReal ? "7" : "6"} className="p-8 text-center text-gray-500">Belum ada data.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            if (!userRole) {
                return (
                    <div className="w-full h-screen flex bg-gray-50 absolute z-[100] top-0 left-0 overflow-hidden">
                        <div className="hidden md:flex md:w-1/2 bg-white flex-col items-center justify-center p-12 border-r shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10"><SvgLogo className="w-full max-w-md drop-shadow-xl hover:scale-105 transition-transform duration-700" /></div>
                        <div className="w-full md:w-1/2 flex items-center justify-center p-6 bg-gray-50 relative overflow-hidden">
                            <div className="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none"><SvgLogo className="w-[150%] h-[150%] max-w-none" /></div>
                            <div className="bg-white/95 backdrop-blur p-8 md:p-10 rounded-3xl shadow-xl w-full max-w-md text-center relative z-10 border border-gray-100">
                                <div className="md:hidden mx-auto mb-6 flex justify-center"><SvgLogo className="h-28 w-28 drop-shadow-md" /></div>
                                <h1 className="text-2xl font-bold text-gray-800 mb-2">Dashboard Area Medan 1</h1>
                                <form onSubmit={processLogin} className="space-y-4 text-left mt-8">
                                    {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200"><i className="fas fa-exclamation-circle mr-2"></i> {loginError}</div>}
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Username</label><div className="relative"><i className="fas fa-user absolute left-3 top-3.5 text-gray-400"></i><input type="text" name="username" value={loginData.username} onChange={handleLoginChange} required placeholder="Masukkan Username" className="w-full pl-10 pr-4 py-2.5 border rounded-lg outline-none" /></div></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Password</label><div className="relative"><i className="fas fa-key absolute left-3 top-3.5 text-gray-400"></i><input type="password" name="password" value={loginData.password} onChange={handleLoginChange} required placeholder="Masukkan Password" className="w-full pl-10 pr-4 py-2.5 border rounded-lg outline-none" /></div></div>
                                    <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-semibold shadow-md mt-6 flex justify-center items-center space-x-2"><i className="fas fa-sign-in-alt"></i><span>Masuk Aplikasi</span></button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            const NavItem = ({ tab, icon, label, isActive, onClick }) => (
                <button onClick={() => onClick(tab)} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg transition-colors ${isActive ? 'sidebar-active shadow-sm' : 'text-gray-600 hover:bg-gray-100'}`}>
                    <i className={`fas ${icon} w-5 text-center ${isActive ? 'text-blue-600' : 'text-gray-400'}`}></i><span className="font-medium text-sm text-left">{label}</span>
                </button>
            );

            const NavHeader = ({ label }) => (<div className="pt-5 pb-2 px-4 text-[11px] font-extrabold text-gray-400 uppercase tracking-widest">{label}</div>);

            return (
                <div className="flex h-screen overflow-hidden bg-gray-50">
                    <div className="w-64 bg-white shadow-[2px_0_10px_rgba(0,0,0,0.05)] z-20 flex-col hidden md:flex h-full border-r border-gray-100">
                        <div className="p-6 flex flex-col items-center text-center"><SvgLogo className="h-20 w-20 mb-3 drop-shadow-md" /><h1 className="text-lg font-bold text-gray-800">Area Medan 1</h1></div>
                        <div className="flex-1 overflow-y-auto px-3 pb-6">
                            <NavHeader label="Dashboard" />
                            <NavItem tab="dashReal" icon="fa-chart-pie" label="Realisasi (Admin)" isActive={activeTab==='dashboard'||activeTab==='dashReal'} onClick={setActiveTab} />
                            <NavItem tab="dashEst" icon="fa-chart-bar" label="Estimasi (AO)" isActive={activeTab==='dashEst'} onClick={setActiveTab} />
                            <NavHeader label="Input Data" />
                            <NavItem tab="inputReal" icon="fa-file-invoice-dollar" label="Input Realisasi" isActive={activeTab==='form'||activeTab==='inputReal'} onClick={setActiveTab} />
                            <NavItem tab="inputEst" icon="fa-edit" label="Input Estimasi" isActive={activeTab==='inputEst'} onClick={setActiveTab} />
                            <NavHeader label="Laporan CSV" />
                            <NavItem tab="kol1" icon="fa-exclamation" label="KOL 1 (1 - 10 Hari)" isActive={activeTab==='kol1'} onClick={setActiveTab} />
                            <NavItem tab="lar" icon="fa-exclamation-circle" label="LAR (11 - 30 Hari)" isActive={activeTab==='lar'} onClick={setActiveTab} />
                            <NavItem tab="npl" icon="fa-exclamation-triangle" label="NPL (KOL 3 - 5)" isActive={activeTab==='npl'} onClick={setActiveTab} />
                            <NavItem tab="report" icon="fa-chart-line" label="Report Realisasi" isActive={activeTab==='report'} onClick={setActiveTab} />
                            {userRole === 'admin' && (
                                <>
                                    <NavHeader label="Khusus Admin" />
                                    <NavItem tab="dataReal" icon="fa-table" label="Rekap Realisasi" isActive={activeTab==='data'||activeTab==='dataReal'} onClick={setActiveTab} />
                                    <NavItem tab="dataEst" icon="fa-list-ul" label="Rekap Estimasi" isActive={activeTab==='dataEst'} onClick={setActiveTab} />
                                    <NavItem tab="admin" icon="fa-cog" label="Kelola & Setting" isActive={activeTab==='admin'} onClick={setActiveTab} />
                                </>
                            )}
                        </div>
                        <div className="p-4 border-t border-gray-100 bg-gray-50"><button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-white border border-red-200 text-red-600 rounded-lg hover:bg-red-50 transition font-bold text-sm shadow-sm"><i className="fas fa-sign-out-alt"></i> <span>Keluar</span></button></div>
                    </div>
                    
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="bg-white p-4 shadow-sm flex justify-between items-center md:hidden border-b z-20"><div className="flex items-center space-x-3"><SvgLogo className="h-8 w-8 drop-shadow-sm" /><h1 className="text-md font-bold text-gray-800">Area Medan 1</h1></div><button onClick={handleLogout} className="text-red-500 p-2"><i className="fas fa-sign-out-alt"></i></button></header>
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
                            <div className="max-w-7xl mx-auto">
                                {(activeTab === 'dashboard' || activeTab === 'dashReal') && <Dashboard type="realisasi" />}
                                {activeTab === 'dashEst' && <Dashboard type="estimasi" />}
                                {(activeTab === 'form' || activeTab === 'inputReal') && <FormInput type="realisasi" />}
                                {activeTab === 'inputEst' && <FormInput type="estimasi" />}
                                {activeTab === 'kol1' && <TableKol1View />}
                                {activeTab === 'lar' && <TableNasabahView title="Data LAR 11 sd 30 Hari" data={larData} type="lar" icon="fa-exclamation-circle" />}
                                {activeTab === 'npl' && <TableNasabahView title="Data NPL (KOL 3 sd 5)" data={nplData} type="npl" icon="fa-exclamation-triangle" />}
                                {activeTab === 'report' && <ReportRealisasiView />}
                                {(activeTab === 'data' || activeTab === 'dataReal') && userRole === 'admin' && <DataTable type="realisasi" />}
                                {activeTab === 'dataEst' && userRole === 'admin' && <DataTable type="estimasi" />}
                                {activeTab === 'admin' && userRole === 'admin' && <AdminPanel />}
                            </div>
                        </main>
                        
                        <div className="md:hidden fixed bottom-0 w-full bg-white shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-50 flex justify-around p-2 border-t border-gray-100 overflow-x-auto">
                            <button onClick={() => setActiveTab('dashReal')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab.includes('dash') ? 'text-blue-600' : 'text-gray-400'}`}><i className="fas fa-home mb-1 text-lg"></i><span className="text-[10px] font-medium">Home</span></button>
                            <button onClick={() => setActiveTab('inputReal')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab.includes('input')||activeTab==='form' ? 'text-blue-600' : 'text-gray-400'}`}><i className="fas fa-plus-circle mb-1 text-lg"></i><span className="text-[10px] font-medium">Input</span></button>
                            <button onClick={() => setActiveTab('kol1')} className={`p-2 rounded-lg flex flex-col items-center ${['kol1','lar','npl'].includes(activeTab) ? 'text-orange-500' : 'text-gray-400'}`}><i className="fas fa-file-csv mb-1 text-lg"></i><span className="text-[10px] font-medium">CSV</span></button>
                            {userRole === 'admin' && <button onClick={() => setActiveTab('admin')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab==='admin'||activeTab.includes('data') ? 'text-blue-600' : 'text-gray-400'}`}><i className="fas fa-cog mb-1 text-lg"></i><span className="text-[10px] font-medium">Setting</span></button>}
                        </div>
                    </div>

                    {toastMessage && (
                        <div className={`fixed top-4 right-4 z-[100] px-6 py-4 rounded-xl shadow-2xl flex items-center space-x-3 text-white font-medium transform transition-all duration-300 ${toastMessage.type === 'error' ? 'bg-red-600' : 'bg-gray-800'}`}>
                            <i className={`fas text-lg ${toastMessage.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i><span>{toastMessage.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
