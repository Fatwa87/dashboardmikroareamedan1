<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pencairan Area Medan 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: slideOut 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .sidebar-container { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background: white; border-right: 1px solid #e2e8f0; overflow-y: auto; z-index: 50; }
        .main-content { margin-left: 280px; width: calc(100% - 280px); min-height: 100vh; padding: 2rem; }
        
        @media (max-width: 1024px) {
            .sidebar-container { transform: translateX(-100%); transition: transform 0.3s ease; z-index: 50; }
            .sidebar-container.open { transform: translateX(0); }
            .main-content { margin-left: 0; width: 100%; padding: 1rem; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
            .mobile-overlay.open { display: block; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const GLOBAL_SHEET_URL = "https://script.google.com/macros/s/AKfycbz0SCsPRGJLk8Fqv_4RFkr-yEGU6UK6ggleEl28ffoyDVTyEVyqL96ucLizZc1Ngbcb/exec";

        const App = () => {
            const [userRole, setUserRole] = useState(localStorage.getItem('userRole'));
            const [activeTab, setActiveTab] = useState('dashReal');
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [isLoading, setIsLoading] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            
            // Modal konfirmasi pengganti confirm()
            const [confirmModal, setConfirmModal] = useState({ open: false, title: '', message: '', onConfirm: null });

            // State Data Inti
            const [dataPencairan, setDataPencairan] = useState([]);
            const [dataEstimasi, setDataEstimasi] = useState([]);
            const [kol1Data, setKol1Data] = useState([]);
            const [larData, setLarData] = useState([]);
            const [nplData, setNplData] = useState([]);
            const [reportData, setReportData] = useState([]);
            
            // State Master Data (AO, Admin Mikro, Produk, dan Cabang)
            const [aoList, setAoList] = useState(JSON.parse(localStorage.getItem('aoList')) || []);
            const [adminList, setAdminList] = useState(JSON.parse(localStorage.getItem('adminList')) || []);
            const [productList, setProductList] = useState(JSON.parse(localStorage.getItem('productList')) || []);
            const [cabangList, setCabangList] = useState(JSON.parse(localStorage.getItem('cabangList')) || []);
            
            // Default Master Akun (Master Key Terproteksi)
            const defaultUsers = [{ username: 'admin', password: 'Area@123!', role: 'admin' }];
            const [appUsers, setAppUsers] = useState(JSON.parse(localStorage.getItem('appUsers')) || defaultUsers);

            // Cek Master Key Admin agar tidak pernah terkunci
            useEffect(() => {
                const currentUsers = JSON.parse(localStorage.getItem('appUsers')) || [];
                const hasMasterAdmin = currentUsers.some(u => u.username === 'admin' && u.password === 'Area@123!');
                if (!hasMasterAdmin) {
                    const mergedUsers = [...currentUsers.filter(u => u.username !== 'admin'), ...defaultUsers];
                    setAppUsers(mergedUsers);
                    localStorage.setItem('appUsers', JSON.stringify(mergedUsers));
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

            const formatRupiah = (angka) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
            };

            const syncFromSheet = async () => {
                if (!GLOBAL_SHEET_URL) {
                    showToast('URL Google Sheet belum diatur', 'error');
                    return;
                }
                setIsLoading(true);
                try {
                    const response = await fetch(GLOBAL_SHEET_URL);
                    if (response.ok) {
                        const result = await response.json();
                        if(result.pencairan) setDataPencairan(result.pencairan);
                        if(result.estimasi) setDataEstimasi(result.estimasi);
                        if(result.kol1) { setKol1Data(result.kol1); localStorage.setItem('kol1Data', JSON.stringify(result.kol1)); }
                        if(result.lar) { setLarData(result.lar); localStorage.setItem('larData', JSON.stringify(result.lar)); }
                        if(result.npl) { setNplData(result.npl); localStorage.setItem('nplData', JSON.stringify(result.npl)); }
                        if(result.report) { setReportData(result.report); localStorage.setItem('reportData', JSON.stringify(result.report)); }
                        
                        // BACA MASTER DATA (AO, ADMIN, PRODUK, CABANG)
                        if(result.master && result.master.length > 0) {
                            const ao = [], prod = [], adm = [], cab = [];
                            result.master.forEach(item => {
                                if(item.AO && item.AO.toString().trim() !== '') ao.push(item.AO.toString().trim());
                                if(item.Produk && item.Produk.toString().trim() !== '') prod.push(item.Produk.toString().trim());
                                if(item.AdminMikro && item.AdminMikro.toString().trim() !== '') adm.push(item.AdminMikro.toString().trim());
                                if(item.Cabang && item.Cabang.toString().trim() !== '') cab.push(item.Cabang.toString().trim());
                            });
                            const uniqueAo = [...new Set(ao)];
                            const uniqueProd = [...new Set(prod)];
                            const uniqueAdm = [...new Set(adm)];
                            const uniqueCab = [...new Set(cab)];
                            
                            setAoList(uniqueAo); setProductList(uniqueProd); setAdminList(uniqueAdm); setCabangList(uniqueCab);
                            localStorage.setItem('aoList', JSON.stringify(uniqueAo));
                            localStorage.setItem('productList', JSON.stringify(uniqueProd));
                            localStorage.setItem('adminList', JSON.stringify(uniqueAdm));
                            localStorage.setItem('cabangList', JSON.stringify(uniqueCab));
                        }
                        
                        // BACA DATA AKUN (USERNAME & PASSWORD)
                        if(result.users && result.users.length > 0) {
                            const mappedUsers = result.users.map(u => ({
                                username: u.Username || u.username,
                                password: u.Password || u.password,
                                role: u.Role || u.role
                            })).filter(u => u.username);

                            const cleanUsers = mappedUsers.filter(u => u.username.toLowerCase() !== 'admin');
                            const finalUsers = [...defaultUsers, ...cleanUsers];
                            
                            setAppUsers(finalUsers);
                            localStorage.setItem('appUsers', JSON.stringify(finalUsers));
                        }
                        showToast('Database Tersinkronisasi!');
                    }
                } catch (error) { showToast('Gagal menarik data dari Database', 'error'); }
                setIsLoading(false);
            };

            const syncMasterToSheet = (newAoList, newProductList, newAdminList, newCabangList) => {
                if (!GLOBAL_SHEET_URL) return;
                const maxLen = Math.max(newAoList.length, newProductList.length, newAdminList.length, newCabangList.length);
                const dataToSave = [['AO', 'Produk', 'AdminMikro', 'Cabang']];
                for (let i = 0; i < maxLen; i++) {
                    dataToSave.push([
                        newAoList[i] || '',
                        newProductList[i] || '',
                        newAdminList[i] || '',
                        newCabangList[i] || ''
                    ]);
                }
                fetch(GLOBAL_SHEET_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'save_master', data: dataToSave })
                });
            };

            const syncUsersToSheet = (usersList) => {
                if (!GLOBAL_SHEET_URL) return;
                const dataToSave = [['Username', 'Password', 'Role']];
                usersList.forEach(u => dataToSave.push([u.username, u.password, u.role]));
                fetch(GLOBAL_SHEET_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'save_users', data: dataToSave })
                });
            };

            useEffect(() => {
                const storedKol1 = localStorage.getItem('kol1Data'); if (storedKol1) setKol1Data(JSON.parse(storedKol1));
                const storedLar = localStorage.getItem('larData'); if (storedLar) setLarData(JSON.parse(storedLar));
                const storedNpl = localStorage.getItem('nplData'); if (storedNpl) setNplData(JSON.parse(storedNpl));
                const storedReport = localStorage.getItem('reportData'); if (storedReport) setReportData(JSON.parse(storedReport));
                if (userRole) syncFromSheet();
            }, [userRole]);

            const Login = () => {
                const [loginData, setLoginData] = useState({ username: '', password: '' });
                const [loginError, setLoginError] = useState('');

                const handleLoginChange = (e) => {
                    setLoginData({ ...loginData, [e.target.name]: e.target.value });
                    setLoginError("");
                };

                const processLogin = (e) => {
                    e.preventDefault();
                    const validUser = appUsers.find(u => u.username && u.username.toLowerCase() === loginData.username.toLowerCase() && u.password === loginData.password);
                    if (validUser) {
                        setUserRole(validUser.role);
                        localStorage.setItem('userRole', validUser.role);
                        setActiveTab(validUser.role === 'admin' ? 'dashReal' : 'inReal');
                    } else {
                        setLoginError('Username atau password salah!');
                    }
                };

                return (
                    <div className="min-h-screen flex flex-col md:flex-row items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 p-4 lg:p-12">
                        <div className="mb-8 md:mb-0 md:mr-16 flex flex-col items-center justify-center text-center">
                            <div className="w-56 h-56 md:w-64 md:h-64 bg-white/5 backdrop-blur-md rounded-full flex items-center justify-center border-4 border-orange-500 shadow-2xl relative p-6">
                                <div className="absolute inset-0 rounded-full border border-orange-400/30 animate-pulse"></div>
                                <div className="flex flex-col items-center justify-center relative z-10">
                                    <div className="text-orange-500 font-black text-4xl mb-1 transform -rotate-12">
                                        <i className="fas fa-rocket"></i>
                                    </div>
                                    <div className="bg-gradient-to-r from-orange-500 to-amber-500 text-white px-4 py-1.5 rounded-xl font-black text-lg tracking-wider shadow-lg transform -rotate-3">
                                        AREA MEDAN <span className="text-slate-900 bg-white px-1.5 rounded">1</span>
                                    </div>
                                    <div className="text-orange-400 font-extrabold text-sm tracking-widest mt-1 uppercase">JUARA</div>
                                </div>
                            </div>
                            <h2 className="text-white text-xl font-bold mt-4 tracking-wide">PT. PEGADAIAN AREA MEDAN 1</h2>
                        </div>

                        <div className="bg-white p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100">
                            <h1 className="text-2xl font-black text-slate-800 mb-1">Dashboard Area Medan 1</h1>
                            <p className="text-sm text-slate-500 mb-8">Silakan masuk menggunakan kredensial Anda</p>
                            
                            <form onSubmit={processLogin} className="space-y-5 text-left">
                                {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm flex items-center border border-red-200"><i className="fas fa-exclamation-circle mr-2"></i>{loginError}</div>}
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i className="fas fa-user"></i></div>
                                        <input type="text" name="username" value={loginData.username} onChange={handleLoginChange} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition text-sm font-medium" placeholder="Masukkan Username" required />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i className="fas fa-lock"></i></div>
                                        <input type="password" name="password" value={loginData.password} onChange={handleLoginChange} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition text-sm font-medium" placeholder="Masukkan Password" required />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-2xl transition shadow-lg shadow-blue-600/30 flex items-center justify-center text-sm tracking-wide">
                                    <i className="fas fa-sign-in-alt mr-2"></i> Masuk Aplikasi
                                </button>
                            </form>
                            <div className="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-400">
                                <p>&copy; 2026 PT. Pegadaian Area Medan 1.</p>
                            </div>
                        </div>
                    </div>
                );
            };

            const InputForm = ({ type }) => {
                const isReal = type === 'realisasi';
                const [formData, setFormData] = useState({
                    Tanggal: new Date().toLocaleDateString('en-CA'),
                    Nama: '',
                    Cabang: cabangList.length > 0 ? cabangList[0] : '',
                    NoKredit: '',
                    Produk: productList.length > 0 ? productList[0] : '',
                    Plafon: '',
                    Tenor: '',
                    Petugas: isReal ? (adminList.length > 0 ? adminList[0] : '') : (aoList.length > 0 ? aoList[0] : '')
                });

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setIsLoading(true);
                    
                    const cleanPlafon = formData.Plafon.toString().replace(/\D/g, '');
                    const newData = { ...formData, Plafon: cleanPlafon };
                    
                    if (isReal) setDataPencairan([...dataPencairan, newData]);
                    else setDataEstimasi([...dataEstimasi, newData]);
                    
                    if (GLOBAL_SHEET_URL) {
                        try {
                            await fetch(GLOBAL_SHEET_URL, {
                                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                body: JSON.stringify({ action: isReal ? 'add_pencairan' : 'add_estimasi', data: newData })
                            });
                            showToast(`Data ${isReal ? 'Realisasi' : 'Estimasi'} berhasil disimpan!`);
                        } catch (error) { showToast('Gagal mengirim ke Cloud.', 'error'); }
                    }
                    setIsLoading(false);
                    setFormData({ 
                        ...formData, 
                        Nama: '', 
                        NoKredit: '', 
                        Plafon: '', 
                        Tenor: '', 
                        Cabang: cabangList.length > 0 ? cabangList[0] : '' 
                    });
                };

                return (
                    <div className="max-w-2xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-10">
                        <div className="flex items-center mb-6 pb-4 border-b border-slate-100">
                            <div className={`p-3.5 rounded-2xl mr-4 ${isReal ? 'bg-blue-50 text-blue-600' : 'bg-purple-50 text-purple-600'}`}>
                                <i className={`fas ${isReal ? 'fa-file-invoice-dollar' : 'fa-edit'} text-2xl`}></i>
                            </div>
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Input Data {isReal ? 'Realisasi' : 'Estimasi'}</h2>
                                <p className="text-sm text-slate-500">Silakan lengkapi formulir di bawah ini</p>
                            </div>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tanggal {isReal ? 'Pencairan' : 'Estimasi'}</label>
                                    <input type="date" value={formData.Tanggal} onChange={(e)=>setFormData({...formData, Tanggal: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Cabang</label>
                                    <select value={formData.Cabang} onChange={(e)=>setFormData({...formData, Cabang: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" required>
                                        <option value="">-- Pilih Cabang --</option>
                                        {cabangList.map((c, i)=><option key={i} value={c}>{c}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nama Nasabah</label>
                                <input type="text" value={formData.Nama} onChange={(e)=>setFormData({...formData, Nama: e.target.value.toUpperCase()})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" placeholder="Nama lengkap nasabah" required />
                            </div>

                            {isReal && (
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nomor Kredit</label>
                                    <input type="text" value={formData.NoKredit} onChange={(e)=>setFormData({...formData, NoKredit: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" placeholder="Nomor kontrak/kredit" required />
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Jenis Produk</label>
                                    <select value={formData.Produk} onChange={(e)=>setFormData({...formData, Produk: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" required>
                                        <option value="">-- Pilih Produk --</option>
                                        {productList.map((p, i)=><option key={i} value={p}>{p}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">{isReal ? 'Plafon Pencairan (Rp)' : 'Estimasi Pencairan (Rp)'}</label>
                                    <input type="text" value={formData.Plafon} onChange={(e)=>{ const val = e.target.value.replace(/\D/g, ''); setFormData({...formData, Plafon: formatRupiah(val).replace('Rp', '').trim()}) }} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" placeholder="0" required />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                {isReal && (
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tenor (Bulan)</label>
                                        <input type="number" value={formData.Tenor} onChange={(e)=>setFormData({...formData, Tenor: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" placeholder="12" required />
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">{isReal ? 'Nama Admin Mikro' : 'Nama Petugas / AO'}</label>
                                    <select value={formData.Petugas} onChange={(e)=>setFormData({...formData, Petugas: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-600" required>
                                        <option value="">-- Pilih Petugas --</option>
                                        {(isReal ? adminList : aoList).map((opt, i)=><option key={i} value={opt}>{opt}</option>)}
                                    </select>
                                </div>
                            </div>

                            <button type="submit" disabled={isLoading} className={`w-full py-3.5 px-4 rounded-2xl text-white font-bold transition flex justify-center items-center text-sm shadow-lg ${isReal ? 'bg-blue-600 hover:bg-blue-700 shadow-blue-600/30' : 'bg-purple-600 hover:bg-purple-700 shadow-purple-600/30'} ${isLoading ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                {isLoading ? <><i className="fas fa-spinner fa-spin mr-2"></i>Menyimpan...</> : <><i className="fas fa-save mr-2"></i>Simpan Data {isReal ? 'Realisasi' : 'Estimasi'}</>}
                            </button>
                        </form>
                    </div>
                );
            };

            const Dashboard = ({ type }) => {
                const isReal = type === 'realisasi';
                const rawData = isReal ? dataPencairan : dataEstimasi;
                const [filterDate, setFilterDate] = useState(new Date().toLocaleDateString('en-CA'));
                const [dateMode, setDateMode] = useState('today');

                const filteredData = rawData.filter(item => {
                    if (dateMode === 'all') return true;
                    const itemDate = new Date(item.Tanggal);
                    itemDate.setHours(itemDate.getHours() + 7);
                    return itemDate.toISOString().split('T')[0] === filterDate;
                });

                const totalPlafon = filteredData.reduce((sum, item) => sum + (Number(item.Plafon) || 0), 0);
                const groupedByProduct = filteredData.reduce((acc, item) => {
                    acc[item.Produk] = (acc[item.Produk] || 0) + (Number(item.Plafon) || 0);
                    return acc;
                }, {});

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800">Dashboard {isReal ? 'Realisasi' : 'Estimasi'} Pencairan</h1>
                                <p className="text-sm text-slate-500">Pantau performa {isReal ? 'realisasi pencairan riil' : 'estimasi pencairan dari AO'}</p>
                            </div>
                            <div className="flex space-x-2 w-full md:w-auto">
                                <select value={dateMode} onChange={(e) => setDateMode(e.target.value)} className="p-2.5 border border-slate-200 rounded-xl bg-white text-sm outline-none font-medium">
                                    <option value="today">Harian</option>
                                    <option value="all">Semua Waktu</option>
                                </select>

                                                        <td className="p-2 text-slate-600 border-l whitespace-nowrap">{item.TARGET_NPL}</td><td className="p-2 text-slate-600 whitespace-nowrap">{item.REALISASI_NPL}</td><td className="p-2 font-bold text-red-600 bg-red-50/30 whitespace-nowrap">{item.PENCAPAIAN_NPL}</td>
                                                        <td className="p-2 text-slate-600 border-l whitespace-nowrap">{item.TARGET_LAR}</td><td className="p-2 text-slate-600 whitespace-nowrap">{item.REALISASI_LAR}</td><td className="p-2 font-bold text-orange-600 bg-orange-50/30 whitespace-nowrap">{item.PENCAPAIAN_LAR}</td>
                                                        <td className="p-2 text-slate-600 border-l whitespace-nowrap">{item.TARGET_RATA2}</td><td className="p-2 text-slate-600 whitespace-nowrap">{item.REALISASI_RATA2}</td><td className="p-2 font-bold text-purple-600 bg-purple-50/30 whitespace-nowrap">{item.PENCAPAIAN_RATA2}</td>
                                                        <td className="p-2 text-slate-600 border-l whitespace-nowrap">{item.TARGET_NOA}</td><td className="p-2 text-slate-600 whitespace-nowrap">{item.REALISASI_NOA}</td><td className="p-2 font-bold text-emerald-600 bg-emerald-50/30 whitespace-nowrap">{item.PENCAPAIAN_NOA}</td>

                            </div>

                );
            };

            const AdminPanel = () => {
                const [newAo, setNewAo] = useState("");
                const [newAdmin, setNewAdmin] = useState("");
                const [newProduct, setNewProduct] = useState("");
                const [newCabang, setNewCabang] = useState("");
                const [newUser, setNewUser] = useState({ username: "", password: "", role: "ao" });
                
                // Handler Cabang
                const addCabang = () => {
                    if(!newCabang.trim()) return;
                    const cleanName = newCabang.trim().toUpperCase();
                    const updated = [...new Set([...cabangList, cleanName])];
                    setCabangList(updated); localStorage.setItem('cabangList', JSON.stringify(updated));
                    syncMasterToSheet(aoList, productList, adminList, updated);
                    setNewCabang(""); showToast('Cabang ditambahkan');
                };

                const removeCabang = (cab) => {
                    const updated = cabangList.filter(c => c !== cab);
                    setCabangList(updated); localStorage.setItem('cabangList', JSON.stringify(updated));
                    syncMasterToSheet(aoList, productList, adminList, updated);
                    showToast('Cabang dihapus', 'error');
                };

                // Handler AO
                const addAo = () => {
                    if(!newAo.trim()) return;
                    const updated = [...new Set([...aoList, newAo.trim()])];
                    setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated));
                    syncMasterToSheet(updated, productList, adminList, cabangList); setNewAo(""); showToast('AO ditambahkan');
                };
                const removeAo = (ao) => {
                    const updated = aoList.filter(c => c !== ao);
                    setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated));
                    syncMasterToSheet(updated, productList, adminList, cabangList); showToast('AO dihapus', 'error');
                };

                // Handler Admin
                const addAdmin = () => {
                    if(!newAdmin.trim()) return;
                    const updated = [...new Set([...adminList, newAdmin.trim()])];
                    setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated));
                    syncMasterToSheet(aoList, productList, updated, cabangList); setNewAdmin(""); showToast('Admin ditambahkan');
                };
                const removeAdmin = (adm) => {
                    const updated = adminList.filter(c => c !== adm);
                    setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated));
                    syncMasterToSheet(aoList, productList, updated, cabangList); showToast('Admin dihapus', 'error');
                };

                // Handler Produk
                const addProduct = () => {
                    if(!newProduct.trim()) return;
                    const updated = [...new Set([...productList, newProduct.trim()])];
                    setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated));
                    syncMasterToSheet(aoList, updated, adminList, cabangList); setNewProduct(""); showToast('Produk ditambahkan');
                };
                const removeProduct = (prod) => {
                    const updated = productList.filter(p => p !== prod);
                    setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated));
                    syncMasterToSheet(aoList, updated, adminList, cabangList); showToast('Produk dihapus', 'error');
                };

                // Handler Akun User
                const addUser = () => {
                    if(!newUser.username.trim() || !newUser.password.trim()) return showToast('Isi Username & Password!', 'error');
                    if(appUsers.some(u => u.username.toLowerCase() === newUser.username.trim().toLowerCase())) return showToast('Username sudah ada!', 'error');
                    const updated = [...appUsers, { username: newUser.username.trim(), password: newUser.password.trim(), role: newUser.role }];
                    setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated));
                    syncUsersToSheet(updated); setNewUser({ username: "", password: "", role: "ao" }); showToast('User ditambahkan');
                };

                const removeUser = (username) => {
                    if(username === 'admin') return showToast('Admin utama tidak bisa dihapus', 'error');
                    const updated = appUsers.filter(u => u.username !== username);
                    setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated));
                    syncUsersToSheet(updated); showToast('User dihapus', 'error');
                };

                // Upload Master 1 Kolom (AO, ADMIN, PRODUK, CABANG)
                const processMasterCSVUpload = (e, type) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, "");
                            const lines = csv.split(/\r\n|\n/).map(line => line.trim().replace(/["']/g, "")).filter(line => line.length > 0);
                            if (lines.length > 0 && ['AO', 'NAMA', 'NAMA AO', 'NAMA_AO', 'ADMIN', 'ADMIN MIKRO', 'ADMIN_MIKRO', 'PRODUK', 'NAMA PRODUK', 'NAMA_PRODUK', 'CABANG', 'NAMA CABANG', 'NAMA_CABANG'].includes(lines[0].toUpperCase())) {
                                lines.shift(); 
                            }
                            if (lines.length === 0) throw new Error("File CSV kosong atau format tidak valid.");

                            if (type === 'CABANG') {
                                const cleanCabang = lines.map(l => l.toUpperCase());
                                const updated = [...new Set([...cabangList, ...cleanCabang])];
                                setCabangList(updated); localStorage.setItem('cabangList', JSON.stringify(updated));
                                syncMasterToSheet(aoList, productList, adminList, updated);
                            } else if (type === 'AO') {
                                const updated = [...new Set([...aoList, ...lines])];
                                setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated));
                                syncMasterToSheet(updated, productList, adminList, cabangList);
                            } else if (type === 'ADMIN') {
                                const updated = [...new Set([...adminList, ...lines])];
                                setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated));
                                syncMasterToSheet(aoList, productList, updated, cabangList);
                            } else if (type === 'PRODUK') {
                                const updated = [...new Set([...productList, ...lines])];
                                setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated));
                                syncMasterToSheet(aoList, updated, adminList, cabangList);
                            }
                            showToast(`Berhasil menambahkan ${lines.length} data baru ke daftar ${type}!`);
                        } catch (error) { showToast(`Gagal Upload CSV ${type}: ${error.message}`, 'error'); }
                        e.target.value = null;
                    };
                    reader.readAsText(file);
                };

                // Upload Data Nasabah (KOL1, LAR, NPL, REPORT)
                const processCSVUpload = (e, type) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    setIsLoading(true);
                    
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, "");
                            const lines = csv.split(/\r\n|\n/).filter(line => line.trim().length > 0);
                            if (lines.length < 2) throw new Error("Data kosong atau format salah");
                            
                            let delimiter = ',';
                            if (lines[0].includes(';')) delimiter = ';';
                            else if (lines[0].includes('\t')) delimiter = '\t';
                            
                            const parseLine = (line) => {
                                const result = [];
                                let start = 0; let inQuotes = false;
                                for (let i = 0; i < line.length; i++) {
                                    if (line[i] === '"') inQuotes = !inQuotes;
                                    else if (line[i] === delimiter && !inQuotes) {
                                        result.push(line.substring(start, i).replace(/^"|"$/g, '').trim());
                                        start = i + 1;
                                    }
                                }
                                result.push(line.substring(start).replace(/^"|"$/g, '').trim());
                                return result;
                            };

                            const headers = parseLine(lines[0].toUpperCase());
                            
                            const reqKOL1 = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];
                            const reqLARNPL = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'UP', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];
                            const reqREPORT = ['NAMA_CABANG', 'TARGET_OSL', 'REALISASI_OSL', 'PENCAPAIAN_OSL', 'TARGET_NPL', 'REALISASI_NPL', 'PENCAPAIAN_NPL', 'TARGET_LAR', 'REALISASI_LAR', 'PENCAPAIAN_LAR', 'TARGET_RATA2', 'REALISASI_RATA2', 'PENCAPAIAN_RATA2', 'TARGET_NOA', 'REALISASI_NOA', 'PENCAPAIAN_NOA'];
                            
                            let reqHeaders = type === 'REPORT' ? reqREPORT : (type === 'KOL1' ? reqKOL1 : reqLARNPL);

                            const dataArray = [];
                            const sheetData = [reqHeaders];

                            for (let i = 1; i < lines.length; i++) {
                                const currentline = parseLine(lines[i]);
                                if (currentline.length < 3) continue;
                                const obj = {}; const rowData = [];
                                reqHeaders.forEach((header) => {
                                    const headerIndex = headers.indexOf(header);
                                    const val = headerIndex > -1 && currentline[headerIndex] !== undefined ? currentline[headerIndex] : '';
                                    obj[header] = val;
                                    rowData.push(val);
                                });
                                dataArray.push(obj);
                                sheetData.push(rowData);
                            }

                            if (type === 'KOL1') { setKol1Data(dataArray); localStorage.setItem('kol1Data', JSON.stringify(dataArray)); }
                            else if (type === 'LAR') { setLarData(dataArray); localStorage.setItem('larData', JSON.stringify(dataArray)); }
                            else if (type === 'NPL') { setNplData(dataArray); localStorage.setItem('nplData', JSON.stringify(dataArray)); }
                            else if (type === 'REPORT') { setReportData(dataArray); localStorage.setItem('reportData', JSON.stringify(dataArray)); }
                            
                            if (GLOBAL_SHEET_URL) {
                                await fetch(GLOBAL_SHEET_URL, {
                                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                    body: JSON.stringify({ action: `upload_${type.toLowerCase()}`, data: sheetData })
                                });
                            }
                            showToast(`Data ${type} sukses diupload (${dataArray.length} baris)`);
                        } catch (err) { showToast(`Gagal: ${err.message}`, 'error'); }
                        e.target.value = null; 
                        setIsLoading(false);
                    };
                    reader.readAsText(file);
                };

                const resetData = (type) => {
                    setConfirmModal({
                        open: true,
                        title: `Kosongkan Data ${type}`,
                        message: `Hapus seluruh data ${type} saat ini dari aplikasi dan database Google Sheet?`,
                        onConfirm: async () => {
                            setIsLoading(true);
                            if (type === 'KOL1') { setKol1Data([]); localStorage.removeItem('kol1Data'); }
                            else if (type === 'LAR') { setLarData([]); localStorage.removeItem('larData'); }
                            else if (type === 'NPL') { setNplData([]); localStorage.removeItem('nplData'); }
                            else if (type === 'REPORT') { setReportData([]); localStorage.removeItem('reportData'); }
                            
                            if (GLOBAL_SHEET_URL) {
                                try {
                                    await fetch(GLOBAL_SHEET_URL, {
                                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                        body: JSON.stringify({ action: `upload_${type.toLowerCase()}`, data: [] })
                                    });
                                } catch(e) {}
                            }
                            showToast(`Data ${type} berhasil dikosongkan`);
                            setIsLoading(false);
                            setConfirmModal({ open: false, title: '', message: '', onConfirm: null });
                        }
                    });
                };

                const downloadTemplateCSV = (type) => {
                    let headers = '';
                    if (type === 'REPORT') headers = 'NAMA_CABANG,TARGET_OSL,REALISASI_OSL,PENCAPAIAN_OSL,TARGET_NPL,REALISASI_NPL,PENCAPAIAN_NPL,TARGET_LAR,REALISASI_LAR,PENCAPAIAN_LAR,TARGET_RATA2,REALISASI_RATA2,PENCAPAIAN_RATA2,TARGET_NOA,REALISASI_NOA,PENCAPAIAN_NOA\nMEDAN PETISAH,17.698.150.629,17.792.220.707,100.53%,1.66,4.33,38.33%,11.57,18.72,61.81%,16.843.528.392,16.973.417.363,100.77%,175,56,32.01%';
                    else if (type === 'KOL1') headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,TGL_JATUH_TEMPO,KOLEKTIBILITAS,HARI_TUNGGAKAN,OSL,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,01-10-2026,1,5,5000000,UPC A,CH-1,CABANG A';
                    else headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,KOLEKTIBILITAS,HARI_TUNGGAKAN,UP,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,2,45,5000000,UPC A,CH-1,CABANG A';
                    
                    const blob = new Blob([headers], { type: 'text/csv' });
                    const a = document.createElement('a');
                    a.href = window.URL.createObjectURL(blob);
                    a.download = `Template_Upload_${type}.csv`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };

                return (
                    <div className="space-y-8">
                        {/* 4 Kotak Upload CSV Data Nasabah Berwarna */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-amber-50/70 border border-amber-200 p-6 rounded-3xl shadow-sm relative overflow-hidden">
                                <div className="flex justify-between mb-4">
                                    <div><h3 className="font-bold text-amber-900 text-lg">Upload Data KOL 1</h3><p className="text-sm text-amber-700">Tunggakan 1 s/d 10 Hari</p></div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => downloadTemplateCSV('KOL1')} className="px-3 py-1 bg-white text-amber-800 border border-amber-300 rounded-xl text-xs hover:bg-amber-100 font-bold h-fit">Template</button>
                                        <button onClick={() => resetData('KOL1')} className="px-3 py-1 bg-amber-600 text-white rounded-xl text-xs hover:bg-amber-700 font-bold h-fit">Reset</button>
                                    </div>
                                </div>
                                <div className="relative">
                                    <input type="file" accept=".csv" onChange={(e) => processCSVUpload(e, 'KOL1')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-2xl text-sm font-bold flex items-center justify-center pointer-events-none shadow-sm"><i className="fas fa-upload mr-2"></i> Pilih CSV KOL 1</button>
                                </div>

                                <div>
                                    <h2 className="text-lg font-black text-slate-800 hidden sm:block">Portal Area Medan 1</h2>
                                    <p className="text-xs text-slate-400 font-medium hidden sm:block">{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">
                                <button onClick={syncFromSheet} className="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 hover:bg-blue-100 transition flex items-center justify-center border border-blue-200 shadow-sm" title="Tarik Data dari Sheet">
                                    <i className="fas fa-sync-alt"></i>
                                </button>
                                <div className="bg-slate-50 px-4 py-2 rounded-2xl flex items-center border border-slate-200 shadow-sm">
                                    <i className="fas fa-user-circle text-slate-400 mr-2 text-lg"></i>
                                    <span className="text-xs font-bold text-slate-700 mr-3 hidden sm:inline">Hi, {isAdmin ? 'Admin' : 'AO'}</span>
                                    <button onClick={() => {setUserRole(null); localStorage.removeItem('userRole');}} className="text-xs text-red-600 hover:text-red-700 font-extrabold border-l pl-3 border-slate-300">Logout <i className="fas fa-sign-out-alt ml-1"></i></button>
                                </div>
                            </div>
                        </header>

                        <div className="pb-10">
                            {activeTab === 'dashReal' && <Dashboard type="realisasi" />}
                            {activeTab === 'dashEst' && <Dashboard type="estimasi" />}
                            {activeTab === 'inReal' && <InputForm type="realisasi" />}
                            {activeTab === 'inEst' && <InputForm type="estimasi" />}
                            {activeTab === 'rekReal' && <DataRekap type="realisasi" />}
                            {activeTab === 'rekEst' && <DataRekap type="estimasi" />}
                            {activeTab === 'repKol1' && <Kol1View />}
                            {activeTab === 'repLar' && <LarView />}
                            {activeTab === 'repNpl' && <NplView />}
                            {activeTab === 'repReal' && <ReportRealisasiView />}
                            {activeTab === 'admin' && isAdmin && <AdminPanel />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
