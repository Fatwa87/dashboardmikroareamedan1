<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Area Medan 1</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF Library (UNTUK DOWNLOAD PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #eff6ff; color: #1d4ed8; border-right: 4px solid #1d4ed8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // URL GOOGLE APPS SCRIPT TERBARU (Update 9 September 2026)
        const GLOBAL_SHEET_URL = "https://script.google.com/macros/s/AKfycbz0SCsPRGJLk8Fqv_4RFkr-yEGU6UK6ggleEl28ffoyDVTyEVyqL96ucLizZc1Ngbcb/exec";

        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const App = () => {
            const SvgLogo = ({ className }) => (
                <svg viewBox="0 0 400 400" className={className} xmlns="http://www.w3.org/2000/svg">
                    <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#f97316" strokeWidth="10" />
                    <path d="M 200 10 A 190 190 0 0 1 390 200" fill="none" stroke="#0f172a" strokeWidth="15" />
                    <path d="M 10 200 A 190 190 0 0 0 200 390" fill="none" stroke="#0f172a" strokeWidth="15" />
                    <path d="M 50 350 L 140 260" stroke="#f97316" strokeWidth="8" strokeLinecap="round" />
                    <path d="M 40 320 L 120 240" stroke="#fbbf24" strokeWidth="6" strokeLinecap="round" />
                    <path d="M 80 360 L 160 280" stroke="#fbbf24" strokeWidth="6" strokeLinecap="round" />
                    <g transform="translate(180, 150) rotate(45)">
                        <path d="M0,-80 C30,-30 40,40 40,80 L-40,80 C-40,40 -30,-30 0,-80 Z" fill="#ffffff" stroke="#0f172a" strokeWidth="8"/>
                        <circle cx="0" cy="-10" r="12" fill="#f97316" stroke="#0f172a" strokeWidth="4"/>
                        <path d="M-40,40 L-70,80 L-40,80 Z" fill="#0f172a"/>
                        <path d="M40,40 L70,80 L40,80 Z" fill="#0f172a"/>
                        <path d="M0,40 L0,90" stroke="#0f172a" strokeWidth="8"/>
                    </g>
                    <g transform="translate(160, 210) rotate(-15)">
                        <path d="M 0 0 L 220 0 L 200 100 L -20 100 Z" fill="#0f172a" />
                        <text x="20" y="35" fill="#ffffff" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="30" letterSpacing="1">AREA</text>
                        <text x="20" y="65" fill="#ffffff" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="30" letterSpacing="1">MEDAN</text>
                        <text x="20" y="90" fill="#f97316" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="24" letterSpacing="2">JUARA</text>
                        <text x="160" y="60" fill="#f97316" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="60">1</text>
                    </g>
                </svg>
            );

            const [activeTab, setActiveTab] = useState('dashboardRealisasi');
            const [data, setData] = useState([]); // Realisasi Data
            const [estimasiData, setEstimasiData] = useState([]); // Estimasi Data
            const [sheetUrl, setSheetUrl] = useState(GLOBAL_SHEET_URL);
            const [isLoading, setIsLoading] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            const [userRole, setUserRole] = useState(null);
            const [aoList, setAoList] = useState([]);
            const [adminList, setAdminList] = useState([]);
            const [productList, setProductList] = useState([]);
            const [loginData, setLoginData] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');

            const [appUsers, setAppUsers] = useState([
                { username: 'admin', password: 'Area@123!', role: 'admin' },
                { username: 'ao', password: 'ao123', role: 'ao' }
            ]);

            const [larData, setLarData] = useState([]);
            const [nplData, setNplData] = useState([]);
            const [reportData, setReportData] = useState([]);

            useEffect(() => {
                const savedRole = localStorage.getItem('userRole');
                if (savedRole) setUserRole(savedRole);
                
                try {
                    const lsData = localStorage.getItem('mikroData'); if (lsData) setData(JSON.parse(lsData));
                    const lsEst = localStorage.getItem('estimasiData'); if (lsEst) setEstimasiData(JSON.parse(lsEst));
                    const lsAo = localStorage.getItem('aoList'); if (lsAo) setAoList(JSON.parse(lsAo));
                    const lsAdmin = localStorage.getItem('adminList'); if (lsAdmin) setAdminList(JSON.parse(lsAdmin));
                    const lsProd = localStorage.getItem('productList'); if (lsProd) setProductList(JSON.parse(lsProd));
                    const lsLar = localStorage.getItem('larData'); if (lsLar) setLarData(JSON.parse(lsLar));
                    const lsNpl = localStorage.getItem('nplData'); if (lsNpl) setNplData(JSON.parse(lsNpl));
                    const lsRep = localStorage.getItem('reportData'); if (lsRep) setReportData(JSON.parse(lsRep));
                    const lsUsr = localStorage.getItem('appUsers'); if (lsUsr) setAppUsers(JSON.parse(lsUsr));
                } catch (e) { console.error("Error loading local storage", e); }
            }, []);

            useEffect(() => {
                if (userRole && sheetUrl) syncFromSheet();
            }, [userRole]);

            const showToast = (message, type = 'success') => {
                setToastMessage({ message, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            const fixTimezone = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                if (!isNaN(d.getTime())) {
                    d.setHours(d.getHours() + 7); // Mencegah tanggal mundur 1 hari (WIB)
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                }
                return dateStr;
            };

            const syncFromSheet = async () => {
                if (!sheetUrl) return;
                setIsLoading(true);
                try {
                    const response = await fetch(sheetUrl);
                    const result = await response.json();
                    
                    if(result) {
                        if(result.pencairan) {
                            const validData = result.pencairan.filter(item => item.Tanggal || item.Nama).map(item => { item.Tanggal = fixTimezone(item.Tanggal); return item; });
                            setData(validData); localStorage.setItem('mikroData', JSON.stringify(validData));
                        }
                        if(result.estimasi) {
                            const validEst = result.estimasi.filter(item => item.Tanggal || item.Nama).map(item => { item.Tanggal = fixTimezone(item.Tanggal); return item; });
                            setEstimasiData(validEst); localStorage.setItem('estimasiData', JSON.stringify(validEst));
                        }
                        if(result.lar) { setLarData(result.lar); localStorage.setItem('larData', JSON.stringify(result.lar)); }
                        if(result.npl) { setNplData(result.npl); localStorage.setItem('nplData', JSON.stringify(result.npl)); }
                        if(result.report) { setReportData(result.report); localStorage.setItem('reportData', JSON.stringify(result.report)); }
                        
                        if(result.master && result.master.length > 1) {
                            const ao = [], prod = [], admin = [];
                            for(let i=1; i<result.master.length; i++){
                                if(result.master[i][0]) ao.push(result.master[i][0]);
                                if(result.master[i][1]) prod.push(result.master[i][1]);
                                if(result.master[i][2]) admin.push(result.master[i][2]);
                            }
                            setAoList(ao); setProductList(prod); setAdminList(admin);
                            localStorage.setItem('aoList', JSON.stringify(ao));
                            localStorage.setItem('productList', JSON.stringify(prod));
                            localStorage.setItem('adminList', JSON.stringify(admin));
                        }
                        if(result.users && result.users.length > 0) {
                            setAppUsers(result.users); localStorage.setItem('appUsers', JSON.stringify(result.users));
                        }
                        showToast('Database Tersinkronisasi!');
                    }
                } catch (error) {
                    showToast('Gagal menarik data dari Database', 'error');
                }
                setIsLoading(false);
            };

            const syncMasterToSheet = (newAo, newProd, newAdmin) => {
                if (!sheetUrl) return;
                const maxLength = Math.max(newAo.length, newProd.length, newAdmin.length);
                const twoDArray = [['AO', 'Produk', 'AdminMikro']];
                for(let i=0; i<maxLength; i++) {
                    twoDArray.push([newAo[i] || '', newProd[i] || '', newAdmin[i] || '']);
                }
                fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'save_master', data: twoDArray }) });
            };

            const syncUsersToSheet = (newUsersList) => {
                if (!sheetUrl) return;
                const twoDArray = [['Username', 'Password', 'Role']];
                newUsersList.forEach(u => twoDArray.push([u.username || '', u.password || '', u.role || '']));
                fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'save_users', data: twoDArray }) });
            };

            const submitData = async (formData, isEstimasi = false) => {
                setIsLoading(true);
                const targetState = isEstimasi ? estimasiData : data;
                const setTargetState = isEstimasi ? setEstimasiData : setData;
                const lsKey = isEstimasi ? 'estimasiData' : 'mikroData';
                const actionKey = isEstimasi ? 'add_estimasi' : 'add_pencairan';

                const newData = [...targetState, formData];
                setTargetState(newData);
                localStorage.setItem(lsKey, JSON.stringify(newData));

                if (sheetUrl) {
                    try {
                        await fetch(sheetUrl, {
                            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: actionKey, data: formData })
                        });
                        showToast(`Data ${isEstimasi ? 'Estimasi' : 'Pencairan'} berhasil disimpan!`);
                    } catch (error) { showToast('Gagal mengirim ke Cloud Database.', 'error'); }
                }
                setIsLoading(false);
                if(userRole === 'admin') setActiveTab(isEstimasi ? 'rekapEstimasi' : 'rekapRealisasi');
                else setActiveTab(isEstimasi ? 'dashboardEstimasi' : 'dashboardRealisasi');
            };

            const deleteDataPencairan = async (itemToDelete) => {
                setIsLoading(true);
                const newData = data.filter(item => item !== itemToDelete);
                setData(newData); localStorage.setItem('mikroData', JSON.stringify(newData));

                if (sheetUrl) {
                    try {
                        let tglFormat = itemToDelete.Tanggal; if (tglFormat.includes('T')) tglFormat = tglFormat.split('T')[0];
                        await fetch(sheetUrl, {
                            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: 'delete_pencairan', NoKredit: itemToDelete.NoKredit, Nama: itemToDelete.Nama, Tanggal: tglFormat })
                        });
                        showToast('Realisasi dihapus dari Cloud!');
                    } catch (error) { showToast('Gagal menghapus dari Database Cloud.', 'error'); }
                }
                setIsLoading(false);
            };

            const deleteDataEstimasi = async (itemToDelete) => {
                setIsLoading(true);
                const newData = estimasiData.filter(item => item !== itemToDelete);
                setEstimasiData(newData); localStorage.setItem('estimasiData', JSON.stringify(newData));

                if (sheetUrl) {
                    try {
                        let tglFormat = itemToDelete.Tanggal; if (tglFormat.includes('T')) tglFormat = tglFormat.split('T')[0];
                        await fetch(sheetUrl, {
                            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: 'delete_estimasi', Nama: itemToDelete.Nama, Produk: itemToDelete.Produk, Tanggal: tglFormat })
                        });
                        showToast('Estimasi dihapus dari Cloud!');
                    } catch (error) { showToast('Gagal menghapus dari Database Cloud.', 'error'); }
                }
                setIsLoading(false);
            };

            const processLogin = (e) => {
                e.preventDefault();
                const validUser = appUsers.find(u => u.username === loginData.username && u.password === loginData.password);
                if (validUser) { setUserRole(validUser.role); localStorage.setItem('userRole', validUser.role); setActiveTab('dashboardRealisasi'); } 
                else { setLoginError('Username atau Password salah!'); }
            };
            const handleLogout = () => { setUserRole(null); localStorage.removeItem('userRole'); setLoginData({ username: '', password: '' }); };

            const AdminPanel = () => {
                const [newAo, setNewAo] = useState('');
                const [newAdmin, setNewAdmin] = useState('');
                const [newProduct, setNewProduct] = useState('');
                const [newUser, setNewUser] = useState({ username: '', password: '', role: 'ao' });

                const addAo = () => { if(!newAo) return; const updated = [...aoList, newAo]; setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated)); syncMasterToSheet(updated, productList, adminList); setNewAo(''); showToast('AO ditambahkan'); };
                const removeAo = (ao) => { const updated = aoList.filter(c => c !== ao); setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated)); syncMasterToSheet(updated, productList, adminList); showToast('AO dihapus', 'error'); };
                
                const addAdmin = () => { if(!newAdmin) return; const updated = [...adminList, newAdmin]; setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated)); syncMasterToSheet(aoList, productList, updated); setNewAdmin(''); showToast('Admin Mikro ditambahkan'); };
                const removeAdmin = (adm) => { const updated = adminList.filter(c => c !== adm); setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated)); syncMasterToSheet(aoList, productList, updated); showToast('Admin Mikro dihapus', 'error'); };

                const addProduct = () => { if(!newProduct) return; const updated = [...productList, newProduct]; setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated)); syncMasterToSheet(aoList, updated, adminList); setNewProduct(''); showToast('Produk ditambahkan'); };
                const removeProduct = (prod) => { const updated = productList.filter(p => p !== prod); setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated)); syncMasterToSheet(aoList, updated, adminList); showToast('Produk dihapus', 'error'); };

                const addUser = () => {
                    if(!newUser.username || !newUser.password) return showToast('Isi Username & Password', 'error');
                    if(appUsers.some(u => u.username === newUser.username)) return showToast('Username sudah ada!', 'error');
                    const updated = [...appUsers, newUser]; setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated)); syncUsersToSheet(updated); setNewUser({ username: '', password: '', role: 'ao' }); showToast('User ditambahkan');
                };
                const removeUser = (username) => {
                    if(username === 'admin') return showToast('Admin utama tidak bisa dihapus', 'error');
                    const updated = appUsers.filter(u => u.username !== username); setAppUsers(updated); localStorage.setItem('appUsers', JSON.stringify(updated)); syncUsersToSheet(updated); showToast('User dihapus', 'error');
                };

                const downloadTemplateCSV = (type) => {
                    let headers = '';
                    if (type === 'REPORT') headers = 'NAMA_CABANG,TARGET_OSL,REALISASI_OSL,PENCAPAIAN_OSL,TARGET_NPL,REALISASI_NPL,PENCAPAIAN_NPL,TARGET_LAR,REALISASI_LAR,PENCAPAIAN_LAR,TARGET_RATA2,REALISASI_RATA2,PENCAPAIAN_RATA2,TARGET_NOA,REALISASI_NOA,PENCAPAIAN_NOA\n10204:CP MEDAN PETISAH,17.698.150.629,17.792.220.707,100.53%,1.66,4.33,38.33%,11.57,18.72,61.81%,16.843.528.392,16.973.417.363,100.77%,175,56,32.01%';
                    else headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,KOLEKTIBILITAS,HARI_TUNGGAKAN,UP,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,2,45,5000000,UPC A,CH-1,CABANG A';
                    const blob = new Blob([headers], { type: 'text/csv' });
                    const a = document.createElement('a'); a.href = window.URL.createObjectURL(blob); a.download = `Template_${type}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };

                const processCSVUpload = (file, type) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, '');
                            const lines = csv.split(/\r\n|\n/).filter(line => line.trim().length > 0);
                            if (lines.length < 2) throw new Error("Data kosong atau format salah");
                            let delimiter = lines[0].includes(';') ? ';' : (lines[0].includes('\t') ? '\t' : ',');
                            
                            const reqHeaders = type === 'REPORT' ? ['NAMA_CABANG', 'TARGET_OSL', 'REALISASI_OSL', 'PENCAPAIAN_OSL', 'TARGET_NPL', 'REALISASI_NPL', 'PENCAPAIAN_NPL', 'TARGET_LAR', 'REALISASI_LAR', 'PENCAPAIAN_LAR', 'TARGET_RATA2', 'REALISASI_RATA2', 'PENCAPAIAN_RATA2', 'TARGET_NOA', 'REALISASI_NOA', 'PENCAPAIAN_NOA'] : ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'UP', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];
                            const parsedData = []; const twoDArrayForSheet = [reqHeaders];

                            for (let i = 1; i < lines.length; i++) {
                                const currentLine = lines[i].split(delimiter);
                                if (currentLine.length < 2) continue; 
                                const obj = {}; const rowData = [];
                                reqHeaders.forEach((reqHeader, index) => {
                                    let val = currentLine[index] ? currentLine[index].trim().replace(/['"]/g, '') : '';
                                    obj[reqHeader] = val; rowData.push(val);    
                                });
                                if (rowData.some(v => v !== '')) { parsedData.push(obj); twoDArrayForSheet.push(rowData); }
                            }
                            if (parsedData.length === 0) throw new Error("Tidak ada data valid.");
                            
                            if(type === 'LAR') { setLarData(parsedData); localStorage.setItem('larData', JSON.stringify(parsedData)); } 
                            else if (type === 'NPL') { setNplData(parsedData); localStorage.setItem('nplData', JSON.stringify(parsedData)); } 
                            else if (type === 'REPORT') { setReportData(parsedData); localStorage.setItem('reportData', JSON.stringify(parsedData)); }
                            
                            if(sheetUrl) fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: type === 'LAR' ? 'upload_lar' : (type === 'NPL' ? 'upload_npl' : 'upload_report'), data: twoDArrayForSheet }) });
                            showToast(`Berhasil! ${parsedData.length} data ${type} terupload.`);
                        } catch (error) { showToast(`Gagal Upload: ${error.message}`, 'error'); }
                    };
                    reader.readAsText(file);
                };

                const resetData = (type) => {
                    if(window.confirm(`Hapus seluruh data ${type} permanen dari aplikasi & Cloud?`)) {
                        let actionKey = type === 'LAR' ? 'upload_lar' : (type === 'NPL' ? 'upload_npl' : 'upload_report');
                        if (type === 'LAR') { setLarData([]); localStorage.removeItem('larData'); }
                        else if (type === 'NPL') { setNplData([]); localStorage.removeItem('nplData'); }
                        else { setReportData([]); localStorage.removeItem('reportData'); }
                        if(sheetUrl) fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: actionKey, data: [] }) });
                        showToast(`Data ${type} dikosongkan!`);
                    }
                };

                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {/* KOTAK LAR */}
                            <div className="bg-orange-50 p-6 rounded-xl shadow-sm border border-orange-100 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-xl font-bold text-orange-800"><i className="fas fa-exclamation-circle mr-2"></i>Upload LAR</h2>
                                    <p className="text-sm text-orange-600 mt-1">Daftar nasabah LAR</p>
                                    <div className="mt-3 flex gap-2"><button onClick={() => downloadTemplateCSV('LAR')} className="text-xs bg-white text-orange-700 px-3 py-1.5 border border-orange-200 rounded hover:bg-orange-100"><i className="fas fa-download mr-1"></i> Template</button><button onClick={() => resetData('LAR')} className="text-xs bg-red-600 text-white px-3 py-1.5 rounded hover:bg-red-700"><i className="fas fa-trash mr-1"></i> Reset</button></div>
                                </div>
                                <div className="w-full relative mt-4">
                                    <input type="file" accept=".csv" onChange={(e) => { if(e.target.files[0]) processCSVUpload(e.target.files[0], 'LAR') }} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-orange-600 hover:bg-orange-700 text-white px-4 py-2.5 rounded-lg flex justify-center items-center pointer-events-none"><i className="fas fa-upload mr-2"></i> Upload CSV LAR</button>
                                </div>
                            </div>
                            {/* KOTAK NPL */}
                            <div className="bg-red-50 p-6 rounded-xl shadow-sm border border-red-100 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-xl font-bold text-red-800"><i className="fas fa-exclamation-triangle mr-2"></i>Upload NPL</h2>
                                    <p className="text-sm text-red-600 mt-1">Daftar nasabah NPL</p>
                                    <div className="mt-3 flex gap-2"><button onClick={() => downloadTemplateCSV('NPL')} className="text-xs bg-white text-red-700 px-3 py-1.5 border border-red-200 rounded hover:bg-red-100"><i className="fas fa-download mr-1"></i> Template</button><button onClick={() => resetData('NPL')} className="text-xs bg-red-600 text-white px-3 py-1.5 rounded hover:bg-red-700"><i className="fas fa-trash mr-1"></i> Reset</button></div>
                                </div>
                                <div className="w-full relative mt-4">
                                    <input type="file" accept=".csv" onChange={(e) => { if(e.target.files[0]) processCSVUpload(e.target.files[0], 'NPL') }} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg flex justify-center items-center pointer-events-none"><i className="fas fa-upload mr-2"></i> Upload CSV NPL</button>
                                </div>
                            </div>
                            {/* KOTAK REPORT */}
                            <div className="bg-blue-50 p-6 rounded-xl shadow-sm border border-blue-100 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-xl font-bold text-blue-800"><i className="fas fa-chart-line mr-2"></i>Upload Report</h2>

                        {/* MASTER DATA BOXES */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">

                            <div className="flex flex-col md:flex-row gap-3 mb-6">
                                <input type="text" value={newUser.username} onChange={(e)=>setNewUser({...newUser, username: e.target.value})} placeholder="Username Baru" className="flex-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                                <input type="text" value={newUser.password} onChange={(e)=>setNewUser({...newUser, password: e.target.value})} placeholder="Password" className="flex-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />

            const TableNasabahView = ({ title, nData, type, icon }) => {

                const [selectedOutlet, setSelectedOutlet] = useState('Semua');
                useEffect(() => { setSelectedOutlet('Semua'); }, [selectedCabang]);
                const cabangList = ['Semua', ...new Set(nData.map(item => item.CABANG).filter(Boolean))];
                const availableOutlets = nData.filter(item => selectedCabang === 'Semua' || item.CABANG === selectedCabang).map(item => item.OUTLET).filter(Boolean);
                const outletList = ['Semua', ...new Set(availableOutlets)];

                const filteredData = nData.filter(item => (selectedCabang === 'Semua' || item.CABANG === selectedCabang) && (selectedOutlet === 'Semua' || item.OUTLET === selectedOutlet));
                const totalOut = filteredData.reduce((sum, item) => sum + (Number(item.UP) || 0), 0);
                const conf = type === 'lar' ? { bg: 'bg-orange-50', border: 'border-orange-100', text: 'text-orange-800', iconBg: 'bg-orange-200', iconText: 'text-orange-700' } : { bg: 'bg-red-50', border: 'border-red-100', text: 'text-red-800', iconBg: 'bg-red-200', iconText: 'text-red-700' };

                const downloadPDF = () => {
                    if (typeof window.jspdf === 'undefined' || typeof window.jspdf.jsPDF === 'undefined') return showToast('Library PDF belum dimuat. Pastikan koneksi lancar.', 'error');
                    if (filteredData.length === 0) return showToast('Tidak ada data untuk didownload', 'error');
                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(`Pemantauan Khusus ${title} - Area Medan 1`, 14, 15);
                        doc.setFontSize(10); doc.text(`Cabang: ${selectedCabang} | Outlet: ${selectedOutlet}`, 14, 22);
                        const tableColumn = ["No. Kontrak", "Nama Nasabah", "Produk", "Outstanding (UP)", "Kol", "Tunggakan", "Cabang", "Outlet"];
                        const tableRows = filteredData.map(item => [item.NO_KONTRAK || '-', item.CUSTOMER_NM || '-', item['SUB PRODUK'] || '-', formatRupiah(item.UP || 0), item.KOLEKTIBILITAS || '-', `${item.HARI_TUNGGAKAN || 0} Hari`, item.CABANG || '-', item.OUTLET || '-']);
                        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: type === 'lar' ? [249, 115, 22] : [220, 38, 38] } });
                        doc.save(`Data_${title.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
                        showToast('File PDF berhasil didownload!');
                    } catch (error) { showToast('Terjadi kesalahan saat memproses PDF.', 'error'); }
                };

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b pb-4">
                            <div><h2 className="text-2xl font-bold text-gray-800">Pemantauan Khusus {title}</h2><p className="text-sm text-gray-500">Data bersumber dari upload terakhir Admin</p></div>
                            <div className="flex flex-col sm:flex-row items-start sm:items-center space-y-3 sm:space-y-0 sm:space-x-4 w-full lg:w-auto">
                                <button onClick={downloadPDF} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 w-full sm:w-auto justify-center"><i className="fas fa-file-pdf"></i><span>Download PDF</span></button>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium">Cabang:</label><select value={selectedCabang} onChange={(e) => setSelectedCabang(e.target.value)} className="w-full sm:w-40 p-2 border rounded-lg bg-white text-sm">{cabangList.map((c, i) => <option key={i} value={c}>{c}</option>)}</select></div>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium">Outlet:</label><select value={selectedOutlet} onChange={(e) => setSelectedOutlet(e.target.value)} className="w-full sm:w-40 p-2 border rounded-lg bg-white text-sm">{outletList.map((o, i) => <option key={i} value={o}>{o}</option>)}</select></div>
                            </div>
                        </div>
                        {nData.length === 0 ? <div className={`${conf.bg} ${conf.text} p-8 text-center rounded-xl border ${conf.border}`}><i className={`fas fa-folder-open text-4xl mb-3`}></i><h3 className="text-lg font-bold">Belum Ada Data</h3></div> : (
                            <>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4"><div className="p-3 bg-blue-100 text-blue-600 rounded-lg"><i className="fas fa-users text-2xl"></i></div><div><p className="text-sm text-gray-500 font-medium">Total Nasabah</p><p className="text-2xl font-bold text-gray-800">{filteredData.length} Nasabah</p></div></div>
                                    <div className={`${conf.bg} p-6 rounded-xl shadow-sm border ${conf.border} flex items-center space-x-4`}><div className={`p-3 ${conf.iconBg} ${conf.iconText} rounded-lg`}><i className={`fas ${icon} text-2xl`}></i></div><div><p className={`text-sm ${conf.iconText} font-medium`}>Total Outstanding (UP)</p><p className={`text-xl md:text-2xl font-bold ${conf.text}`}>{formatRupiah(totalOut)}</p></div></div>
                                </div>
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mt-6">
                                    <div className="overflow-x-auto"><table className="w-full text-left border-collapse text-sm"><thead><tr className="bg-gray-50 text-gray-600 border-b"><th className="p-4 font-medium">No. Kontrak</th><th className="p-4 font-medium">Nama Nasabah</th><th className="p-4 font-medium">Produk</th><th className="p-4 font-medium">Outstanding (UP)</th><th className="p-4 font-medium text-center">Kol</th><th className="p-4 font-medium text-center">Tunggakan</th></tr></thead><tbody>{filteredData.map((item, index) => (<tr key={index} className="border-b hover:bg-gray-50"><td className="p-4 font-medium text-gray-800">{item.NO_KONTRAK}</td><td className="p-4 text-gray-700">{item.CUSTOMER_NM}</td><td className="p-4 text-gray-600">{item['SUB PRODUK']}</td><td className="p-4 font-semibold text-gray-800">{formatRupiah(item.UP)}</td><td className="p-4 text-center"><span className="px-2 py-1 rounded text-xs font-bold bg-gray-200 text-gray-800">{item.KOLEKTIBILITAS || '-'}</span></td><td className="p-4 text-center text-red-600 font-medium">{item.HARI_TUNGGAKAN} Hari</td></tr>))}</tbody></table></div>
                                </div>
                            </>
                        )}
                    </div>
                );
            };

            const ReportRealisasiView = () => {
                const [selectedCabang, setSelectedCabang] = useState('Semua');
                const cabangList = [...new Set(reportData.map(item => item.NAMA_CABANG).filter(Boolean))];
                const currentData = selectedCabang === 'Semua' ? null : reportData.find(item => item.NAMA_CABANG === selectedCabang);

                const downloadPDFReport = () => {
                    if (typeof window.jspdf === 'undefined' || typeof window.jspdf.jsPDF === 'undefined') return showToast('Library PDF belum dimuat.', 'error');
                    if (reportData.length === 0) return showToast('Tidak ada data untuk didownload', 'error');
                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(`Report Realisasi Mikro - Area Medan 1`, 14, 15);
                        doc.setFontSize(10); doc.text(`Cabang: ${selectedCabang}`, 14, 22);

                        if (selectedCabang === 'Semua') {
                            const tableColumn = ["Cabang", "Tgt OSL", "Real OSL", "Capai OSL", "Tgt NPL", "Real NPL", "Capai NPL", "Tgt LAR", "Real LAR", "Capai LAR", "Tgt Rata2", "Real Rata2", "Capai Rata2", "Tgt NOA", "Real NOA", "Capai NOA"];
                            const tableRows = reportData.map(item => [item.NAMA_CABANG || '-', item.TARGET_OSL || '-', item.REALISASI_OSL || '-', item.PENCAPAIAN_OSL || '-', item.TARGET_NPL || '-', item.REALISASI_NPL || '-', item.PENCAPAIAN_NPL || '-', item.TARGET_LAR || '-', item.REALISASI_LAR || '-', item.PENCAPAIAN_LAR || '-', item.TARGET_RATA2 || '-', item.REALISASI_RATA2 || '-', item.PENCAPAIAN_RATA2 || '-', item.TARGET_NOA || '-', item.REALISASI_NOA || '-', item.PENCAPAIAN_NOA || '-']);
                            doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 6, cellPadding: 1 }, headStyles: { fillColor: [37, 99, 235] } });
                        } else {
                            if(!currentData) return;
                            const tableColumn = ["Komponen", "Target", "Realisasi", "Pencapaian"];
                            const tableRows = [
                                ["OSL GROS MIKRO", currentData.TARGET_OSL||'-', currentData.REALISASI_OSL||'-', currentData.PENCAPAIAN_OSL||'-'],
                                ["NPL MIKRO", currentData.TARGET_NPL||'-', currentData.REALISASI_NPL||'-', currentData.PENCAPAIAN_NPL||'-'],
                                ["LAR MIKRO", currentData.TARGET_LAR||'-', currentData.REALISASI_LAR||'-', currentData.PENCAPAIAN_LAR||'-'],
                                ["RATA2 MIKRO", currentData.TARGET_RATA2||'-', currentData.REALISASI_RATA2||'-', currentData.PENCAPAIAN_RATA2||'-'],
                                ["NASABAH BARU", currentData.TARGET_NOA||'-', currentData.REALISASI_NOA||'-', currentData.PENCAPAIAN_NOA||'-']
                            ];
                            doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 9 }, headStyles: { fillColor: [37, 99, 235] } });
                        }
                        doc.save(`Report_Realisasi_${selectedCabang === 'Semua' ? 'Semua_Cabang' : selectedCabang.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
                        showToast('File PDF Report berhasil didownload!');
                    } catch (error) { showToast('Terjadi kesalahan saat memproses PDF.', 'error'); }
                };

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">
                            <div><h2 className="text-2xl font-bold text-gray-800">Report Realisasi Mikro</h2></div>
                            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                                <button onClick={downloadPDFReport} className="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center justify-center space-x-2"><i className="fas fa-file-pdf"></i> <span>Download PDF</span></button>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium">Pilih Cabang:</label><select value={selectedCabang} onChange={(e) => setSelectedCabang(e.target.value)} className="w-full sm:w-48 p-2 border rounded-lg bg-white text-sm"><option value="Semua">-- Semua Cabang --</option>{cabangList.map((c, i) => <option key={i} value={c}>{c}</option>)}</select></div>
                            </div>
                        </div>
                        {reportData.length === 0 ? ( <div className="bg-blue-50 text-blue-800 p-8 text-center rounded-xl border border-blue-100"><h3 className="text-lg font-bold">Belum Ada Data Report</h3></div> ) : selectedCabang === 'Semua' ? (
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mt-6">
                                <div className="overflow-x-auto"><table className="w-full text-left border-collapse text-xs whitespace-nowrap"><thead><tr className="bg-blue-600 text-white border-b"><th className="p-3 font-medium" rowSpan="2">Nama Cabang</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">OSL Gros Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">NPL Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">LAR Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">Rata-rata Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">Nasabah Baru</th></tr><tr className="bg-blue-50 text-blue-800 border-b"><th className="p-2 border-l border-blue-100 font-medium text-right">Target</th><th className="p-2 border-l border-blue-100 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-100 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-200 font-medium text-right">Target</th><th className="p-2 border-l border-blue-200 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-200 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-100 font-medium text-right">Target</th><th className="p-2 border-l border-blue-100 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-100 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-200 font-medium text-right">Target</th><th className="p-2 border-l border-blue-200 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-200 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-100 font-medium text-right">Target</th><th className="p-2 border-l border-blue-100 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-100 font-medium text-center">Capai</th></tr></thead><tbody>{reportData.map((item, index) => (<tr key={index} className="border-b hover:bg-gray-50"><td className="p-3 font-bold text-gray-700">{item.NAMA_CABANG}</td><td className="p-2 border-l text-right text-gray-600">{item.TARGET_OSL}</td><td className="p-2 border-l text-right text-gray-600">{item.REALISASI_OSL}</td><td className="p-2 border-l text-center font-bold text-blue-600">{item.PENCAPAIAN_OSL}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.TARGET_NPL}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.REALISASI_NPL}</td><td className="p-2 border-l text-center font-bold text-red-600 bg-gray-50">{item.PENCAPAIAN_NPL}</td><td className="p-2 border-l text-right text-gray-600">{item.TARGET_LAR}</td><td className="p-2 border-l text-right text-gray-600">{item.REALISASI_LAR}</td><td className="p-2 border-l text-center font-bold text-orange-600">{item.PENCAPAIAN_LAR}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.TARGET_RATA2}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.REALISASI_RATA2}</td><td className="p-2 border-l text-center font-bold text-green-600 bg-gray-50">{item.PENCAPAIAN_RATA2}</td><td className="p-2 border-l text-right text-gray-600">{item.TARGET_NOA}</td><td className="p-2 border-l text-right text-gray-600">{item.REALISASI_NOA}</td><td className="p-2 border-l text-center font-bold text-purple-600">{item.PENCAPAIAN_NOA}</td></tr>))}</tbody></table></div>
                            </div>
                        ) : currentData && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-t-4 border-t-blue-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">1. OSL GROS MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-blue-600 mt-1">{currentData.PENCAPAIAN_OSL || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-t-4 border-t-red-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">2. NPL MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-red-600 mt-1">{currentData.PENCAPAIAN_NPL || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-t-4 border-t-orange-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">3. LAR MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_LAR || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_LAR || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-orange-600 mt-1">{currentData.PENCAPAIAN_LAR || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-t-4 border-t-green-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">4. RATA2 MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-green-600 mt-1">{currentData.PENCAPAIAN_RATA2 || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-t-4 border-t-purple-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">5. NASABAH BARU</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_NOA || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_NOA || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-purple-600 mt-1">{currentData.PENCAPAIAN_NOA || '-'}</p></div></div></div>
                            </div>

            };

            const Dashboard = ({ title, srcData, masterList, isEstimasi }) => {
                const todayStr = new Date().toISOString().split('T')[0];
                const [selectedPerson, setSelectedPerson] = useState('Semua');
                const [startDate, setStartDate] = useState(todayStr);

                const dataPersonList = srcData.map(item => item.Petugas).filter(Boolean);
                const combinedList = ['Semua', ...new Set([...dataPersonList, ...masterList])];
                const activePersons = new Set(srcData.map(item => item.Petugas));
                const inactivePersons = masterList.filter(p => !activePersons.has(p));

                const filteredData = srcData.filter(item => {
                    const matchPerson = selectedPerson === 'Semua' || item.Petugas === selectedPerson;
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchPerson && matchDate;

                const totalPlafon = filteredData.reduce((sum, item) => sum + (Number(item.Plafon) || 0), 0);
                const productStats = filteredData.reduce((acc, item) => {
                    const prod = item.Produk || 'Belum Kategori';
                    if (!acc[prod]) acc[prod] = { count: 0, amount: 0 };

                            </div>
                        </div>
                    </div>
                );
            };

            const FormPencairan = ({ isEstimasi }) => {

                            </div>
                            <div className="pt-4"><button type="submit" disabled={isLoading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg flex justify-center space-x-2 disabled:bg-blue-300">{isLoading ? <><i className="fas fa-spinner fa-spin"></i><span>Menyimpan...</span></> : <><i className="fas fa-save"></i><span>Simpan Data</span></>}</button></div>
                        </form>
                    </div>
                );
            };

            const DataTable = ({ isEstimasi }) => {
                const todayStr = new Date().toISOString().split('T')[0];
                const [startDate, setStartDate] = useState(todayStr); 
                const [endDate, setEndDate] = useState(todayStr); 
                const [searchTerm, setSearchTerm] = useState('');
                const srcData = isEstimasi ? estimasiData : data;

                const filteredData = srcData.filter(item => {
                    const searchStr = isEstimasi ? `${item.Nama} ${item.Petugas}`.toLowerCase() : `${item.Nama} ${item.NoKredit} ${item.Petugas}`.toLowerCase();
                    const matchSearch = searchStr.includes(searchTerm.toLowerCase());
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchSearch && matchDate;
                });

                    if (typeof window.jspdf === 'undefined') return showToast('Library PDF belum dimuat', 'error');
                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(`Rekap ${isEstimasi ? 'Estimasi' : 'Realisasi'} Pencairan`, 14, 15);
                        doc.setFontSize(10); doc.text(`Periode: ${startDate} s/d ${endDate}`, 14, 22);
                        
                        const tableColumn = isEstimasi ? ["Tanggal", "Nama Nasabah", "Produk", "Estimasi (Rp)", "Petugas AO"] : ["Tanggal", "Nama Nasabah", "No Kredit", "Produk", "Plafon", "Tenor", "Admin Mikro"];
                        const tableRows = filteredData.map(item => isEstimasi ? [item.Tanggal, item.Nama, item.Produk, formatRupiah(item.Plafon), item.Petugas] : [item.Tanggal, item.Nama, item.NoKredit, item.Produk, formatRupiah(item.Plafon), `${item.Tenor} Bln`, item.Petugas]);
                        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: [37, 99, 235] } });
                        doc.save(`Rekap_${isEstimasi ? 'Estimasi' : 'Realisasi'}_${startDate}.pdf`);

                return (

                                <tbody>

                                            <td className="p-4"><span className="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs">{item.Produk}</span></td>

                                                <button onClick={() => { if(window.confirm('Yakin hapus data ini?')) { isEstimasi ? deleteDataEstimasi(item) : deleteDataPencairan(item); } }} className="text-red-500 hover:text-red-700 p-2"><i className="fas fa-trash"></i></button>
                                            </td>

                                </tbody>
                            </table>
                        </div>

                );

            return (
                <div className="flex h-screen overflow-hidden bg-gray-50">

                        <div className="w-full h-screen flex bg-gray-50 absolute z-[100] top-0 left-0 overflow-hidden">
                            <div className="hidden md:flex md:w-1/2 bg-white flex-col items-center justify-center p-12 border-r border-gray-100 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10"><SvgLogo className="w-full max-w-md drop-shadow-xl hover:scale-105 transition-transform duration-700" /></div>
                            <div className="w-full md:w-1/2 flex items-center justify-center p-6 bg-gray-50 relative overflow-hidden">
                                <div className="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none"><SvgLogo className="w-[150%] h-[150%] max-w-none" /></div>

                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Username</label><div className="relative"><i className="fas fa-user absolute left-3 top-3.5 text-gray-400"></i><input type="text" name="username" value={loginData.username} onChange={(e) => setLoginData({...loginData, username: e.target.value})} required placeholder="Masukkan Username" className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg outline-none bg-white/50" /></div></div>

                            <button onClick={() => setActiveTab('dashboardEstimasi')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'dashboardEstimasi' ? 'sidebar-active text-purple-600 border-purple-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-chart-bar w-5 text-purple-500"></i><span>Estimasi (AO)</span></button>
                            
                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-4 mt-4">INPUT DATA</div>

                            <button onClick={() => setActiveTab('formEstimasi')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'formEstimasi' ? 'sidebar-active text-purple-600 border-purple-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-edit w-5 text-purple-500"></i><span>Input Estimasi</span></button>

                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-4 mt-4">LAPORAN CSV</div>
                            <button onClick={() => setActiveTab('lar')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'lar' ? 'sidebar-active text-orange-600 border-orange-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-exclamation-circle w-5 text-orange-500"></i><span>LAR 11 - 30 Hari</span></button>
                            <button onClick={() => setActiveTab('npl')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'npl' ? 'sidebar-active text-red-600 border-red-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-exclamation-triangle w-5 text-red-500"></i><span>NPL (KOL 3 - 5)</span></button>
                            <button onClick={() => setActiveTab('report')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'report' ? 'sidebar-active text-blue-600 border-blue-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-chart-line w-5 text-blue-500"></i><span>Report Realisasi</span></button>

                            {userRole === 'admin' && (
                                <>
                                    <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-4 mt-4">KHUSUS ADMIN</div>
                                    <button onClick={() => setActiveTab('rekapRealisasi')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'rekapRealisasi' ? 'sidebar-active' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-table w-5"></i><span>Rekap Realisasi</span></button>
                                    <button onClick={() => setActiveTab('rekapEstimasi')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'rekapEstimasi' ? 'sidebar-active text-purple-600 border-purple-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-list w-5 text-purple-500"></i><span>Rekap Estimasi</span></button>
                                    <button onClick={() => setActiveTab('admin')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg ${activeTab === 'admin' ? 'sidebar-active' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-cog w-5"></i><span>Kelola & Setting</span></button>
                                </>
                            )}
                        </nav>
                        <div className="p-4 border-t"><button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 font-medium"><i className="fas fa-sign-out-alt"></i> <span>Keluar</span></button></div>
                    </div>
                    
                    {}
                    <div className="md:hidden fixed bottom-0 w-full bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-50 flex justify-start p-1 overflow-x-auto space-x-1">
                        <button onClick={() => setActiveTab('dashboardRealisasi')} className="p-2 min-w-[60px] rounded-lg flex flex-col items-center text-gray-500"><i className="fas fa-chart-pie mb-1 text-sm"></i><span className="text-[9px]">Dash R</span></button>
                        <button onClick={() => setActiveTab('dashboardEstimasi')} className="p-2 min-w-[60px] rounded-lg flex flex-col items-center text-purple-500"><i className="fas fa-chart-bar mb-1 text-sm"></i><span className="text-[9px]">Dash E</span></button>
                        <button onClick={() => setActiveTab('formRealisasi')} className="p-2 min-w-[60px] rounded-lg flex flex-col items-center text-gray-500"><i className="fas fa-plus mb-1 text-sm"></i><span className="text-[9px]">Inp R</span></button>
                        <button onClick={() => setActiveTab('formEstimasi')} className="p-2 min-w-[60px] rounded-lg flex flex-col items-center text-purple-500"><i className="fas fa-edit mb-1 text-sm"></i><span className="text-[9px]">Inp E</span></button>
                        {userRole === 'admin' && <button onClick={() => setActiveTab('admin')} className="p-2 min-w-[60px] rounded-lg flex flex-col items-center text-blue-500"><i className="fas fa-cog mb-1 text-sm"></i><span className="text-[9px]">Admin</span></button>}
                        <button onClick={handleLogout} className="p-2 min-w-[60px] rounded-lg flex flex-col items-center text-red-500 ml-auto"><i className="fas fa-sign-out-alt mb-1 text-sm"></i><span className="text-[9px]">Keluar</span></button>
                    </div>
                    
                    {}
                    <div className="flex-1 overflow-y-auto pb-20 md:pb-0 relative">
                        <header className="bg-white p-4 shadow-sm flex justify-between items-center md:hidden border-b sticky top-0 z-20">
                            <div className="flex items-center space-x-3"><SvgLogo className="h-8 w-8" /><h1 className="text-sm font-bold text-gray-800">Area Medan 1</h1></div>
                            <div className="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full font-medium">{userRole === 'admin' ? 'Admin' : 'Petugas'}</div>
                        </header>
                        <main className="p-4 md:p-8">
                            {activeTab === 'dashboardRealisasi' && <Dashboard title="Dashboard Realisasi" srcData={data} masterList={adminList} isEstimasi={false} />}
                            {activeTab === 'dashboardEstimasi' && <Dashboard title="Dashboard Estimasi" srcData={estimasiData} masterList={aoList} isEstimasi={true} />}
                            
                            {activeTab === 'formRealisasi' && <FormPencairan isEstimasi={false} />}
                            {activeTab === 'formEstimasi' && <FormPencairan isEstimasi={true} />}
                            
                            {activeTab === 'lar' && <TableNasabahView title="LAR 11 sd 30 Hari" nData={larData} type="lar" icon="fa-exclamation-circle" />}
                            {activeTab === 'npl' && <TableNasabahView title="NPL (KOL 3 sd 5)" nData={nplData} type="npl" icon="fa-exclamation-triangle" />}
                            {activeTab === 'report' && <ReportRealisasiView />}
                            
                            {activeTab === 'rekapRealisasi' && userRole === 'admin' && <DataTable isEstimasi={false} />}
                            {activeTab === 'rekapEstimasi' && userRole === 'admin' && <DataTable isEstimasi={true} />}
                            {activeTab === 'admin' && userRole === 'admin' && <AdminPanel />}
                        </main>
                    </div>
                    
                    {}
                    {toastMessage && (
                        <div className={`fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 text-white ${toastMessage.type === 'error' ? 'bg-red-500' : 'bg-gray-800'}`}>
                            <i className={`fas ${toastMessage.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i><span>{toastMessage.message}</span>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
