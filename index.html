            };

            const TableNasabahView = ({ title, data, type, icon }) => {
                const [selectedCabang, setSelectedCabang] = useState('Semua');
                const [selectedOutlet, setSelectedOutlet] = useState('Semua');
                
                useEffect(() => { setSelectedOutlet('Semua'); }, [selectedCabang]);
                
                const cabangList = ['Semua', ...new Set(data.map(item => item.CABANG).filter(Boolean))];
                const availableOutlets = data.filter(item => selectedCabang === 'Semua' || item.CABANG === selectedCabang).map(item => item.OUTLET).filter(Boolean);
                const outletList = ['Semua', ...new Set(availableOutlets)];

                const filteredData = data.filter(item => {
                    const matchCabang = selectedCabang === 'Semua' || item.CABANG === selectedCabang;
                    const matchOutlet = selectedOutlet === 'Semua' || item.OUTLET === selectedOutlet;
                    return matchCabang && matchOutlet;
                });
                
                const totalOut = filteredData.reduce((sum, item) => sum + (Number(item.UP) || 0), 0);
                const colorConfig = {
                    lar: { bg: 'bg-orange-50', border: 'border-orange-100', text: 'text-orange-800', iconBg: 'bg-orange-200', iconText: 'text-orange-700', badge: 'bg-orange-500' },
                    npl: { bg: 'bg-red-50', border: 'border-red-100', text: 'text-red-800', iconBg: 'bg-red-200', iconText: 'text-red-700', badge: 'bg-red-600' }
                };
                const conf = colorConfig[type] || colorConfig.lar;

                const downloadPDF = () => {
                    if (typeof window.jspdf === 'undefined') return showToast('Library PDF belum dimuat. Refresh halaman.', 'error');
                    if (filteredData.length === 0) return showToast('Tidak ada data didownload', 'error');
                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(`Pemantauan Khusus ${title} - Area Medan 1`, 14, 15);
                        doc.setFontSize(10); doc.text(`Cabang: ${selectedCabang} | Outlet: ${selectedOutlet}`, 14, 22);
                        
                        const tableColumn = ["No. Kontrak", "Nama Nasabah", "Produk", "Outstanding (UP)", "Kol", "Tunggakan", "Cabang", "Outlet"];
                        const tableRows = filteredData.map(item => [
                            item.NO_KONTRAK || '-', item.CUSTOMER_NM || '-', item['SUB PRODUK'] || '-',
                            formatRupiah(item.UP || 0), item.KOLEKTIBILITAS || '-', `${item.HARI_TUNGGAKAN || 0} Hari`, item.CABANG || '-', item.OUTLET || '-'
                        ]);

                        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: type === 'lar' ? [249, 115, 22] : [220, 38, 38] } });
                        doc.save(`Data_${title.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
                        showToast('File PDF berhasil didownload!');
                    } catch (error) { showToast('Gagal memproses PDF.', 'error'); }
                };

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col lg:flex-row justify-between lg:items-center gap-4 border-b pb-4">
                            <div><h2 className="text-2xl font-bold text-gray-800">Pemantauan {title}</h2><p className="text-sm text-gray-500">Data bersumber dari upload CSV Admin</p></div>
                            <div className="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-4 w-full lg:w-auto">
                                <button onClick={downloadPDF} className="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center space-x-2"><i className="fas fa-file-pdf"></i><span>Download PDF</span></button>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium text-gray-600">Cabang:</label><select value={selectedCabang} onChange={(e) => setSelectedCabang(e.target.value)} className="w-full sm:w-40 p-2 border rounded-lg bg-white text-sm">{cabangList.map((cabang, idx) => <option key={idx} value={cabang}>{cabang}</option>)}</select></div>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium text-gray-600">Outlet:</label><select value={selectedOutlet} onChange={(e) => setSelectedOutlet(e.target.value)} className="w-full sm:w-40 p-2 border rounded-lg bg-white text-sm">{outletList.map((outlet, idx) => <option key={idx} value={outlet}>{outlet}</option>)}</select></div>
                            </div>
                        </div>
                        {data.length === 0 ? (
                            <div className={`${conf.bg} ${conf.text} p-8 text-center rounded-xl border ${conf.border}`}><i className={`fas fa-folder-open text-4xl mb-3`}></i><h3 className="text-lg font-bold">Belum Ada Data {title}</h3></div>
                        ) : (
                            <>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4"><div className="p-3 bg-blue-100 text-blue-600 rounded-lg"><i className="fas fa-users text-2xl"></i></div><div><p className="text-sm text-gray-500 font-medium">Total Nasabah {title}</p><p className="text-xl font-bold text-gray-800">{filteredData.length} Nasabah</p></div></div>
                                    <div className={`${conf.bg} p-6 rounded-xl shadow-sm border ${conf.border} flex items-center space-x-4`}><div className={`p-3 ${conf.iconBg} ${conf.iconText} rounded-lg`}><i className={`fas ${icon} text-2xl`}></i></div><div><p className={`text-sm ${conf.iconText} font-medium`}>Total Outstanding (UP) {title}</p><p className={`text-xl font-bold ${conf.text}`}>{formatRupiah(totalOut)}</p></div></div>
                                </div>
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto mt-6">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead><tr className="bg-gray-50 text-gray-600 border-b"><th className="p-4 font-medium">No. Kontrak</th><th className="p-4 font-medium">Nama Nasabah</th><th className="p-4 font-medium">Produk</th><th className="p-4 font-medium">Outstanding (UP)</th><th className="p-4 font-medium text-center">Kol</th><th className="p-4 font-medium text-center">Tunggakan</th><th className="p-4 font-medium">Cabang</th><th className="p-4 font-medium">Outlet</th></tr></thead>
                                        <tbody>
                                            {filteredData.map((item, index) => (
                                                <tr key={index} className="border-b hover:bg-gray-50"><td className="p-4 font-medium text-gray-800 whitespace-nowrap">{item.NO_KONTRAK}</td><td className="p-4 text-gray-700">{item.CUSTOMER_NM}</td><td className="p-4 text-gray-600 whitespace-nowrap">{item['SUB PRODUK']}</td><td className="p-4 font-semibold text-gray-800">{formatRupiah(item.UP)}</td><td className="p-4 text-center"><span className="px-2 py-1 rounded text-xs font-bold bg-gray-200">{item.KOLEKTIBILITAS || '-'}</span></td><td className="p-4 text-center text-red-600 font-medium whitespace-nowrap">{item.HARI_TUNGGAKAN} Hari</td><td className="p-4 text-gray-600 whitespace-nowrap">{item.CABANG}</td><td className="p-4 text-gray-600 whitespace-nowrap">{item.OUTLET}</td></tr>
                                            ))}
                                            {filteredData.length === 0 && <tr><td colSpan="8" className="p-6 text-center text-gray-500">Tidak ada data ditemukan.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </>
                        )}
                    </div>
                );
            };

            const LarView = () => <TableNasabahView title="Data LAR 11 sd 30 Hari" data={larData} type="lar" icon="fa-exclamation-circle" />;
            const NplView = () => <TableNasabahView title="Data NPL (KOL 3 sd 5)" data={nplData} type="npl" icon="fa-exclamation-triangle" />;

            const ReportRealisasiView = () => {
                const [selectedCabang, setSelectedCabang] = useState('Semua');
                const cabangList = [...new Set(reportData.map(item => item.NAMA_CABANG).filter(Boolean))];

                const downloadPDFReport = () => {
                    if (typeof window.jspdf === 'undefined') return showToast('Library PDF belum dimuat.', 'error');
                    if (reportData.length === 0) return showToast('Tidak ada data untuk didownload', 'error');

                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(`Report Realisasi Mikro - Area Medan 1`, 14, 15);
                        doc.setFontSize(10); doc.text(`Cabang: ${selectedCabang}`, 14, 22);

                        if (selectedCabang === 'Semua') {
                            const tableColumn = ["Cabang", "Tgt OSL", "Real OSL", "Capai OSL", "Tgt NPL", "Real NPL", "Capai NPL", "Tgt LAR", "Real LAR", "Capai LAR", "Tgt Rata2", "Real Rata2", "Capai Rata2", "Tgt NOA", "Real NOA", "Capai NOA"];
                            const tableRows = reportData.map(item => [ item.NAMA_CABANG || '-', item.TARGET_OSL || '-', item.REALISASI_OSL || '-', item.PENCAPAIAN_OSL || '-', item.TARGET_NPL || '-', item.REALISASI_NPL || '-', item.PENCAPAIAN_NPL || '-', item.TARGET_LAR || '-', item.REALISASI_LAR || '-', item.PENCAPAIAN_LAR || '-', item.TARGET_RATA2 || '-', item.REALISASI_RATA2 || '-', item.PENCAPAIAN_RATA2 || '-', item.TARGET_NOA || '-', item.REALISASI_NOA || '-', item.PENCAPAIAN_NOA || '-' ]);
                            doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 6, cellPadding: 1 }, headStyles: { fillColor: [37, 99, 235] } });
                        } else {
                            const currentData = reportData.find(item => item.NAMA_CABANG === selectedCabang);
                            if(!currentData) return;
                            const tableColumn = ["Komponen", "Target", "Realisasi", "Pencapaian"];
                            const tableRows = [
                                ["OSL GROS MIKRO", currentData.TARGET_OSL||'-', currentData.REALISASI_OSL||'-', currentData.PENCAPAIAN_OSL||'-'],
                                ["NPL MIKRO", currentData.TARGET_NPL||'-', currentData.REALISASI_NPL||'-', currentData.PENCAPAIAN_NPL||'-'],
                                ["LAR MIKRO", currentData.TARGET_LAR||'-', currentData.REALISASI_LAR||'-', currentData.PENCAPAIAN_LAR||'-'],
                                ["RATA2 MIKRO", currentData.TARGET_RATA2||'-', currentData.REALISASI_RATA2||'-', currentData.PENCAPAIAN_RATA2||'-'],
                                ["NASABAH BARU", currentData.TARGET_NOA||'-', currentData.REALISASI_NOA||'-', currentData.PENCAPAIAN_NOA||'-']
                            ];
                            doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 9 }, headStyles: { fillColor: [37, 99, 235] } });
                        }
                        doc.save(`Report_Realisasi_${selectedCabang === 'Semua' ? 'Semua_Cabang' : selectedCabang.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
                        showToast('File PDF Report berhasil didownload!');
                    } catch (error) { showToast('Gagal memproses PDF.', 'error'); }
                };

                const currentData = selectedCabang === 'Semua' ? null : reportData.find(item => item.NAMA_CABANG === selectedCabang);

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row justify-between md:items-center gap-4 border-b pb-4">
                            <div><h2 className="text-2xl font-bold text-gray-800">Report Realisasi Mikro</h2><p className="text-sm text-gray-500">Pencapaian Target dan Realisasi per Cabang.</p></div>
                            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                                <button onClick={downloadPDFReport} className="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center space-x-2"><i className="fas fa-file-pdf"></i> <span>Download PDF</span></button>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium text-gray-600">Pilih Cabang:</label><select value={selectedCabang} onChange={(e) => setSelectedCabang(e.target.value)} className="w-full sm:w-48 p-2 border rounded-lg bg-white text-sm"><option value="Semua">-- Semua Cabang --</option>{cabangList.map((cabang, idx) => <option key={idx} value={cabang}>{cabang}</option>)}</select></div>
                            </div>
                        </div>

                        {reportData.length === 0 ? (
                            <div className="bg-blue-50 text-blue-800 p-8 text-center rounded-xl border border-blue-100"><i className="fas fa-chart-line text-4xl mb-3"></i><h3 className="text-lg font-bold">Belum Ada Data Report</h3></div>
                        ) : selectedCabang === 'Semua' ? (
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto mt-6">
                                <table className="w-full text-left border-collapse text-xs whitespace-nowrap">
                                    <thead>
                                        <tr className="bg-blue-600 text-white border-b"><th className="p-3 font-medium" rowSpan="2">Nama Cabang</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">OSL Gros Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">NPL Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">LAR Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">Rata-rata Mikro</th><th className="p-2 font-medium text-center border-l border-blue-500" colSpan="3">Nasabah Baru</th></tr>
                                        <tr className="bg-blue-50 text-blue-800 border-b"><th className="p-2 border-l border-blue-100 font-medium text-right">Target</th><th className="p-2 border-l border-blue-100 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-100 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-200 font-medium text-right">Target</th><th className="p-2 border-l border-blue-200 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-200 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-100 font-medium text-right">Target</th><th className="p-2 border-l border-blue-100 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-100 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-200 font-medium text-right">Target</th><th className="p-2 border-l border-blue-200 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-200 font-medium text-center">Capai</th><th className="p-2 border-l border-blue-100 font-medium text-right">Target</th><th className="p-2 border-l border-blue-100 font-medium text-right">Realisasi</th><th className="p-2 border-l border-blue-100 font-medium text-center">Capai</th></tr>
                                    </thead>
                                    <tbody>
                                        {reportData.map((item, index) => (
                                            <tr key={index} className="border-b hover:bg-gray-50"><td className="p-3 font-bold text-gray-700">{item.NAMA_CABANG}</td><td className="p-2 border-l text-right text-gray-600">{item.TARGET_OSL}</td><td className="p-2 border-l text-right text-gray-600">{item.REALISASI_OSL}</td><td className="p-2 border-l text-center font-bold text-blue-600">{item.PENCAPAIAN_OSL}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.TARGET_NPL}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.REALISASI_NPL}</td><td className="p-2 border-l text-center font-bold text-red-600 bg-gray-50">{item.PENCAPAIAN_NPL}</td><td className="p-2 border-l text-right text-gray-600">{item.TARGET_LAR}</td><td className="p-2 border-l text-right text-gray-600">{item.REALISASI_LAR}</td><td className="p-2 border-l text-center font-bold text-orange-600">{item.PENCAPAIAN_LAR}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.TARGET_RATA2}</td><td className="p-2 border-l text-right text-gray-600 bg-gray-50">{item.REALISASI_RATA2}</td><td className="p-2 border-l text-center font-bold text-green-600 bg-gray-50">{item.PENCAPAIAN_RATA2}</td><td className="p-2 border-l text-right text-gray-600">{item.TARGET_NOA}</td><td className="p-2 border-l text-right text-gray-600">{item.REALISASI_NOA}</td><td className="p-2 border-l text-center font-bold text-purple-600">{item.PENCAPAIAN_NOA}</td></tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        ) : !currentData ? (
                            <div className="p-8 text-center text-gray-500">Cabang yang dipilih tidak memiliki data.</div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-blue-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">1. OSL GROS MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-blue-600 mt-1">{currentData.PENCAPAIAN_OSL || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-red-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">2. NPL MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-red-600 mt-1">{currentData.PENCAPAIAN_NPL || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-orange-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">3. LAR MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_LAR || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_LAR || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-orange-600 mt-1">{currentData.PENCAPAIAN_LAR || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-green-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">4. RATA2 MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-green-600 mt-1">{currentData.PENCAPAIAN_RATA2 || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-purple-500"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">5. NASABAH BARU</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.TARGET_NOA || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate">{currentData.REALISASI_NOA || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-purple-600 mt-1">{currentData.PENCAPAIAN_NOA || '-'}</p></div></div></div>
                            </div>
                        )}
                    </div>
                );
            };

            const Dashboard = ({ type }) => {
                const todayStr = new Date().toISOString().split('T')[0];
                const [selectedAO, setSelectedAO] = useState('Semua');
                const [startDate, setStartDate] = useState(todayStr); 
                const [endDate, setEndDate] = useState(todayStr); 
                
                const currentDataArr = type === 'realisasi' ? data : estimasiData;
                
                // Extract list of officers for the dropdown based on what type of dashboard it is
                const personListData = currentDataArr.map(item => item.Petugas).filter(Boolean);
                const combinedList = ['Semua', ...new Set([...personListData, ...(type === 'realisasi' ? adminList : aoList)])];
                
                const activePersons = new Set(currentDataArr.map(item => item.Petugas));
                const inactivePersons = (type === 'realisasi' ? adminList : aoList).filter(p => !activePersons.has(p));

                const filteredData = currentDataArr.filter(item => {
                    const matchPerson = selectedAO === 'Semua' || item.Petugas === selectedAO;
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchPerson && matchDate;
                });

                const totalPlafon = filteredData.reduce((sum, item) => sum + (Number(item.Plafon) || 0), 0);
                
                const productStats = filteredData.reduce((acc, item) => {
                    const prod = item.Produk || 'Belum Kategori';
                    if (!acc[prod]) acc[prod] = { count: 0, amount: 0 };
                    acc[prod].count += 1; acc[prod].amount += (Number(item.Plafon) || 0); return acc;
                }, {});

                const labelTitle = type === 'realisasi' ? 'Realisasi Pencairan (Admin)' : 'Estimasi Pencairan (AO)';
                const labelPerson = type === 'realisasi' ? 'Admin Mikro' : 'Petugas (AO)';

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row justify-between md:items-center gap-4 border-b pb-4">
                            <div><h2 className="text-2xl font-bold text-gray-800">Dashboard {labelTitle}</h2><p className="text-sm text-gray-500 mt-1">Data ditampilkan berdasar rentang tanggal yang dipilih.</p></div>
                            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium text-gray-600">Tgl:</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="p-2 border rounded-lg bg-white text-sm" /><span className="text-gray-400">-</span><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="p-2 border rounded-lg bg-white text-sm" /></div>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium text-gray-600 whitespace-nowrap">{labelPerson}:</label><select value={selectedAO} onChange={(e) => setSelectedAO(e.target.value)} className="w-full sm:w-40 p-2 border rounded-lg bg-white text-sm">{combinedList.map((p, idx) => <option key={idx} value={p}>{p}</option>)}</select></div>
                            </div>
                        </div>

                        {inactivePersons.length > 0 && (
                            <div className="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg flex items-start space-x-3"><div className="text-orange-500 mt-0.5"><i className="fas fa-exclamation-circle text-lg"></i></div><div className="w-full"><h3 className="text-sm font-bold text-orange-800 mb-1">{labelPerson} Belum Melakukan {type === 'realisasi' ? 'Pencairan' : 'Estimasi'}</h3><div className="flex flex-wrap gap-2 mt-2">{inactivePersons.map((p, idx) => <span key={idx} className="bg-orange-100 text-orange-700 px-2.5 py-1 rounded-md text-xs font-semibold border border-orange-200">{p}</span>)}</div></div></div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4"><div className="p-3 bg-blue-100 text-blue-600 rounded-lg"><i className="fas fa-users text-2xl"></i></div><div><p className="text-sm text-gray-500 font-medium">Total Nasabah (Rentang Terpilih)</p><p className="text-2xl font-bold text-gray-800">{filteredData.length}</p></div></div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4"><div className="p-3 bg-green-100 text-green-600 rounded-lg"><i className="fas fa-money-bill-wave text-2xl"></i></div><div><p className="text-sm text-gray-500 font-medium">Total Nominal (Rentang Terpilih)</p><p className="text-xl md:text-2xl font-bold text-gray-800">{formatRupiah(totalPlafon)}</p></div></div>
                        </div>

                        <div className="mt-8">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Pencapaian Per Produk</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                {Object.keys(productStats).length > 0 ? ( Object.entries(productStats).map(([prod, stats], idx) => ( <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><div className="flex justify-between items-start mb-2"><span className="text-sm font-semibold text-gray-700 uppercase">{prod}</span><span className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-full">{stats.count} Nsbh</span></div><p className="text-lg font-bold text-gray-800">{formatRupiah(stats.amount)}</p></div> )) ) : ( <div className="col-span-full p-4 bg-gray-50 text-gray-500 text-center rounded-lg border border-dashed border-gray-200">Tidak ada data di rentang tanggal ini.</div> )}
                            </div>
                        </div>
                    </div>
                );
            };

            const FormPencairan = ({ type }) => {
                const isRealisasi = type === 'realisasi';
                const initialPetugas = isRealisasi ? (adminList.length > 0 ? adminList[0] : '') : (aoList.length > 0 ? aoList[0] : '');
                const [form, setForm] = useState({ Tanggal: new Date().toISOString().split('T')[0], Nama: '', NoKredit: '', Produk: productList.length > 0 ? productList[0] : '', Plafon: '', Tenor: '3', Petugas: initialPetugas });
                const handleChange = (e) => setForm({...form, [e.target.name]: e.target.value});
                const handleSubmit = (e) => { e.preventDefault(); submitData(form, type); };

                return (
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 max-w-2xl">
                        <h2 className="text-xl font-bold text-gray-800 mb-6 border-b pb-4">Formulir {isRealisasi ? 'Pencairan Baru (Admin)' : 'Estimasi Baru (AO)'}</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal {isRealisasi ? 'Pencairan' : 'Estimasi'}</label><input type="date" name="Tanggal" value={form.Tanggal} onChange={handleChange} required className="w-full p-2.5 border rounded-lg" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nama {isRealisasi ? 'Admin Mikro' : 'Petugas (AO)'}</label>
                                    {(isRealisasi ? adminList : aoList).length > 0 ? ( <select name="Petugas" value={form.Petugas} onChange={handleChange} required className="w-full p-2.5 border rounded-lg"><option value="" disabled>-- Pilih Nama --</option>{(isRealisasi ? adminList : aoList).map((p, idx) => <option key={idx} value={p}>{p}</option>)}</select> ) : ( <input type="text" name="Petugas" value={form.Petugas} onChange={handleChange} required placeholder="Ketik Manual" className="w-full p-2.5 border rounded-lg" /> )}
                                </div>
                                <div className={`md:col-span-2`}><label className="block text-sm font-medium text-gray-700 mb-1">Nama Nasabah</label><input type="text" name="Nama" value={form.Nama} onChange={handleChange} required placeholder="Nama Lengkap Nasabah" className="w-full p-2.5 border rounded-lg" /></div>
                                {isRealisasi && ( <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Nomor Kredit</label><input type="text" name="NoKredit" value={form.NoKredit} onChange={handleChange} required placeholder="Masukkan Nomor Kredit" className="w-full p-2.5 border rounded-lg" /></div> )}
                                <div className={isRealisasi ? "md:col-span-2" : ""}><label className="block text-sm font-medium text-gray-700 mb-1">Jenis Produk</label><select name="Produk" value={form.Produk} onChange={handleChange} required className="w-full p-2.5 border rounded-lg">{productList.map((prod, idx) => <option key={idx} value={prod}>{prod}</option>)}</select></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nominal {isRealisasi ? 'Plafon' : 'Estimasi'} (Rp)</label><input type="number" name="Plafon" value={form.Plafon} onChange={handleChange} required placeholder="Contoh: 5000000" className="w-full p-2.5 border rounded-lg" /></div>
                                {isRealisasi && ( <div><label className="block text-sm font-medium text-gray-700 mb-1">Tenor (Bulan)</label><select name="Tenor" value={form.Tenor} onChange={handleChange} required className="w-full p-2.5 border rounded-lg"><option value="3">3 Bulan</option><option value="4">4 Bulan</option><option value="6">6 Bulan</option><option value="12">12 Bulan</option><option value="18">18 Bulan</option><option value="24">24 Bulan</option><option value="36">36 Bulan</option><option value="48">48 Bulan</option><option value="60">60 Bulan</option></select></div> )}
                            </div>
                            <div className="pt-4"><button type="submit" disabled={isLoading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg flex items-center justify-center space-x-2 disabled:bg-blue-300">{isLoading ? <><i className="fas fa-spinner fa-spin"></i><span>Menyimpan...</span></> : <><i className="fas fa-save"></i><span>Simpan Data</span></>}</button></div>
                        </form>
                    </div>
                );
            };

            const DeleteButton = ({ item, type, onDelete }) => {
                const [confirm, setConfirm] = useState(false);
                if (confirm) {
                    return (
                        <div className="flex flex-col space-y-1"><span className="text-[10px] text-gray-500">Yakin?</span><div className="flex space-x-1"><button onClick={() => onDelete(item, type)} className="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs">Ya</button><button onClick={() => setConfirm(false)} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded text-xs">Batal</button></div></div>
                    );
                }
                return <button onClick={() => setConfirm(true)} className="text-red-500 hover:text-red-700 p-2"><i className="fas fa-trash"></i></button>;
            };

            const DataTable = ({ type }) => {
                const isRealisasi = type === 'realisasi';
                const currentData = isRealisasi ? data : estimasiData;
                
                const todayStr = new Date().toISOString().split('T')[0];
                const [startDate, setStartDate] = useState(todayStr); 
                const [endDate, setEndDate] = useState(todayStr); 
                const [searchTerm, setSearchTerm] = useState('');

                const filteredData = currentData.filter(item => {
                    const matchSearch = (item.Nama && item.Nama.toLowerCase().includes(searchTerm.toLowerCase())) || ((item.NoKredit) && String(item.NoKredit).includes(searchTerm)) || (item.Petugas && item.Petugas.toLowerCase().includes(searchTerm.toLowerCase()));
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchSearch && matchDate;
                });

                const downloadFilteredPDF = () => {
                    if (typeof window.jspdf === 'undefined') return showToast('Library PDF belum dimuat', 'error');
                    if (filteredData.length === 0) return showToast('Tidak ada data untuk direntang tanggal ini', 'error');
                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(`Rekap ${isRealisasi ? 'Pencairan' : 'Estimasi'} Mikro`, 14, 15);
                        doc.setFontSize(10); doc.text(`Periode: ${startDate} s/d ${endDate}`, 14, 22);
                        
                        let tableColumn, tableRows;
                        if (isRealisasi) {
                            tableColumn = ["Tanggal", "Nama Nasabah", "No Kredit", "Produk", "Plafon", "Tenor", "Admin Mikro"];
                            tableRows = filteredData.map(item => [ item.Tanggal || '-', item.Nama || '-', item.NoKredit || '-', item.Produk || '-', formatRupiah(item.Plafon || 0), `${item.Tenor} Bln`, item.Petugas || '-' ]);
                        } else {
                            tableColumn = ["Tanggal", "Nama Nasabah", "Produk", "Estimasi (Rp)", "Petugas (AO)"];
                            tableRows = filteredData.map(item => [ item.Tanggal || '-', item.Nama || '-', item.Produk || '-', formatRupiah(item.Plafon || 0), item.Petugas || '-' ]);
                        }
                        
                        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: [37, 99, 235] } });
                        doc.save(`Rekap_${isRealisasi ? 'Pencairan' : 'Estimasi'}_${startDate}_sd_${endDate}.pdf`);
                        showToast('File PDF berhasil didownload!');
                    } catch (error) { showToast('Gagal memproses PDF', 'error'); }
                };

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-6 border-b space-y-4">
                            <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
                                <div><h2 className="text-xl font-bold text-gray-800">Data {isRealisasi ? 'Realisasi Pencairan' : 'Estimasi AO'}</h2><p className="text-sm text-gray-500">Kelola riwayat data</p></div>
                                <div className="flex gap-2">
                                    <button onClick={downloadFilteredPDF} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm flex items-center space-x-2 font-medium"><i className="fas fa-file-pdf"></i><span>Download PDF</span></button>
                                    <button onClick={syncFromSheet} disabled={isLoading} className="px-4 py-2 bg-green-50 text-green-600 border border-green-200 rounded-lg"><i className={`fas fa-sync-alt ${isLoading ? 'fa-spin' : ''}`}></i></button>
                                </div>
                            </div>
                            <div className="flex flex-col md:flex-row gap-4 bg-gray-50 p-3 rounded-lg border">
                                <div className="flex items-center space-x-2"><label className="text-sm text-gray-600">Dari:</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="p-2 border rounded-lg text-sm outline-none" /></div>
                                <div className="flex items-center space-x-2"><label className="text-sm text-gray-600">Sampai:</label><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="p-2 border rounded-lg text-sm outline-none" /></div>
                                <div className="relative flex-1"><i className="fas fa-search absolute left-3 top-3 text-gray-400"></i><input type="text" placeholder="Cari Nama/AO..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 border rounded-lg text-sm"/></div>
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 text-gray-600 text-sm border-b">
                                        <th className="p-4 font-medium">Tanggal</th><th className="p-4 font-medium">Nama Nasabah</th>
                                        {isRealisasi && <th className="p-4 font-medium">No. Kredit</th>}
                                        <th className="p-4 font-medium">Produk</th><th className="p-4 font-medium">{isRealisasi ? 'Plafon' : 'Estimasi (Rp)'}</th>
                                        {isRealisasi && <th className="p-4 font-medium">Tenor</th>}
                                        <th className="p-4 font-medium">{isRealisasi ? 'Admin Mikro' : 'Petugas (AO)'}</th>
                                        <th className="p-4 font-medium text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.length > 0 ? filteredData.map((item, index) => (
                                        <tr key={index} className="border-b hover:bg-gray-50 text-sm">
                                            <td className="p-4 text-gray-700 whitespace-nowrap">{item.Tanggal}</td>
                                            <td className="p-4 font-medium text-gray-800 whitespace-nowrap">{item.Nama}</td>
                                            {isRealisasi && <td className="p-4 text-gray-500 whitespace-nowrap">{item.NoKredit}</td>}
                                            <td className="p-4"><span className="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs">{item.Produk || '-'}</span></td>
                                            <td className="p-4 text-gray-800 font-semibold whitespace-nowrap">{formatRupiah(item.Plafon)}</td>
                                            {isRealisasi && <td className="p-4 text-gray-600 whitespace-nowrap">{item.Tenor} Bln</td>}
                                            <td className="p-4 text-gray-600 whitespace-nowrap">{item.Petugas}</td>
                                            <td className="p-4 text-center"><DeleteButton item={item} type={type} onDelete={deleteDataPencairan} /></td>
                                        </tr>
                                    )) : <tr><td colSpan={isRealisasi ? "8" : "6"} className="p-8 text-center text-gray-500">Belum ada data di rentang ini.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // Komponen Item Sidebar
            const NavItem = ({ id, icon, label }) => (
                <button onClick={() => setActiveTab(id)} className={`w-full flex items-center space-x-3 px-6 py-2.5 mb-1 transition-colors sidebar-item ${activeTab === id ? 'sidebar-active' : 'text-gray-600'}`}>
                    <i className={`fas ${icon} w-5 text-center`}></i>
                    <span className="font-medium text-sm text-left">{label}</span>
                </button>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* LAYAR LOGIN KHUSUS */}
                    {!userRole && (
                        <div className="w-full h-screen flex bg-gray-50 absolute z-[100] top-0 left-0 overflow-hidden">
                            <div className="hidden md:flex md:w-1/2 bg-white flex-col items-center justify-center p-12 border-r border-gray-100 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10"><SvgLogo className="w-full max-w-md drop-shadow-xl hover:scale-105 transition-transform duration-700" /></div>
                            <div className="w-full md:w-1/2 flex items-center justify-center p-6 bg-gray-50 relative overflow-hidden">
                                <div className="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none"><SvgLogo className="w-[150%] h-[150%] max-w-none" /></div>
                                <div className="bg-white/95 backdrop-blur p-8 md:p-10 rounded-3xl shadow-xl w-full max-w-md text-center relative z-10 border border-gray-100">
                                    <div className="md:hidden mx-auto mb-6 flex justify-center"><SvgLogo className="h-28 w-28 drop-shadow-md" /></div>
                                    <h1 className="text-2xl font-bold text-gray-800 mb-2">Dashboard Area Medan 1</h1>
                                    <form onSubmit={processLogin} className="space-y-4 text-left mt-8">
                                        {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200"><i className="fas fa-exclamation-circle mr-2"></i> {loginError}</div>}
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Username</label><div className="relative"><i className="fas fa-user absolute left-3 top-3.5 text-gray-400"></i><input type="text" name="username" value={loginData.username} onChange={handleLoginChange} required placeholder="Masukkan Username" className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg outline-none bg-white/50" /></div></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Password</label><div className="relative"><i className="fas fa-key absolute left-3 top-3.5 text-gray-400"></i><input type="password" name="password" value={loginData.password} onChange={handleLoginChange} required placeholder="Masukkan Password" className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg outline-none bg-white/50" /></div></div>
                                        <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-semibold transition flex items-center justify-center space-x-2 mt-6 shadow-md"><i className="fas fa-sign-in-alt"></i> <span>Masuk Aplikasi</span></button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* SIDEBAR NAVIGASI TERBARU (Sama persis seperti gambar) */}
                    <div className="w-64 bg-white shadow-lg z-10 flex-col hidden md:flex">
                        <div className="p-4 border-b flex flex-col items-center text-center pt-6"><SvgLogo className="h-20 w-20 mb-3 drop-shadow-sm" /><h1 className="text-lg font-bold text-gray-800 leading-tight">Area Medan 1</h1></div>
                        <nav className="flex-1 overflow-y-auto py-4 custom-scrollbar">
                            <div className="px-6 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">DASHBOARD</div>
                            <NavItem id="dashReal" icon="fa-pie-chart" label="Realisasi (Admin)" />
                            <NavItem id="dashEst" icon="fa-chart-bar text-purple-500" label="Estimasi (AO)" />
                            
                            <div className="px-6 mt-6 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">INPUT DATA</div>
                            <NavItem id="formReal" icon="fa-file-invoice-dollar" label="Input Realisasi" />
                            <NavItem id="formEst" icon="fa-edit text-purple-500" label="Input Estimasi" />
                            
                            <div className="px-6 mt-6 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">LAPORAN CSV</div>
                            <NavItem id="lar" icon="fa-exclamation-circle text-orange-500" label="LAR 11 - 30 Hari" />
                            <NavItem id="npl" icon="fa-exclamation-triangle text-red-500" label="NPL (KOL 3 - 5)" />
                            <NavItem id="report" icon="fa-chart-line text-blue-500" label="Report Realisasi" />
                            
                            {userRole === 'admin' && (
                                <>
                                    <div className="px-6 mt-6 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">KHUSUS ADMIN</div>
                                    <NavItem id="dataReal" icon="fa-table" label="Rekap Realisasi" />
                                    <NavItem id="dataEst" icon="fa-list-alt text-purple-500" label="Rekap Estimasi" />
                                    <NavItem id="admin" icon="fa-cog text-gray-600" label="Kelola & Setting" />
                                </>
                            )}
                        </nav>
                        <div className="p-4 border-t"><button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition font-medium"><i className="fas fa-sign-out-alt"></i> <span>Keluar</span></button></div>
                    </div>
                    
                    {/* NAVIGASI MOBILE (Bawah) */}
                    <div className="md:hidden fixed bottom-0 w-full bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-50 flex justify-around p-1 overflow-x-auto">
                        <button onClick={() => setActiveTab('dashReal')} className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${activeTab === 'dashReal' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-pie-chart mb-1 text-sm"></i><span className="text-[9px]">Dash</span></button>
                        <button onClick={() => setActiveTab('formReal')} className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${activeTab === 'formReal' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-plus mb-1 text-sm"></i><span className="text-[9px]">Input</span></button>
                        <button onClick={() => setActiveTab('lar')} className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${activeTab === 'lar' ? 'text-orange-600' : 'text-gray-500'}`}><i className="fas fa-exclamation-circle mb-1 text-sm"></i><span className="text-[9px]">LAR</span></button>
                        <button onClick={() => setActiveTab('npl')} className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${activeTab === 'npl' ? 'text-red-600' : 'text-gray-500'}`}><i className="fas fa-exclamation-triangle mb-1 text-sm"></i><span className="text-[9px]">NPL</span></button>
                        <button onClick={() => setActiveTab('report')} className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${activeTab === 'report' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-chart-line mb-1 text-sm"></i><span className="text-[9px]">Report</span></button>
                        {userRole === 'admin' && (
                            <>
                                <button onClick={() => setActiveTab('dataReal')} className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${activeTab === 'dataReal' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-table mb-1 text-sm"></i><span className="text-[9px]">Data</span></button>
                                <button onClick={() => setActiveTab('admin')} className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${activeTab === 'admin' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-cog mb-1 text-sm"></i><span className="text-[9px]">Kelola</span></button>
                            </>
                        )}
                        <button onClick={handleLogout} className="p-2 rounded-lg flex flex-col items-center text-red-500 min-w-[50px]"><i className="fas fa-sign-out-alt mb-1 text-sm"></i><span className="text-[9px]">Keluar</span></button>
                    </div>
                    
                    {/* AREA KONTEN UTAMA */}
                    <div className="flex-1 overflow-y-auto pb-20 md:pb-0 relative custom-scrollbar">
                        <header className="bg-white p-4 shadow-sm flex justify-between items-center md:hidden border-b sticky top-0 z-20">
                            <div className="flex items-center space-x-3"><SvgLogo className="h-10 w-10 drop-shadow-sm" /><h1 className="text-md font-bold text-gray-800 leading-tight">Area Medan 1</h1></div>
                            <div className="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full capitalize font-medium">{userRole === 'admin' ? 'Admin Mode' : 'AO Mode'}</div>
                        </header>
                        <main className="p-4 md:p-8">
                            {activeTab === 'dashReal' && <Dashboard type="realisasi" />}
                            {activeTab === 'dashEst' && <Dashboard type="estimasi" />}
                            {activeTab === 'formReal' && <FormPencairan type="realisasi" />}
                            {activeTab === 'formEst' && <FormPencairan type="estimasi" />}
                            {activeTab === 'lar' && <LarView />}
                            {activeTab === 'npl' && <NplView />}
                            {activeTab === 'report' && <ReportRealisasiView />}
                            {activeTab === 'dataReal' && userRole === 'admin' && <DataTable type="realisasi" />}
                            {activeTab === 'dataEst' && userRole === 'admin' && <DataTable type="estimasi" />}
                            {activeTab === 'admin' && userRole === 'admin' && <AdminPanel />}
                        </main>
                    </div>

                    {/* TOAST NOTIFIKASI */}
                    {toastMessage && (
                        <div className={`fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 text-white ${toastMessage.type === 'error' ? 'bg-red-500' : 'bg-gray-800'}`}>
                            <i className={`fas ${toastMessage.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i><span>{toastMessage.message}</span>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
