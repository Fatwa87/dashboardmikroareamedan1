<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Area Medan 1</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF Library (UNTUK DOWNLOAD PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #eff6ff; color: #1d4ed8; border-right: 4px solid #1d4ed8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // URL GOOGLE APPS SCRIPT TERBARU SUDAH DITANAM DI SINI
        const GLOBAL_SHEET_URL = "https://script.google.com/macros/s/AKfycbzDBBVzhFBEEoW1GpXqbnjMHwYmOuNJFMyCaLB8sUfGvOFFKDSzgtY1HeqIrc8Ri2YB/exec";

        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        };

        const App = () => {
            const SvgLogo = ({ className }) => (
                <svg viewBox="0 0 400 400" className={className} xmlns="http://www.w3.org/2000/svg">
                    <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#f97316" strokeWidth="10" />
                    <path d="M 200 10 A 190 190 0 0 1 390 200" fill="none" stroke="#0f172a" strokeWidth="15" />
                    <path d="M 10 200 A 190 190 0 0 0 200 390" fill="none" stroke="#0f172a" strokeWidth="15" />
                    <path d="M 50 350 L 140 260" stroke="#f97316" strokeWidth="8" strokeLinecap="round" />
                    <path d="M 40 320 L 120 240" stroke="#fbbf24" strokeWidth="6" strokeLinecap="round" />
                    <path d="M 80 360 L 160 280" stroke="#fbbf24" strokeWidth="6" strokeLinecap="round" />
                    <g transform="translate(180, 150) rotate(45)">
                        <path d="M0,-80 C30,-30 40,40 40,80 L-40,80 C-40,40 -30,-30 0,-80 Z" fill="#ffffff" stroke="#0f172a" strokeWidth="8"/>
                        <circle cx="0" cy="-10" r="12" fill="#f97316" stroke="#0f172a" strokeWidth="4"/>
                        <path d="M-40,40 L-70,80 L-40,80 Z" fill="#0f172a"/>
                        <path d="M40,40 L70,80 L40,80 Z" fill="#0f172a"/>
                        <path d="M0,40 L0,90" stroke="#0f172a" strokeWidth="8"/>
                    </g>
                    <g transform="translate(160, 210) rotate(-15)">
                        <path d="M 0 0 L 220 0 L 200 100 L -20 100 Z" fill="#0f172a" />
                        <text x="20" y="35" fill="#ffffff" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="30" letterSpacing="1">AREA</text>
                        <text x="20" y="65" fill="#ffffff" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="30" letterSpacing="1">MEDAN</text>
                        <text x="20" y="90" fill="#f97316" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="24" letterSpacing="2">JUARA</text>
                        <text x="160" y="60" fill="#f97316" fontFamily="Inter, sans-serif" fontWeight="900" fontSize="60">1</text>
                    </g>
                </svg>
            );

            const [activeTab, setActiveTab] = useState('dashboard');
            const [data, setData] = useState([]);
            const [sheetUrl, setSheetUrl] = useState(GLOBAL_SHEET_URL);
            const [isLoading, setIsLoading] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            const [userRole, setUserRole] = useState(null);
            const [aoList, setAoList] = useState([]);
            const [loginData, setLoginData] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');

            const defaultUsers = [
                { username: 'admin', password: 'Area@123!', role: 'admin' },
                { username: 'ao', password: 'ao123', role: 'ao' }
            ];
            const [appUsers, setAppUsers] = useState(defaultUsers);

            const defaultProducts = [
                "0302:KREASI BARU", "0303:KREASI FLEXI", "0701:KREASI ULTRA MIKRO", 
                "1402:ARRUM BPKB", "1501:AMANAH", "1801:RAHN TASJILY TANAH", 
                "4001:KRESNA KHUSUS", "4601:ARRUM MULTIGUNA", "7601:ARRUM EXPRESS LOAN", 
                "7701:KREASI MULTI GUNA", "8901:KUPEDES PEGADAIAN"
            ];
            const [productList, setProductList] = useState(defaultProducts);

            const [larData, setLarData] = useState([]);
            const [nplData, setNplData] = useState([]);
            const [reportData, setReportData] = useState([]);

            useEffect(() => {
                const savedData = localStorage.getItem('mikroData');
                const savedRole = localStorage.getItem('userRole');
                const savedAo = localStorage.getItem('aoList');
                const savedProducts = localStorage.getItem('productList');
                const savedLar = localStorage.getItem('larData');
                const savedNpl = localStorage.getItem('nplData');
                const savedReport = localStorage.getItem('reportData');
                const savedUsers = localStorage.getItem('appUsers');
                
                if (savedData) setData(JSON.parse(savedData));
                if (savedRole) setUserRole(savedRole);
                if (savedAo) setAoList(JSON.parse(savedAo));
                if (savedProducts) setProductList(JSON.parse(savedProducts));
                if (savedLar) setLarData(JSON.parse(savedLar));
                if (savedNpl) setNplData(JSON.parse(savedNpl));
                if (savedReport) setReportData(JSON.parse(savedReport));
                if (savedUsers) setAppUsers(JSON.parse(savedUsers));
            }, []);

            useEffect(() => {
                if (userRole && sheetUrl) syncFromSheet();
            }, [userRole]);

            const showToast = (message, type = 'success') => {
                setToastMessage({ message, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            const syncFromSheet = async () => {
                if (!sheetUrl) return;
                setIsLoading(true);
                try {
                    const response = await fetch(sheetUrl);
                    const result = await response.json();
                    
                    if(result) {
                        if(result.pencairan) {
                            const validData = result.pencairan.filter(item => item.Tanggal || item.Nama);
                            setData(validData);
                            localStorage.setItem('mikroData', JSON.stringify(validData));
                        }
                        if(result.lar) {
                            setLarData(result.lar);
                            localStorage.setItem('larData', JSON.stringify(result.lar));
                        }
                        if(result.npl) {
                            setNplData(result.npl);
                            localStorage.setItem('nplData', JSON.stringify(result.npl));
                        }
                        if(result.report) {
                            setReportData(result.report);
                            localStorage.setItem('reportData', JSON.stringify(result.report));
                        }
                        if(result.master && result.master.length > 1) {
                            const ao = [], prod = [];
                            for(let i=1; i<result.master.length; i++){
                                if(result.master[i][0]) ao.push(result.master[i][0]);
                                if(result.master[i][1]) prod.push(result.master[i][1]);
                            }
                            setAoList(ao); setProductList(prod);
                            localStorage.setItem('aoList', JSON.stringify(ao));
                            localStorage.setItem('productList', JSON.stringify(prod));
                        }
                        if(result.users && result.users.length > 0) {
                            setAppUsers(result.users);
                            localStorage.setItem('appUsers', JSON.stringify(result.users));
                        }
                        showToast('Database Cloud Tersinkronisasi!');
                    }
                } catch (error) {
                    showToast('Gagal menarik data dari Database', 'error');
                }
                setIsLoading(false);
            };

            const syncMasterToSheet = (newAoList, newProductList) => {
                if (!sheetUrl) return;
                const maxLength = Math.max(newAoList.length, newProductList.length);
                const twoDArray = [['AO', 'Produk']];
                for(let i=0; i<maxLength; i++) {
                    twoDArray.push([newAoList[i] || '', newProductList[i] || '']);
                }
                fetch(sheetUrl, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'save_master', data: twoDArray })
                });
            };

            const syncUsersToSheet = (newUsersList) => {
                if (!sheetUrl) return;
                const twoDArray = [['Username', 'Password', 'Role']];
                newUsersList.forEach(u => twoDArray.push([u.username || '', u.password || '', u.role || '']));
                fetch(sheetUrl, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'save_users', data: twoDArray })
                });
            };

            const deleteDataPencairan = async (itemToDelete) => {
                setIsLoading(true);
                const newData = data.filter(item => item !== itemToDelete);
                setData(newData);
                localStorage.setItem('mikroData', JSON.stringify(newData));

                if (sheetUrl) {
                    try {
                        let tglFormat = itemToDelete.Tanggal;
                        if (tglFormat.includes('T')) tglFormat = tglFormat.split('T')[0];
                        await fetch(sheetUrl, {
                            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: 'delete_pencairan', NoKredit: itemToDelete.NoKredit, Tanggal: tglFormat })
                        });
                        showToast('Data berhasil dihapus dari Cloud!');
                    } catch (error) {
                        showToast('Gagal menghapus dari Database Cloud.', 'error');
                    }
                }
                setIsLoading(false);
            };

            const submitData = async (formData) => {
                setIsLoading(true);
                const newData = [...data, formData];
                setData(newData);
                localStorage.setItem('mikroData', JSON.stringify(newData));

                if (sheetUrl) {
                    try {
                        await fetch(sheetUrl, {
                            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: 'add_pencairan', data: formData })
                        });
                        showToast('Data berhasil disimpan ke Cloud Database!');
                    } catch (error) {
                        showToast('Gagal mengirim ke Cloud Database.', 'error');
                    }
                }
                setIsLoading(false);
                setActiveTab(userRole === 'admin' ? 'data' : 'dashboard'); 
            };

            const processLogin = (e) => {
                e.preventDefault();
                const { username, password } = loginData;
                
                const validUser = appUsers.find(u => u.username === username && u.password === password);
                
                if (validUser) {
                    handleLoginSuccess(validUser.role);
                } else {
                    setLoginError('Username atau Password salah!');
                }
            };
            const handleLoginChange = (e) => { setLoginData({...loginData, [e.target.name]: e.target.value}); setLoginError(''); };
            const handleLoginSuccess = (role) => { setUserRole(role); localStorage.setItem('userRole', role); setActiveTab('dashboard'); };
            const handleLogout = () => { setUserRole(null); localStorage.removeItem('userRole'); setLoginData({ username: '', password: '' }); setActiveTab('dashboard'); };

            const AdminPanel = () => {
                const [newAo, setNewAo] = useState('');
                const [newProduct, setNewProduct] = useState('');
                const [newUser, setNewUser] = useState({ username: '', password: '', role: 'ao' });

                const addAo = () => { if(!newAo) return; const updated = [...aoList, newAo]; setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated)); syncMasterToSheet(updated, productList); setNewAo(''); showToast('AO berhasil ditambahkan'); };
                const removeAo = (ao) => { const updated = aoList.filter(c => c !== ao); setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated)); syncMasterToSheet(updated, productList); showToast('AO dihapus', 'error'); };
                const addProduct = () => { if(!newProduct) return; const updated = [...productList, newProduct]; setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated)); syncMasterToSheet(aoList, updated); setNewProduct(''); showToast('Produk berhasil ditambahkan'); };
                const removeProduct = (prod) => { const updated = productList.filter(p => p !== prod); setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated)); syncMasterToSheet(aoList, updated); showToast('Produk dihapus', 'error'); };

                const addUser = () => {
                    if(!newUser.username || !newUser.password) return showToast('Username & Password wajib diisi', 'error');
                    if(appUsers.some(u => u.username === newUser.username)) return showToast('Username sudah ada!', 'error');
                    
                    const updated = [...appUsers, newUser];
                    setAppUsers(updated);
                    localStorage.setItem('appUsers', JSON.stringify(updated));
                    syncUsersToSheet(updated);
                    setNewUser({ username: '', password: '', role: 'ao' });
                    showToast('User berhasil ditambahkan');
                };

                const removeUser = (username) => {
                    if(username === 'admin') return showToast('Akun admin utama tidak boleh dihapus!', 'error');
                    const updated = appUsers.filter(u => u.username !== username);
                    setAppUsers(updated);
                    localStorage.setItem('appUsers', JSON.stringify(updated));
                    syncUsersToSheet(updated);
                    showToast('User dihapus', 'error');
                };

                const downloadTemplateCSV = (type) => {
                    let headers = '';
                    if (type === 'REPORT') {
                        headers = 'NAMA_CABANG,TARGET_OSL,REALISASI_OSL,PENCAPAIAN_OSL,TARGET_NPL,REALISASI_NPL,PENCAPAIAN_NPL,TARGET_LAR,REALISASI_LAR,PENCAPAIAN_LAR,TARGET_RATA2,REALISASI_RATA2,PENCAPAIAN_RATA2,TARGET_NOA,REALISASI_NOA,PENCAPAIAN_NOA\n10204:CP MEDAN PETISAH,17.698.150.629,17.792.220.707,100.53%,1.66,4.33,38.33%,11.57,18.72,61.81%,16.843.528.392,16.973.417.363,100.77%,175,56,32.01%';
                    } else {
                        headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,KOLEKTIBILITAS,HARI_TUNGGAKAN,UP,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,2,45,5000000,UPC A,CH-1,CABANG A';
                    }
                    const blob = new Blob([headers], { type: 'text/csv' });
                    const a = document.createElement('a'); a.href = window.URL.createObjectURL(blob); a.download = `Template_Upload_${type}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };

                const processCSVUpload = (file, type) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, '');
                            const lines = csv.split(/\r\n|\n/).filter(line => line.trim().length > 0);
                            if (lines.length < 2) throw new Error("Data kosong atau format salah");

                            let delimiter = ',';
                            if (lines[0].includes(';')) delimiter = ';';
                            else if (lines[0].includes('\t')) delimiter = '\t';
                            
                            const requiredHeadersLARNPL = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'UP', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];
                            const requiredHeadersREPORT = ['NAMA_CABANG', 'TARGET_OSL', 'REALISASI_OSL', 'PENCAPAIAN_OSL', 'TARGET_NPL', 'REALISASI_NPL', 'PENCAPAIAN_NPL', 'TARGET_LAR', 'REALISASI_LAR', 'PENCAPAIAN_LAR', 'TARGET_RATA2', 'REALISASI_RATA2', 'PENCAPAIAN_RATA2', 'TARGET_NOA', 'REALISASI_NOA', 'PENCAPAIAN_NOA'];
                            const reqHeaders = type === 'REPORT' ? requiredHeadersREPORT : requiredHeadersLARNPL;
                            
                            const parsedData = [];
                            const twoDArrayForSheet = [reqHeaders];

                            for (let i = 1; i < lines.length; i++) {
                                const currentLine = lines[i].split(delimiter);
                                if (currentLine.length < 2) continue; 
                                const obj = {}; const rowData = [];
                                reqHeaders.forEach((reqHeader, index) => {
                                    let val = currentLine[index] ? currentLine[index].trim().replace(/['"]/g, '') : '';
                                    obj[reqHeader] = val; rowData.push(val);    
                                });
                                if (rowData.some(v => v !== '')) { parsedData.push(obj); twoDArrayForSheet.push(rowData); }
                            }
                            
                            if (parsedData.length === 0) throw new Error("File tidak memiliki baris data yang valid.");
                            
                            if(type === 'LAR') { setLarData(parsedData); localStorage.setItem('larData', JSON.stringify(parsedData));
                            } else if (type === 'NPL') { setNplData(parsedData); localStorage.setItem('nplData', JSON.stringify(parsedData));
                            } else if (type === 'REPORT') { setReportData(parsedData); localStorage.setItem('reportData', JSON.stringify(parsedData)); }
                            
                            if(sheetUrl) {
                                let actionType = type === 'LAR' ? 'upload_lar' : (type === 'NPL' ? 'upload_npl' : 'upload_report');
                                fetch(sheetUrl, {
                                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                    body: JSON.stringify({ action: actionType, data: twoDArrayForSheet })
                                });
                                showToast(`Berhasil! ${parsedData.length} data ${type} berhasil diupload.`);
                            }
                        } catch (error) { showToast(`Gagal Upload ${type}: ${error.message}`, 'error'); }
                    };
                    reader.readAsText(file);
                };

                const handleUploadLar = (e) => { if (e.target.files[0]) processCSVUpload(e.target.files[0], 'LAR'); };
                const handleUploadNpl = (e) => { if (e.target.files[0]) processCSVUpload(e.target.files[0], 'NPL'); };
                const handleUploadReport = (e) => { if (e.target.files[0]) processCSVUpload(e.target.files[0], 'REPORT'); };

                const resetData = (type) => {
                    if(window.confirm(`Yakin ingin menghapus seluruh data ${type}? Data di Cloud Spreadsheet juga akan dikosongkan.`)) {
                        let actionKey = '';
                        if (type === 'LAR') { setLarData([]); localStorage.removeItem('larData'); actionKey = 'upload_lar'; }
                        if (type === 'NPL') { setNplData([]); localStorage.removeItem('nplData'); actionKey = 'upload_npl'; }
                        if (type === 'REPORT') { setReportData([]); localStorage.removeItem('reportData'); actionKey = 'upload_report'; }
                        
                        if(sheetUrl) { fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: actionKey, data: [] }) }); }
                        showToast(`Data ${type} berhasil dikosongkan!`);
                    }
                };

                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {/* KOTAK LAR */}
                            <div className="bg-orange-50 p-6 rounded-xl shadow-sm border border-orange-100 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-xl font-bold text-orange-800"><i className="fas fa-exclamation-circle mr-2"></i>Upload Data LAR</h2>
                                    <p className="text-sm text-orange-600 mt-1">Upload CSV daftar nasabah LAR</p>
                                    <div className="mt-3 flex gap-2">
                                        <button onClick={() => downloadTemplateCSV('LAR')} className="text-xs bg-white text-orange-700 px-3 py-1.5 border border-orange-200 rounded hover:bg-orange-100 transition"><i className="fas fa-download mr-1"></i> Template</button>
                                        <button onClick={() => resetData('LAR')} className="text-xs bg-red-600 text-white px-3 py-1.5 rounded hover:bg-red-700 transition"><i className="fas fa-trash mr-1"></i> Reset</button>
                                    </div>
                                </div>
                                <div className="w-full relative mt-4">
                                    <input type="file" accept=".csv" onChange={handleUploadLar} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-orange-600 hover:bg-orange-700 text-white px-4 py-2.5 rounded-lg flex justify-center items-center pointer-events-none"><i className="fas fa-upload mr-2"></i> Upload CSV LAR</button>
                                </div>
                            </div>
                            {/* KOTAK NPL */}
                            <div className="bg-red-50 p-6 rounded-xl shadow-sm border border-red-100 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-xl font-bold text-red-800"><i className="fas fa-exclamation-triangle mr-2"></i>Upload Data NPL</h2>
                                    <p className="text-sm text-red-600 mt-1">Upload CSV daftar nasabah NPL</p>
                                    <div className="mt-3 flex gap-2">
                                        <button onClick={() => downloadTemplateCSV('NPL')} className="text-xs bg-white text-red-700 px-3 py-1.5 border border-red-200 rounded hover:bg-red-100 transition"><i className="fas fa-download mr-1"></i> Template</button>
                                        <button onClick={() => resetData('NPL')} className="text-xs bg-red-600 text-white px-3 py-1.5 rounded hover:bg-red-700 transition"><i className="fas fa-trash mr-1"></i> Reset</button>
                                    </div>
                                </div>
                                <div className="w-full relative mt-4">
                                    <input type="file" accept=".csv" onChange={handleUploadNpl} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg flex justify-center items-center pointer-events-none"><i className="fas fa-upload mr-2"></i> Upload CSV NPL</button>
                                </div>
                            </div>
                            {/* KOTAK REPORT */}
                            <div className="bg-blue-50 p-6 rounded-xl shadow-sm border border-blue-100 flex flex-col justify-between">
                                <div>
                                    <h2 className="text-xl font-bold text-blue-800"><i className="fas fa-chart-line mr-2"></i>Upload Report</h2>
                                    <p className="text-sm text-blue-600 mt-1">Upload CSV Realisasi Mikro</p>
                                    <div className="mt-3 flex gap-2">
                                        <button onClick={() => downloadTemplateCSV('REPORT')} className="text-xs bg-white text-blue-700 px-3 py-1.5 border border-blue-200 rounded hover:bg-blue-100 transition"><i className="fas fa-download mr-1"></i> Template</button>
                                        <button onClick={() => resetData('REPORT')} className="text-xs bg-red-600 text-white px-3 py-1.5 rounded hover:bg-red-700 transition"><i className="fas fa-trash mr-1"></i> Reset</button>
                                    </div>
                                </div>
                                <div className="w-full relative mt-4">
                                    <input type="file" accept=".csv" onChange={handleUploadReport} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg flex justify-center items-center pointer-events-none"><i className="fas fa-upload mr-2"></i> Upload CSV Report</button>
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Kelola Nama AO / Petugas</h3>
                                <div className="flex gap-2 mb-4"><input type="text" value={newAo} onChange={(e)=>setNewAo(e.target.value)} placeholder="Masukkan Nama AO Baru" className="flex-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" /><button onClick={addAo} className="bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700">Tambah</button></div>

                const cabangList = [...new Set(reportData.map(item => item.NAMA_CABANG).filter(Boolean))];

                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-blue-500 hover:shadow-md transition"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">1. OSL GROS MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.TARGET_OSL}>{currentData.TARGET_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.REALISASI_OSL}>{currentData.REALISASI_OSL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-blue-600 mt-1">{currentData.PENCAPAIAN_OSL || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-red-500 hover:shadow-md transition"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">2. NPL MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.TARGET_NPL}>{currentData.TARGET_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.REALISASI_NPL}>{currentData.REALISASI_NPL || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-red-600 mt-1">{currentData.PENCAPAIAN_NPL || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-orange-500 hover:shadow-md transition"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">3. LAR MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.TARGET_LAR}>{currentData.TARGET_LAR || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.REALISASI_LAR}>{currentData.REALISASI_LAR || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-orange-600 mt-1">{currentData.PENCAPAIAN_LAR || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-green-500 hover:shadow-md transition"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">4. RATA2 MIKRO</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.TARGET_RATA2}>{currentData.TARGET_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.REALISASI_RATA2}>{currentData.REALISASI_RATA2 || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-green-600 mt-1">{currentData.PENCAPAIAN_RATA2 || '-'}</p></div></div></div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-purple-500 hover:shadow-md transition"><h3 className="text-sm font-bold text-gray-800 mb-4 border-b pb-2">5. NASABAH BARU</h3><div className="grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-gray-500 font-bold uppercase">Target</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.TARGET_NOA}>{currentData.TARGET_NOA || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Realisasi</p><p className="text-sm font-bold text-gray-700 mt-1 truncate" title={currentData.REALISASI_NOA}>{currentData.REALISASI_NOA || '-'}</p></div><div><p className="text-[10px] text-gray-500 font-bold uppercase">Pencapaian</p><p className="text-sm font-bold text-purple-600 mt-1">{currentData.PENCAPAIAN_NOA || '-'}</p></div></div></div>
                            </div>
                        )}
                    </div>
                );
            };

            const Dashboard = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const [selectedAO, setSelectedAO] = useState('Semua');
                const [startDate, setStartDate] = useState(todayStr); 
                const [endDate, setEndDate] = useState(todayStr); 
                
                const aoListData = data.map(item => item.Petugas).filter(Boolean);
                const combinedAoList = ['Semua', ...new Set([...aoListData, ...aoList])];
                const activeAOs = new Set(data.map(item => item.Petugas));
                const inactiveAOs = aoList.filter(ao => !activeAOs.has(ao));

                const filteredData = data.filter(item => {
                    const matchAo = selectedAO === 'Semua' || item.Petugas === selectedAO;
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchAo && matchDate;
                });

                const totalPlafon = filteredData.reduce((sum, item) => sum + (Number(item.Plafon) || 0), 0);
                
                const productStats = filteredData.reduce((acc, item) => {
                    const prod = item.Produk || 'Belum Kategori';
                    if (!acc[prod]) acc[prod] = { count: 0, amount: 0 };
                    acc[prod].count += 1; acc[prod].amount += (Number(item.Plafon) || 0); return acc;
                }, {});

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">
                            <div><h2 className="text-2xl font-bold text-gray-800">Dashboard Pencapaian</h2><p className="text-sm text-gray-500 mt-1">Data ditampilkan berdasar rentang tanggal yang dipilih.</p></div>
                            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium text-gray-600">Filter Tgl:</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="p-2 border border-gray-300 rounded-lg outline-none bg-white text-sm" /><span className="text-gray-400">-</span><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="p-2 border border-gray-300 rounded-lg outline-none bg-white text-sm" /></div>
                                <div className="flex items-center space-x-2 w-full sm:w-auto"><label className="text-sm font-medium text-gray-600">AO:</label><select value={selectedAO} onChange={(e) => setSelectedAO(e.target.value)} className="w-full sm:w-40 p-2 border border-gray-300 rounded-lg outline-none bg-white text-sm">{combinedAoList.map((ao, idx) => <option key={idx} value={ao}>{ao}</option>)}</select></div>
                            </div>
                        </div>

                        {inactiveAOs.length > 0 && (
                            <div className="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg shadow-sm flex items-start space-x-3"><div className="text-orange-500 mt-0.5"><i className="fas fa-exclamation-circle text-lg"></i></div><div className="w-full"><h3 className="text-sm font-bold text-orange-800 mb-1">AO Belum Melakukan Pencairan</h3><div className="flex flex-wrap gap-2 mt-2">{inactiveAOs.map((ao, idx) => <span key={idx} className="bg-orange-100 text-orange-700 px-2.5 py-1 rounded-md text-xs font-semibold border border-orange-200">{ao}</span>)}</div></div></div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4"><div className="p-3 bg-blue-100 text-blue-600 rounded-lg"><i className="fas fa-users text-2xl"></i></div><div><p className="text-sm text-gray-500 font-medium">Total Nasabah (Rentang Terpilih)</p><p className="text-2xl font-bold text-gray-800">{filteredData.length}</p></div></div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4"><div className="p-3 bg-green-100 text-green-600 rounded-lg"><i className="fas fa-money-bill-wave text-2xl"></i></div><div><p className="text-sm text-gray-500 font-medium">Total Pencapaian (Rentang Terpilih)</p><p className="text-xl md:text-2xl font-bold text-gray-800">{formatRupiah(totalPlafon)}</p></div></div>
                        </div>

                        <div className="mt-8">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Pencapaian Per Produk</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                {Object.keys(productStats).length > 0 ? ( Object.entries(productStats).map(([prod, stats], idx) => ( <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><div className="flex justify-between items-start mb-2"><span className="text-sm font-semibold text-gray-700 uppercase">{prod}</span><span className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-full">{stats.count} Nsbh</span></div><p className="text-lg font-bold text-gray-800">{formatRupiah(stats.amount)}</p></div> )) ) : ( <div className="col-span-full p-4 bg-gray-50 text-gray-500 text-center rounded-lg border border-dashed border-gray-200">Tidak ada pencairan di rentang tanggal ini.</div> )}
                            </div>
                        </div>
                    </div>
                );
            };

            const FormPencairan = () => {
                const [form, setForm] = useState({ Tanggal: new Date().toISOString().split('T')[0], Nama: '', NoKredit: '', Produk: productList.length > 0 ? productList[0] : '', Plafon: '', Tenor: '3', Petugas: aoList.length === 1 ? aoList[0] : '' });
                const handleChange = (e) => setForm({...form, [e.target.name]: e.target.value});
                const handleSubmit = (e) => { e.preventDefault(); submitData(form); };

                return (
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 max-w-2xl">
                        <h2 className="text-xl font-bold text-gray-800 mb-6 border-b pb-4">Formulir Pencairan Baru</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal Pencairan</label><input type="date" name="Tanggal" value={form.Tanggal} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nama Petugas / AO</label>
                                    {aoList.length > 0 ? ( <select name="Petugas" value={form.Petugas} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition"><option value="" disabled>-- Pilih Nama Petugas --</option>{aoList.map((ao, idx) => <option key={idx} value={ao}>{ao}</option>)}</select> ) : ( <input type="text" name="Petugas" value={form.Petugas} onChange={handleChange} required placeholder="Ketik Manual" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition" /> )}
                                </div>
                                <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Nama Nasabah</label><input type="text" name="Nama" value={form.Nama} onChange={handleChange} required placeholder="Nama Lengkap Nasabah" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition" /></div>
                                <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Nomor Kredit</label><input type="text" name="NoKredit" value={form.NoKredit} onChange={handleChange} required placeholder="Masukkan Nomor Kredit" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition" /></div>
                                <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Jenis Produk</label><select name="Produk" value={form.Produk} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition">{productList.map((prod, idx) => <option key={idx} value={prod}>{prod}</option>)}</select></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nominal Plafon (Rp)</label><input type="number" name="Plafon" value={form.Plafon} onChange={handleChange} required placeholder="Contoh: 5000000" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tenor (Bulan)</label><select name="Tenor" value={form.Tenor} onChange={handleChange} required className="w-full p-2.5 border border-gray-300 rounded-lg outline-none transition"><option value="3">3 Bulan</option><option value="4">4 Bulan</option><option value="6">6 Bulan</option><option value="12">12 Bulan</option><option value="18">18 Bulan</option><option value="24">24 Bulan</option><option value="36">36 Bulan</option><option value="48">48 Bulan</option><option value="60">60 Bulan</option></select></div>
                            </div>
                            <div className="pt-4"><button type="submit" disabled={isLoading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition flex items-center justify-center space-x-2 disabled:bg-blue-300">{isLoading ? <><i className="fas fa-spinner fa-spin"></i><span>Menyimpan...</span></> : <><i className="fas fa-save"></i><span>Simpan Pencairan</span></>}</button></div>
                        </form>
                    </div>
                );
            };

            const DeleteButton = ({ item, onDelete }) => {
                const [confirm, setConfirm] = useState(false);
                if (confirm) {
                    return (
                        <div className="flex flex-col space-y-1"><span className="text-[10px] text-gray-500">Yakin?</span><div className="flex space-x-1"><button onClick={() => onDelete(item)} className="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs">Ya</button><button onClick={() => setConfirm(false)} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded text-xs">Batal</button></div></div>
                    );
                }
                return <button onClick={() => setConfirm(true)} className="text-red-500 hover:text-red-700 p-2"><i className="fas fa-trash"></i></button>;
            };

            const DataTable = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const [startDate, setStartDate] = useState(todayStr); 
                const [endDate, setEndDate] = useState(todayStr); 
                const [searchTerm, setSearchTerm] = useState('');

                const filteredData = data.filter(item => {
                    const matchSearch = (item.Nama && item.Nama.toLowerCase().includes(searchTerm.toLowerCase())) || ((item.NoKredit) && String(item.NoKredit).includes(searchTerm)) || (item.Petugas && item.Petugas.toLowerCase().includes(searchTerm.toLowerCase()));
                    const matchDate = item.Tanggal >= startDate && item.Tanggal <= endDate;
                    return matchSearch && matchDate;
                });

                const downloadFilteredPDF = () => {
                    if (typeof window.jspdf === 'undefined') return showToast('Library PDF belum dimuat', 'error');
                    if (filteredData.length === 0) return showToast('Tidak ada data untuk rentang tanggal ini', 'error');
                    try {
                        const doc = new window.jspdf.jsPDF('landscape');
                        doc.setFontSize(14); doc.text(`Rekap Pencairan Mikro`, 14, 15);
                        doc.setFontSize(10); doc.text(`Periode: ${startDate} s/d ${endDate}`, 14, 22);
                        
                        const tableColumn = ["Tanggal", "Nama Nasabah", "No Kredit", "Produk", "Plafon", "Tenor", "Petugas"];
                        const tableRows = filteredData.map(item => [
                            item.Tanggal || '-', item.Nama || '-', item.NoKredit || '-', item.Produk || '-',
                            formatRupiah(item.Plafon || 0), `${item.Tenor} Bln`, item.Petugas || '-'
                        ]);
                        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: [37, 99, 235] } });
                        doc.save(`Rekap_Pencairan_${startDate}_sd_${endDate}.pdf`);
                        showToast('File PDF berhasil didownload!');
                    } catch (error) { showToast('Gagal memproses PDF', 'error'); }
                };

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-6 border-b border-gray-100 space-y-4">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div><h2 className="text-xl font-bold text-gray-800">Data Pencairan</h2><p className="text-sm text-gray-500">Kelola riwayat pencairan nasabah</p></div>
                                <div className="flex gap-2">
                                    <button onClick={downloadFilteredPDF} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm flex items-center space-x-2 font-medium"><i className="fas fa-file-pdf"></i><span>Download PDF</span></button>
                                    <button onClick={syncFromSheet} disabled={isLoading} className="px-4 py-2 bg-green-50 text-green-600 border border-green-200 rounded-lg hover:bg-green-100 transition disabled:opacity-50"><i className={`fas fa-sync-alt ${isLoading ? 'fa-spin' : ''}`}></i></button>
                                </div>
                            </div>
                            <div className="flex flex-col md:flex-row gap-4 items-center bg-gray-50 p-3 rounded-lg border">
                                <div className="flex items-center space-x-2 w-full md:w-auto"><label className="text-sm font-medium text-gray-600">Dari:</label><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="p-2 border rounded-lg text-sm w-full outline-none" /></div>
                                <div className="flex items-center space-x-2 w-full md:w-auto"><label className="text-sm font-medium text-gray-600">Sampai:</label><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="p-2 border rounded-lg text-sm w-full outline-none" /></div>
                                <div className="relative w-full md:flex-1"><i className="fas fa-search absolute left-3 top-3 text-gray-400"></i><input type="text" placeholder="Cari Nama/No.Kredit/AO..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg outline-none text-sm"/></div>
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead><tr className="bg-gray-50 text-gray-600 text-sm border-b"><th className="p-4 font-medium">Tanggal</th><th className="p-4 font-medium">Nama Nasabah</th><th className="p-4 font-medium">Produk</th><th className="p-4 font-medium">Plafon</th><th className="p-4 font-medium">Tenor</th><th className="p-4 font-medium">Petugas (AO)</th><th className="p-4 font-medium text-center">Aksi</th></tr></thead>
                                <tbody>
                                    {filteredData.length > 0 ? filteredData.map((item, index) => (
                                        <tr key={index} className="border-b hover:bg-gray-50 transition text-sm">
                                            <td className="p-4 text-gray-700 whitespace-nowrap">{item.Tanggal}</td>
                                            <td className="p-4 font-medium text-gray-800 whitespace-nowrap">{item.Nama}<br/><span className="text-xs text-gray-400 font-normal">{item.NoKredit}</span></td>
                                            <td className="p-4"><span className="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-medium border border-blue-100">{item.Produk || '-'}</span></td>
                                            <td className="p-4 text-gray-800 font-semibold whitespace-nowrap">{formatRupiah(item.Plafon)}</td>
                                            <td className="p-4 text-gray-600 whitespace-nowrap">{item.Tenor} Bln</td><td className="p-4 text-gray-600 whitespace-nowrap">{item.Petugas}</td>
                                            <td className="p-4 text-center"><DeleteButton item={item} onDelete={deleteDataPencairan} /></td>
                                        </tr>
                                    )) : <tr><td colSpan="7" className="p-8 text-center text-gray-500">Belum ada data di rentang tanggal ini.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {!userRole && (
                        <div className="w-full h-screen flex bg-gray-50 absolute z-[100] top-0 left-0 overflow-hidden">
                            <div className="hidden md:flex md:w-1/2 bg-white flex-col items-center justify-center p-12 border-r border-gray-100 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10"><SvgLogo className="w-full max-w-md drop-shadow-xl hover:scale-105 transition-transform duration-700" /></div>
                            <div className="w-full md:w-1/2 flex items-center justify-center p-6 bg-gray-50 relative overflow-hidden">
                                <div className="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none"><SvgLogo className="w-[150%] h-[150%] max-w-none" /></div>
                                <div className="bg-white/95 backdrop-blur p-8 md:p-10 rounded-3xl shadow-xl w-full max-w-md text-center relative z-10 border border-gray-100">
                                    <div className="md:hidden mx-auto mb-6 flex justify-center"><SvgLogo className="h-28 w-28 drop-shadow-md" /></div>
                                    <h1 className="text-2xl font-bold text-gray-800 mb-2">Dashboard Area Medan 1</h1>
                                    <form onSubmit={processLogin} className="space-y-4 text-left mt-8">
                                        {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200"><i className="fas fa-exclamation-circle mr-2"></i> {loginError}</div>}
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Username</label><div className="relative"><i className="fas fa-user absolute left-3 top-3.5 text-gray-400"></i><input type="text" name="username" value={loginData.username} onChange={handleLoginChange} required placeholder="Masukkan Username" className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg outline-none bg-white/50" /></div></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Password</label><div className="relative"><i className="fas fa-key absolute left-3 top-3.5 text-gray-400"></i><input type="password" name="password" value={loginData.password} onChange={handleLoginChange} required placeholder="Masukkan Password" className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg outline-none bg-white/50" /></div></div>
                                        <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-semibold transition flex items-center justify-center space-x-2 mt-6 shadow-md"><i className="fas fa-sign-in-alt"></i> <span>Masuk Aplikasi</span></button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <div className="w-64 bg-white shadow-lg z-10 flex flex-col hidden md:flex">
                        <div className="p-4 border-b flex flex-col items-center text-center pt-6"><SvgLogo className="h-24 w-24 mb-3 drop-shadow-sm" /><h1 className="text-lg font-bold text-gray-800 leading-tight">Dashboard<br/>Area Medan 1</h1></div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${activeTab === 'dashboard' ? 'sidebar-active' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-chart-pie w-5"></i><span className="font-medium">Dashboard</span></button>
                            <button onClick={() => setActiveTab('form')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${activeTab === 'form' ? 'sidebar-active' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-file-invoice-dollar w-5"></i><span className="font-medium">Input Pencairan</span></button>
                            <button onClick={() => setActiveTab('lar')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${activeTab === 'lar' ? 'sidebar-active text-orange-600 border-orange-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-exclamation-circle w-5 text-orange-500"></i><span className="font-medium text-sm text-left leading-tight">Data LAR 11 sd 30 Hari</span></button>
                            <button onClick={() => setActiveTab('npl')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${activeTab === 'npl' ? 'sidebar-active text-red-600 border-red-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-exclamation-triangle w-5 text-red-500"></i><span className="font-medium text-sm text-left leading-tight">Data NPL (KOL 3 sd 5)</span></button>
                            <button onClick={() => setActiveTab('report')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${activeTab === 'report' ? 'sidebar-active text-blue-600 border-blue-600' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-chart-line w-5 text-blue-500"></i><span className="font-medium">Report Realisasi</span></button>
                            {userRole === 'admin' && (
                                <>
                                    <div className="pt-4 pb-2 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Khusus Admin</div>
                                    <button onClick={() => setActiveTab('data')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${activeTab === 'data' ? 'sidebar-active' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-table w-5"></i><span className="font-medium">Data Rekap</span></button>
                                    <button onClick={() => setActiveTab('admin')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors ${activeTab === 'admin' ? 'sidebar-active' : 'text-gray-600 hover:bg-gray-50'}`}><i className="fas fa-users-cog w-5"></i><span className="font-medium text-sm text-left">Kelola & Download</span></button>
                                </>
                            )}
                        </nav>
                        <div className="p-4 border-t"><button onClick={handleLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition font-medium"><i className="fas fa-sign-out-alt"></i> <span>Keluar</span></button></div>
                    </div>
                    
                    <div className="md:hidden fixed bottom-0 w-full bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-50 flex justify-around p-1 overflow-x-auto">
                        <button onClick={() => setActiveTab('dashboard')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-chart-pie mb-1 text-sm"></i><span className="text-[9px]">Dash</span></button>
                        <button onClick={() => setActiveTab('form')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab === 'form' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-plus mb-1 text-sm"></i><span className="text-[9px]">Input</span></button>
                        <button onClick={() => setActiveTab('lar')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab === 'lar' ? 'text-orange-600' : 'text-gray-500'}`}><i className="fas fa-exclamation-circle mb-1 text-sm"></i><span className="text-[9px]">LAR</span></button>
                        <button onClick={() => setActiveTab('npl')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab === 'npl' ? 'text-red-600' : 'text-gray-500'}`}><i className="fas fa-exclamation-triangle mb-1 text-sm"></i><span className="text-[9px]">NPL</span></button>
                        <button onClick={() => setActiveTab('report')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab === 'report' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-chart-line mb-1 text-sm"></i><span className="text-[9px]">Report</span></button>
                        {userRole === 'admin' && (
                            <>
                                <button onClick={() => setActiveTab('data')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab === 'data' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-table mb-1 text-sm"></i><span className="text-[9px]">Data</span></button>
                                <button onClick={() => setActiveTab('admin')} className={`p-2 rounded-lg flex flex-col items-center ${activeTab === 'admin' ? 'text-blue-600' : 'text-gray-500'}`}><i className="fas fa-users-cog mb-1 text-sm"></i><span className="text-[9px]">Kelola</span></button>
                            </>
                        )}
                        <button onClick={handleLogout} className="p-2 rounded-lg flex flex-col items-center text-red-500"><i className="fas fa-sign-out-alt mb-1 text-sm"></i><span className="text-[9px]">Keluar</span></button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto pb-20 md:pb-0 relative">
                        <header className="bg-white p-4 shadow-sm flex justify-between items-center md:hidden border-b sticky top-0 z-20">
                            <div className="flex items-center space-x-3"><SvgLogo className="h-10 w-10 drop-shadow-sm" /><h1 className="text-md font-bold text-gray-800 leading-tight">Area Medan 1</h1></div>
                            <div className="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full capitalize font-medium">{userRole === 'admin' ? 'Admin Mode' : 'Petugas Mode'}</div>
                        </header>
                        <main className="p-4 md:p-8">
                            {activeTab === 'dashboard' && <Dashboard />}
                            {activeTab === 'form' && <FormPencairan />}
                            {activeTab === 'lar' && <LarView />}
                            {activeTab === 'npl' && <NplView />}
                            {activeTab === 'report' && <ReportRealisasiView />}
                            {activeTab === 'data' && userRole === 'admin' && <DataTable />}
                            {activeTab === 'admin' && userRole === 'admin' && <AdminPanel />}
                        </main>
                    </div>
                    {toastMessage && (
                        <div className={`fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 text-white ${toastMessage.type === 'error' ? 'bg-red-500' : 'bg-gray-800'}`}>
                            <i className={`fas ${toastMessage.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i><span>{toastMessage.message}</span>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
