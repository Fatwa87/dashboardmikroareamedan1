<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbys8M7js_TQp_GXxfIFll4LKZV0Fmcf-bat3mmlSrmG8XdeHEsDMa4HDJmn8GGYzs1n/exec";

        const normalizeDate = (d) => {
            if (!d) return '';
            if (typeof d === 'string') {
                const s = d.trim();
                if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
                const parts = s.split(/[-/]/);
                if (parts.length === 3 && parts.every(p => !p.includes('T') && !p.includes(' ') && !p.includes(':'))) {
                    if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                    if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
            }
            const dt = new Date(d);
            if (isNaN(dt.getTime())) return '';
            const year = dt.getFullYear();
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const day = String(dt.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatRupiah = (angka) => {
            const cleanNum = Number(String(angka || 0).replace(/\D/g, '')) || 0;
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(cleanNum);
        };

        const normalizeRecord = (item, isReal = true) => {
            if (!item || typeof item !== 'object') return null;
            
            const getVal = (keys) => {
                for (let k of keys) {
                    if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== '') {
                        return String(item[k]).trim();
                    }
                }
                const itemKeys = Object.keys(item);
                for (let target of keys) {
                    const cleanTarget = target.toLowerCase().replace(/[^a-z0-9]/g, '');
                    const foundKey = itemKeys.find(ik => ik.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanTarget);
                    if (foundKey && item[foundKey] !== undefined && item[foundKey] !== null && String(item[foundKey]).trim() !== '') {
                        return String(item[foundKey]).trim();
                    }
                }
                return '';
            };

            const rawTanggal = getVal(['Tanggal', 'TGL_DATA', 'Tgl', 'Date']);
            const cleanTanggal = normalizeDate(rawTanggal) || new Date().toLocaleDateString('en-CA');
            const nama = getVal(['Nama', 'CUSTOMER_NM', 'Nama Nasabah', 'NamaNasabah']);
            const noKredit = getVal(['NoKredit', 'NO_KONTRAK', 'No_Kredit', 'NoKontrak', 'NomorKredit']);
            const cabang = getVal(['Cabang', 'CABANG', 'Nama Cabang', 'NamaCabang']);
            const outlet = getVal(['Outlet', 'OUTLET', 'Outlet Pencairan', 'Outlet Penyalur', 'Unit', 'UPC']);
            const produk = getVal(['Produk', 'SUB PRODUK', 'SubProduk', 'JenisProduk']);
            const rawPlafon = getVal(['Plafon', 'UP', 'OSL', 'Nominal', 'Plafon Pencairan', 'Estimasi']);
            const cleanPlafon = String(rawPlafon).replace(/\D/g, '') || '0';
            const tenor = getVal(['Tenor', 'TENOR', 'JangkaWaktu']);
            const petugas = getVal(['Petugas', 'AdminMikro', 'Admin Mikro', 'Nama Petugas', 'Admin']);
            const ao = getVal(['AO', 'Nama AO', 'NamaAO', 'AO Pemrakarsa', 'Pemrakarsa']);

            return {
                Tanggal: cleanTanggal,
                Nama: nama,
                NoKredit: noKredit,
                Cabang: cabang,
                Outlet: outlet,
                Produk: produk,
                Plafon: cleanPlafon,
                Tenor: tenor,
                Petugas: petugas,
                AO: ao
            };
        };

        const generatePdfReport = ({
            title = 'LAPORAN REKAPITULASI',
            subtitle = '',
            filename = 'Laporan_AreaMedan1.pdf',
            tableId = null,
            customHeaders = null,
            customBody = null,
            summaryStats = [],
            orientation = 'landscape',
            format = 'a4',
            excludeLastCol = false
        }) => {
            try {
                if (!window.jspdf || !window.jspdf.jsPDF) {
                    throw new Error("Pustaka PDF belum dimuat. Periksa koneksi internet Anda.");
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: orientation,
                    unit: 'mm',
                    format: format
                });

                const pageWidth = doc.internal.pageSize.getWidth();
                const todayStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                doc.setFillColor(15, 23, 42);
                doc.rect(12, 10, pageWidth - 24, 1.2, 'F');

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(13);
                doc.setTextColor(15, 23, 42);
                doc.text("PT. PEGADAIAN AREA MEDAN 1", 12, 17);

                doc.setFontSize(10);
                doc.setTextColor(2, 132, 199);
                doc.text(title.toUpperCase(), 12, 22);

                if (subtitle) {
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.setTextColor(100, 116, 139);
                    doc.text(subtitle, 12, 26);
                }

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7.5);
                doc.setTextColor(100, 116, 139);
                doc.text(`Dicetak: ${todayStr}`, pageWidth - 12, 17, { align: 'right' });
                doc.text(`Sistem Rekapitulasi Digital Mikro`, pageWidth - 12, 21, { align: 'right' });

                let startY = subtitle ? 30 : 27;

                if (summaryStats && summaryStats.length > 0) {
                    let badgeX = 12;
                    summaryStats.forEach((stat) => {
                        const boxW = 56;
                        const boxH = 11;
                        doc.setFillColor(248, 250, 252);
                        doc.setDrawColor(226, 232, 240);
                        doc.roundedRect(badgeX, startY, boxW, boxH, 2, 2, 'FD');

                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(6.5);
                        doc.setTextColor(100, 116, 139);
                        doc.text(stat.label.toUpperCase(), badgeX + 3, startY + 4);

                        doc.setFontSize(8.5);
                        doc.setTextColor(15, 23, 42);
                        doc.text(String(stat.value), badgeX + 3, startY + 9);

                        badgeX += boxW + 4;
                    });
                    startY += 15;
                }

                let head = customHeaders || [];
                let body = customBody || [];

                if (!customHeaders && tableId) {
                    const tableElem = document.getElementById(tableId);
                    if (!tableElem) throw new Error("Elemen tabel tidak ditemukan.");

                    head = [];
                    tableElem.querySelectorAll('thead tr').forEach(tr => {
                        const row = [];
                        const ths = tr.querySelectorAll('th');
                        ths.forEach((th, idx) => {
                            if (excludeLastCol && idx === ths.length - 1) return;
                            row.push({
                                content: th.innerText.trim(),
                                colSpan: parseInt(th.getAttribute('colspan')) || 1,
                                rowSpan: parseInt(th.getAttribute('rowspan')) || 1,
                                styles: { halign: 'center', fontStyle: 'bold' }
                            });
                        });
                        if (row.length > 0) head.push(row);
                    });

                    body = [];
                    tableElem.querySelectorAll('tbody tr').forEach(tr => {
                        const row = [];
                        const tds = tr.querySelectorAll('td');
                        if (tds.length === 1 && tds[0].getAttribute('colspan')) return;
                        tds.forEach((td, idx) => {
                            if (excludeLastCol && idx === tds.length - 1) return;
                            row.push(td.innerText.trim());
                        });
                        if (row.length > 0) body.push(row);
                    });
                }

                if (body.length === 0) {
                    body.push([{ content: 'Tidak ada data untuk ditampilkan pada laporan ini.', colSpan: head[0]?.length || 1, styles: { halign: 'center', fontStyle: 'italic', textColor: 150 } }]);
                }

                const colCount = head[0]?.length || 8;
                const isDense = colCount > 8;

                doc.autoTable({
                    head: head,
                    body: body,
                    startY: startY,
                    margin: { top: 12, bottom: 14, left: 12, right: 12 },
                    theme: 'grid',
                    tableWidth: 'auto',
                    styles: {
                        font: 'helvetica',
                        fontSize: isDense ? 6.5 : 8,
                        cellPadding: isDense ? 1.4 : 2.2,
                        textColor: [30, 41, 59],
                        lineColor: [203, 213, 225],
                        lineWidth: 0.15,
                        valign: 'middle',
                        overflow: 'linebreak'
                    },
                    headStyles: {
                        fillColor: [15, 23, 42],
                        textColor: [255, 255, 255],
                        fontStyle: 'bold',
                        halign: 'center',
                        lineWidth: 0.2,
                        lineColor: [15, 23, 42]
                    },
                    alternateRowStyles: {
                        fillColor: [248, 250, 252]
                    },
                    didDrawPage: (data) => {
                        const totalPages = doc.internal.getNumberOfPages();
                        const pageCurrent = data.pageNumber;
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(7);
                        doc.setTextColor(148, 163, 184);
                        doc.text(
                            `Dokumen Resmi PT. Pegadaian Area Medan 1  •  Halaman ${pageCurrent} dari ${totalPages}`,
                            pageWidth / 2,
                            doc.internal.pageSize.getHeight() - 6,
                            { align: 'center' }
                        );
                    }
                });

                doc.save(filename);
                return true;
            } catch (err) {
                console.error("Gagal cetak PDF:", err);
                return false;
            }
        };

        const RocketLogo = ({ size = 64, className = "" }) => {
            const [imgIdx, setImgIdx] = useState(0);
            const candidateSources = [
                "logo.jpeg",
                "logo.jpg",
                "logo.png",
                "WhatsApp Image 2026-09-08 at 13.35.21.jpeg"
            ];

            if (imgIdx < candidateSources.length) {
                return (
                    <img 
                        src={candidateSources[imgIdx]} 
                        alt="Area Medan 1 Juara" 
                        style={{ width: size, height: size }} 
                        className={`object-contain select-none rounded-full ${className}`}
                        onError={() => setImgIdx(prev => prev + 1)}
                    />
                );
            }

            return (
                <div style={{ width: size, height: size }} className={`relative flex items-center justify-center select-none ${className}`}>
                    <svg viewBox="0 0 300 300" className="w-full h-full drop-shadow-md" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="150" cy="150" r="140" fill="#ffffff" />
                        <path d="M 52 96 A 114 114 0 0 1 230 230" fill="none" stroke="#f97316" strokeWidth="15" strokeLinecap="round" />
                        <path d="M 230 230 A 114 114 0 0 1 52 96" fill="none" stroke="#0c1e35" strokeWidth="15" strokeLinecap="round" />

                        <path d="M 92 160 L 42 222 L 66 184 L 34 234 L 82 182 Z" fill="#ffaa00" />

                        <ellipse cx="94" cy="148" rx="8" ry="4.5" transform="rotate(-48 94 148)" fill="#0c1e35" stroke="#ffffff" strokeWidth="1.5" />
                        <ellipse cx="106" cy="160" rx="8" ry="4.5" transform="rotate(-48 106 160)" fill="#0c1e35" stroke="#ffffff" strokeWidth="1.5" />
                        <path d="M 125 118 L 88 128 L 102 150 Z" fill="#0c1e35" />
                        <path d="M 148 142 L 138 178 L 118 162 Z" fill="#0c1e35" />
                        <path d="M 98 152 C 112 110, 150 68, 204 50 C 206 58, 202 72, 186 96 C 160 134, 126 164, 108 164 Z" fill="#ffffff" stroke="#0c1e35" strokeWidth="5.5" strokeLinejoin="round" />
                        <path d="M 142 120 C 164 92, 192 65, 204 50 C 196 68, 178 110, 142 144 C 122 160, 110 164, 108 164 C 118 156, 130 138, 142 120 Z" fill="#f97316" />
                        <circle cx="174" cy="78" r="9" fill="#f97316" stroke="#0c1e35" strokeWidth="3.5" />
                        <circle cx="174" cy="78" r="4.5" fill="#0c1e35" />
                        <circle cx="172" cy="76" r="1.5" fill="#ffffff" />
                        <polygon points="110,235 152,158 252,112 268,186 238,245 138,244" fill="#0c1e35" />
                        <g transform="rotate(-15 185 195)">
                            <text x="126" y="162" fill="#ffffff" fontFamily="Inter, sans-serif, Arial" fontWeight="900" fontStyle="italic" fontSize="21" letterSpacing="0.5">AREA</text>
                            <text x="122" y="184" fill="#ffffff" fontFamily="Inter, sans-serif, Arial" fontWeight="900" fontStyle="italic" fontSize="21" letterSpacing="0.5">MEDAN</text>
                            <text x="124" y="206" fill="#ffffff" fontFamily="Inter, sans-serif, Arial" fontWeight="900" fontStyle="italic" fontSize="20" letterSpacing="0.8">JUARA</text>
                            <text x="210" y="196" fill="#f97316" stroke="#0c1e35" strokeWidth="2.5" fontFamily="Inter, sans-serif, Arial" fontWeight="900" fontStyle="italic" fontSize="62">1</text>
                        </g>
                    </svg>
                </div>
            );
        };

        const App = () => {
            const [userRole, setUserRole] = useState(localStorage.getItem('userRole'));
            const [activeTab, setActiveTab] = useState('dashReal');
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [isLoading, setIsLoading] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            
            const [confirmModal, setConfirmModal] = useState({ open: false, title: '', message: '', onConfirm: null });
            const [dbModal, setDbModal] = useState(false);
            const [cloudStatus, setCloudStatus] = useState('unknown'); // 'connected', 'error', 'connecting'

            const [sheetUrl, setSheetUrl] = useState(() => localStorage.getItem('customSheetUrl') || DEFAULT_SHEET_URL);

            const [dataPencairan, setDataPencairan] = useState(() => {
                try {
                    const local = localStorage.getItem('dataPencairan');
                    return local ? JSON.parse(local) : [];
                } catch(e) { return []; }
            });
            const [dataEstimasi, setDataEstimasi] = useState(() => {
                try {
                    const local = localStorage.getItem('dataEstimasi');
                    return local ? JSON.parse(local) : [];
                } catch(e) { return []; }
            });

            const [kol1Data, setKol1Data] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kol1Data')) || []; } catch(e) { return []; }
            });
            const [larData, setLarData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('larData')) || []; } catch(e) { return []; }
            });
            const [nplData, setNplData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('nplData')) || []; } catch(e) { return []; }
            });
            const [klaimData, setKlaimData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('klaimData')) || []; } catch(e) { return []; }
            });
            const [reportData, setReportData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('reportData')) || []; } catch(e) { return []; }
            });
            
            const [aoList, setAoList] = useState(JSON.parse(localStorage.getItem('aoList')) || ['AO MEDAN', 'AO BINJAI', 'AO TEBING']);
            const [adminList, setAdminList] = useState(JSON.parse(localStorage.getItem('adminList')) || ['ADMIN MIKRO 1', 'ADMIN MIKRO 2']);
            const [productList, setProductList] = useState(JSON.parse(localStorage.getItem('productList')) || ['KREASI BARU', 'KREASI FLEKSI', 'KUR MIKRO']);
            const [cabangList, setCabangList] = useState(JSON.parse(localStorage.getItem('cabangList')) || ['MEDAN UTAMA', 'MEDAN PETISAH', 'BINJAI']);
            
            const defaultUsers = [
                { username: 'admin', password: 'Area@123!!', role: 'admin' },
                { username: 'Mikro', password: 'Mikro@123!', role: 'ao' }
            ];
            const [appUsers, setAppUsers] = useState(JSON.parse(localStorage.getItem('appUsers')) || defaultUsers);

            useEffect(() => {
                const currentUsers = JSON.parse(localStorage.getItem('appUsers')) || [];
                const hasMasterAdmin = currentUsers.some(u => u.username && u.username.toLowerCase() === 'admin' && u.password === 'Area@123!');
                const hasMasterAo = currentUsers.some(u => u.username && u.username.toLowerCase() === 'mikro' && u.password === 'Mikro@123!');
                if (!hasMasterAdmin || !hasMasterAo) {
                    const cleanUsers = currentUsers.filter(u => u.username && u.username.toLowerCase() !== 'admin' && u.username.toLowerCase() !== 'mikro');
                    const mergedUsers = [...defaultUsers, ...cleanUsers];
                    setAppUsers(mergedUsers);
                    localStorage.setItem('appUsers', JSON.stringify(mergedUsers));
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
            };

            const syncFromSheet = async (customUrl = null, showNotification = true) => {
                const targetBaseUrl = (customUrl || sheetUrl || DEFAULT_SHEET_URL).trim();
                if (!targetBaseUrl) {
                    if (showNotification) showToast('URL Google Sheet belum ditentukan', 'error');
                    setCloudStatus('error');
                    return false;
                }
                
                // Tambahkan parameter anti-cache agar browser HP selalu mengambil data terbaru dari server
                const separator = targetBaseUrl.includes('?') ? '&' : '?';
                const fetchUrl = `${targetBaseUrl}${separator}t=${Date.now()}`;

                setIsLoading(true);
                setCloudStatus('connecting');
                try {
                    const response = await fetch(fetchUrl);
                    if (response.ok) {
                        const result = await response.json();

                        if (result.error) {
                            throw new Error(`Google Apps Script Error: ${result.error}`);
                        }
                        
                        if (result.pencairan && Array.isArray(result.pencairan)) {
                            const cleaned = result.pencairan.map(it => normalizeRecord(it, true)).filter(Boolean);
                            setDataPencairan(cleaned);
                            localStorage.setItem('dataPencairan', JSON.stringify(cleaned));
                        }
                        
                        if (result.estimasi && Array.isArray(result.estimasi)) {
                            const cleaned = result.estimasi.map(it => normalizeRecord(it, false)).filter(Boolean);
                            setDataEstimasi(cleaned);
                            localStorage.setItem('dataEstimasi', JSON.stringify(cleaned));
                        }

                        if (result.kol1 && Array.isArray(result.kol1)) { 
                            setKol1Data(result.kol1); 
                            localStorage.setItem('kol1Data', JSON.stringify(result.kol1)); 
                        }
                        if (result.lar && Array.isArray(result.lar)) { 
                            setLarData(result.lar); 
                            localStorage.setItem('larData', JSON.stringify(result.lar)); 
                        }
                        if (result.npl && Array.isArray(result.npl)) { 
                            setNplData(result.npl); 
                            localStorage.setItem('nplData', JSON.stringify(result.npl)); 
                        }
                        
                        // SINKRONISASI KLAIM SECARA LENGKAP & REAKTIF
                        let klaimCount = 0;
                        if (result.klaim && Array.isArray(result.klaim)) { 
                            setKlaimData(result.klaim); 
                            localStorage.setItem('klaimData', JSON.stringify(result.klaim)); 
                            klaimCount = result.klaim.length;
                        }
                        
                        if (result.report && Array.isArray(result.report)) { 
                            setReportData(result.report); 
                            localStorage.setItem('reportData', JSON.stringify(result.report)); 
                        }
                        
                        if (result.master && Array.isArray(result.master) && result.master.length > 0) {
                            const ao = [], prod = [], adm = [], cab = [];
                            result.master.forEach(item => {
                                if (item.AO && String(item.AO).trim() !== '') ao.push(String(item.AO).trim());
                                if (item.Produk && String(item.Produk).trim() !== '') prod.push(String(item.Produk).trim());
                                if (item.AdminMikro && String(item.AdminMikro).trim() !== '') adm.push(String(item.AdminMikro).trim());
                                if (item.Cabang && String(item.Cabang).trim() !== '') cab.push(String(item.Cabang).trim());
                            });
                            const uniqueAo = [...new Set(ao)];
                            const uniqueProd = [...new Set(prod)];
                            const uniqueAdm = [...new Set(adm)];
                            const uniqueCab = [...new Set(cab)];
                            
                            if (uniqueAo.length > 0) { setAoList(uniqueAo); localStorage.setItem('aoList', JSON.stringify(uniqueAo)); }
                            if (uniqueProd.length > 0) { setProductList(uniqueProd); localStorage.setItem('productList', JSON.stringify(uniqueProd)); }
                            if (uniqueAdm.length > 0) { setAdminList(uniqueAdm); localStorage.setItem('adminList', JSON.stringify(uniqueAdm)); }
                            if (uniqueCab.length > 0) { setCabangList(uniqueCab); localStorage.setItem('cabangList', JSON.stringify(uniqueCab)); }
                        }
                        
                        if (result.users && Array.isArray(result.users) && result.users.length > 0) {
                            const mappedUsers = result.users.map(u => ({
                                username: u.Username || u.username,
                                password: u.Password || u.password,
                                role: u.Role || u.role
                            })).filter(u => u.username);

                            const cleanUsers = mappedUsers.filter(u => u.username && u.username.toLowerCase() !== 'admin' && u.username.toLowerCase() !== 'mikro');
                            const finalUsers = [...defaultUsers, ...cleanUsers];
                            
                            setAppUsers(finalUsers);
                            localStorage.setItem('appUsers', JSON.stringify(finalUsers));
                        }
                        
                        setCloudStatus('connected');
                        if (showNotification) {
                            if (result.klaim === undefined) {
                                showToast('Tersambung, namun server Google belum mengirim data KLAIM. Wajib Deploy Versi Baru di Apps Script!', 'error');
                            } else {

                                    <div>
                                        <h4 className="text-sm font-bold text-emerald-900">

                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className={`p-6 rounded-3xl shadow-sm border flex items-center space-x-4 ${isReal ? 'bg-blue-50/50 border-blue-100' : 'bg-purple-50/50 border-purple-100'}`}>
                                <div className={`p-4 rounded-2xl ${isReal ? 'bg-blue-600 text-white' : 'bg-purple-600 text-white'}`}><i className="fas fa-users text-2xl"></i></div>
                                <div><p className="text-xs font-bold uppercase tracking-wider text-slate-500">Total Nasabah {isReal ? 'Realisasi' : 'Estimasi'}</p><h3 className="text-3xl font-black text-slate-800">{filteredData.length}</h3></div>
                            </div>
                            <div className={`p-6 rounded-3xl shadow-sm border flex items-center space-x-4 ${isReal ? 'bg-emerald-50/50 border-emerald-100' : 'bg-amber-50/50 border-amber-100'}`}>
                                <div className={`p-4 rounded-2xl ${isReal ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'}`}><i className="fas fa-money-bill-wave text-2xl"></i></div>
                                <div><p className="text-xs font-bold uppercase tracking-wider text-slate-500">Total Nominal {isReal ? 'Realisasi' : 'Estimasi'}</p><h3 className="text-2xl md:text-3xl font-black text-slate-800">{formatRupiah(totalPlafon)}</h3></div>
                            </div>
                        </div>

                        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200">
                            <h3 className="text-lg font-bold text-slate-800 mb-6">Sebaran Nominal Berdasarkan Produk</h3>
                            <div className="space-y-5">
                                {Object.entries(groupedByProduct).map(([produk, total], idx) => {
                                    const percentage = totalPlafon === 0 ? 0 : (total / totalPlafon) * 100;
                                    return (
                                        <div key={idx}>
                                            <div className="flex justify-between text-sm mb-2"><span className="font-semibold text-slate-700">{produk || 'Lainnya'}</span><span className="font-extrabold text-slate-900">{formatRupiah(total)}</span></div>
                                            <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden"><div className={`${isReal ? 'bg-blue-600' : 'bg-purple-600'} h-3 rounded-full transition-all duration-500`} style={{ width: `${percentage}%` }}></div></div>
                                        </div>
                                    );
                                })}
                                {Object.keys(groupedByProduct).length === 0 && <p className="text-sm text-slate-400 text-center py-6">Belum ada data transaksi untuk periode ini.</p>}
                            </div>
                        </div>
                    </div>
                );
            };

            const DataRekap = ({ type }) => {
                const isReal = type === 'realisasi';
                const [data, setData] = useState(isReal ? dataPencairan : dataEstimasi);
                const [searchTerm, setSearchTerm] = useState('');
                const [startDate, setStartDate] = useState('');
                const [endDate, setEndDate] = useState('');
                
                useEffect(() => { setData(isReal ? dataPencairan : dataEstimasi); }, [dataPencairan, dataEstimasi, isReal]);

                const handleDelete = (item) => {
                    setConfirmModal({
                        open: true,
                        title: `Hapus Data ${item.Nama}`,
                        message: `Apakah Anda yakin ingin menghapus data nasabah ${item.Nama}? Data yang dihapus tidak dapat dipulihkan.`,
                        onConfirm: async () => {
                            setIsLoading(true);
                            const newData = data.filter(d => isReal ? (d.NoKredit !== item.NoKredit) : (d.Nama !== item.Nama || d.Produk !== item.Produk));
                            if (isReal) {
                                setDataPencairan(newData);
                                localStorage.setItem('dataPencairan', JSON.stringify(newData));
                            } else {
                                setDataEstimasi(newData);
                                localStorage.setItem('dataEstimasi', JSON.stringify(newData));
                            }
                            setData(newData);

                            const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                            if (targetUrl) {
                                try {
                                    await fetch(targetUrl, {
                                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                        body: JSON.stringify({ action: isReal ? 'delete_pencairan' : 'delete_estimasi', NoKredit: item.NoKredit, Nama: item.Nama, Produk: item.Produk })
                                    });
                                    showToast('Data berhasil dihapus dari Cloud!');
                                } catch (e) { showToast('Gagal hapus di Cloud Database', 'error'); }
                            }
                            setIsLoading(false);
                            setConfirmModal({ open: false, title: '', message: '', onConfirm: null });
                        }
                    });
                };

                const filtered = data.filter(item => {
                    const term = searchTerm.toLowerCase();
                    const matchSearch = 
                        (item.Nama && item.Nama.toLowerCase().includes(term)) || 
                        (isReal && item.NoKredit && String(item.NoKredit).toLowerCase().includes(term)) ||
                        (item.Cabang && item.Cabang.toLowerCase().includes(term)) ||
                        (item.Outlet && item.Outlet.toLowerCase().includes(term)) ||
                        (item.Produk && item.Produk.toLowerCase().includes(term)) ||
                        (item.Petugas && item.Petugas.toLowerCase().includes(term)) ||
                        (item.AO && item.AO.toLowerCase().includes(term));

                    let matchDate = true;
                    if (startDate || endDate) {
                        const itemDateStr = normalizeDate(item.Tanggal);
                        if (startDate && itemDateStr < startDate) matchDate = false;
                        if (endDate && itemDateStr > endDate) matchDate = false;
                    }
                    return matchSearch && matchDate;
                });

                const totalFilteredPlafon = filtered.reduce((sum, item) => sum + (Number(String(item.Plafon || 0).replace(/\D/g, '')) || 0), 0);

                const downloadPDF = () => {
                    setIsLoading(true);
                    const success = generatePdfReport({
                        title: `REKAPITULASI ${isReal ? 'REALISASI' : 'ESTIMASI'} PENCAIRAN`,
                        subtitle: `Periode: ${startDate || 'Awal'} s/d ${endDate || 'Kini'} | Pencarian: "${searchTerm || 'Semua'}"`,
                        filename: `Rekap_${isReal ? 'Realisasi' : 'Estimasi'}_AreaMedan1_${new Date().toISOString().split('T')[0]}.pdf`,
                        tableId: `table-rekap-${type}`,
                        summaryStats: [
                            { label: 'Total Nasabah', value: `${filtered.length} Nasabah` },
                            { label: 'Total Nominal Plafon', value: formatRupiah(totalFilteredPlafon) }
                        ],
                        orientation: 'landscape',
                        format: 'a4',
                        excludeLastCol: true
                    });
                    setIsLoading(false);
                    if (success) showToast('PDF berhasil diunduh tanpa terpotong!');
                    else showToast('Gagal memproses dokumen PDF', 'error');

                const resetDateFilter = () => { setStartDate(''); setEndDate(''); };

                                    <p className="text-sm text-slate-500 mt-1">
                                        Menampilkan <span className="font-bold text-slate-800">{filtered.length} Data</span> | Total: <span className="font-bold text-emerald-600">{formatRupiah(totalFilteredPlafon)}</span>
                                    </p>
                                </div>
                                <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                                    <button onClick={downloadPDF} className="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition flex items-center shadow-sm">
                                        <i className="fas fa-file-pdf mr-2 text-base"></i> Cetak PDF
                                    </button>
                                </div>
                            </div>

                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><i className="fas fa-search"></i></div>
                                    <input type="text" placeholder="Cari nasabah, cabang, outlet, AO..." value={searchTerm} onChange={(e)=>setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-600 focus:bg-white text-sm font-medium" />
                                </div>
                                
                                <div className="md:col-span-3">
                                    <div className="flex items-center space-x-2">
                                        <span className="text-xs font-bold text-slate-500 whitespace-nowrap">Dari:</span>
                                        <input type="date" value={startDate} onChange={(e)=>setStartDate(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-2xl outline-none text-xs font-medium focus:bg-white" />
                                    </div>
                                </div>

                                <div className="md:col-span-3">
                                    <div className="flex items-center space-x-2">
                                        <span className="text-xs font-bold text-slate-500 whitespace-nowrap">S/d:</span>
                                        <input type="date" value={endDate} onChange={(e)=>setEndDate(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-2xl outline-none text-xs font-medium focus:bg-white" />
                                    </div>
                                </div>

                                {(startDate || endDate) && (
                                    <div className="md:col-span-1 flex items-center">
                                        <button onClick={resetDateFilter} title="Reset Filter Tanggal" className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-xs font-bold transition flex items-center justify-center">
                                            <i className="fas fa-times mr-1"></i> Reset
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                <div>
                                    <h3 className="font-bold text-slate-800 text-lg">Daftar Rekapitulasi {isReal ? 'Realisasi' : 'Estimasi'}</h3>
                                    <p className="text-xs text-slate-500">PT. Pegadaian Area Medan 1</p>
                                </div>
                                <span className="text-xs font-extrabold px-3 py-1.5 bg-blue-100 text-blue-700 rounded-xl">
                                    Total: {formatRupiah(totalFilteredPlafon)}
                                </span>
                            </div>

                            <div className="overflow-x-auto">
                                <table id={`table-rekap-${type}`} className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                                            <th className="p-3.5 font-bold">Tanggal</th>
                                            <th className="p-3.5 font-bold">Cabang</th>
                                            <th className="p-3.5 font-bold">{isReal ? 'Outlet Pencairan' : 'Outlet Penyalur'}</th>
                                            <th className="p-3.5 font-bold">Nama Nasabah</th>
                                            {isReal && <th className="p-3.5 font-bold">No. Kredit</th>}
                                            <th className="p-3.5 font-bold">Produk</th>
                                            <th className="p-3.5 font-bold">Plafon</th>
                                            {isReal && <th className="p-3.5 font-bold text-center">Tenor</th>}
                                            <th className="p-3.5 font-bold">{isReal ? 'Admin Mikro' : 'Petugas / AO'}</th>
                                            {isReal && <th className="p-3.5 font-bold">AO Pemrakarsa</th>}
                                            <th className="p-3.5 font-bold text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filtered.map((item, idx) => (
                                            <tr key={idx} className="hover:bg-slate-50 text-sm">
                                                <td className="p-3.5 text-slate-600 whitespace-nowrap">{new Date(item.Tanggal).toLocaleDateString('id-ID')}</td>
                                                <td className="p-3.5 font-semibold text-slate-700 whitespace-nowrap">{item.Cabang || '-'}</td>
                                                <td className="p-3.5 font-semibold text-blue-800 whitespace-nowrap">
                                                    <span className="inline-flex items-center px-2 py-0.5 rounded-lg bg-blue-50 text-blue-700 border border-blue-100 text-xs font-bold">
                                                        <i className="fas fa-store mr-1 text-[10px]"></i>{item.Outlet || '-'}
                                                    </span>
                                                </td>
                                                <td className="p-3.5 font-bold text-slate-900">{item.Nama}</td>
                                                {isReal && <td className="p-3.5 text-slate-600 font-mono text-xs">{item.NoKredit}</td>}
                                                <td className="p-3.5 text-slate-600">{item.Produk}</td>
                                                <td className="p-3.5 font-extrabold text-emerald-700">{formatRupiah(item.Plafon)}</td>
                                                {isReal && <td className="p-3.5 text-center text-slate-600">{item.Tenor ? `${item.Tenor} bln` : '-'}</td>}
                                                <td className="p-3.5 text-slate-600">{item.Petugas || '-'}</td>
                                                {isReal && (
                                                    <td className="p-3.5 font-bold text-purple-700 whitespace-nowrap">
                                                        <span className="inline-flex items-center px-2 py-0.5 rounded-lg bg-purple-50 text-purple-700 border border-purple-100 text-xs font-bold">
                                                            <i className="fas fa-user-tie mr-1 text-[10px]"></i>{item.AO || '-'}
                                                        </span>
                                                    </td>
                                                )}
                                                <td className="p-3.5 text-center">
                                                    <button onClick={() => handleDelete(item)} className="text-red-500 hover:text-red-700 p-2 rounded-xl hover:bg-red-50 transition" title="Hapus Data"><i className="fas fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                        {filtered.length === 0 && <tr><td colSpan={isReal ? 11 : 8} className="p-8 text-center text-slate-400">Belum ada data pada filter yang dipilih.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            const TableNasabahView = ({ title, data, type, icon }) => {
                const [selectedCabang, setSelectedCabang] = useState('Semua');
                const [selectedOutlet, setSelectedOutlet] = useState('Semua');
                const [searchTerm, setSearchTerm] = useState('');
                
                useEffect(() => { setSelectedOutlet('Semua'); }, [selectedCabang]);
                
                const getCabangVal = (item) => String(item.CABANG || item.Cabang || item.NamaCabang || '').trim();
                const getOutletVal = (item) => String(item.OUTLET || item.Outlet || '').trim();

                const cabangListFilter = ['Semua', ...new Set(data.map(getCabangVal).filter(Boolean))];
                const availableOutlets = data.filter(item => selectedCabang === 'Semua' || getCabangVal(item).toLowerCase() === selectedCabang.toLowerCase()).map(getOutletVal).filter(Boolean);
                const outletList = ['Semua', ...new Set(availableOutlets)];

                const filteredData = data.filter(item => {
                    const cVal = getCabangVal(item);
                    const oVal = getOutletVal(item);
                    const matchCabang = selectedCabang === 'Semua' || cVal.toLowerCase() === selectedCabang.toLowerCase();
                    const matchOutlet = selectedOutlet === 'Semua' || oVal.toLowerCase() === selectedOutlet.toLowerCase();
                    
                    let matchSearch = true;
                    if (searchTerm.trim()) {
                        const term = searchTerm.toLowerCase();
                        const namaCust = String(item.CUSTOMER_NM || item.Nama || item.NamaNasabah || '').toLowerCase();
                        const noKontrak = String(item.NO_KONTRAK || item.NoKontrak || '').toLowerCase();
                        const tindakLanjut = String(item['TINDAK LANJUT KLAIM'] || item.TINDAK_LANJUT_KLAIM || item.TindakLanjut || '').toLowerCase();
                        
                        matchSearch = namaCust.includes(term) || noKontrak.includes(term) || (type === 'klaim' && tindakLanjut.includes(term));
                    }
                    return matchCabang && matchOutlet && matchSearch;
                });
                
                const totalOut = filteredData.reduce((sum, item) => sum + (Number(String(item.UP || item.OSL || item.Plafon || 0).replace(/\D/g, '')) || 0), 0);

                const colorConfig = {
                    kol1: { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-900', iconBg: 'bg-amber-200', iconText: 'text-amber-800', badge: 'bg-amber-500' },
                    lar: { bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-900', iconBg: 'bg-orange-200', iconText: 'text-orange-800', badge: 'bg-orange-500' },
                    npl: { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-900', iconBg: 'bg-red-200', iconText: 'text-red-800', badge: 'bg-red-600' },
                    klaim: { bg: 'bg-teal-50', border: 'border-teal-200', text: 'text-teal-900', iconBg: 'bg-teal-200', iconText: 'text-teal-800', badge: 'bg-teal-600' }
                };
                const conf = colorConfig[type] || colorConfig.lar;

                const downloadPDF = () => {
                    setIsLoading(true);
                    const success = generatePdfReport({
                        title: `DATA PEMANTAUAN ${title.toUpperCase()}`,
                        subtitle: `Cabang: ${selectedCabang} | Outlet: ${selectedOutlet}`,
                        filename: `Data_${title.replace(/[^a-zA-Z0-9]/g, '_')}_AreaMedan1.pdf`,
                        tableId: `table-nasabah-${type}`,
                        summaryStats: [
                            { label: `Total Nasabah ${title}`, value: `${filteredData.length} Nasabah` },
                            { label: `Total Outstanding`, value: formatRupiah(totalOut) }
                        ],
                        orientation: 'landscape',
                        format: 'legal',
                        excludeLastCol: false
                    });
                    setIsLoading(false);
                    if (success) showToast('PDF berhasil diunduh tanpa terpotong!');
                    else showToast('Gagal memproses dokumen PDF', 'error');
                };

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-slate-200 pb-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Pemantauan Khusus {title}</h2>
                                <p className="text-sm text-slate-500">Data hasil upload dokumen CSV terbaru Admin</p>
                            </div>
                            <div className="flex flex-col sm:flex-row items-start sm:items-center space-y-3 sm:space-y-0 sm:space-x-4 w-full lg:w-auto">
                                <button 
                                    onClick={() => syncFromSheet(null, true)} 
                                    className="w-full sm:w-auto px-4 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-2xl text-xs font-bold transition flex items-center justify-center shadow-sm"
                                    title="Tarik Data Terbaru dari Cloud Google Sheet"
                                >
                                    <i className="fas fa-cloud-download-alt mr-2 text-blue-600 text-sm"></i> Tarik Cloud
                                </button>
                                <div className="flex items-center space-x-2 w-full sm:w-auto">
                                    <label className="text-xs font-bold text-slate-500 whitespace-nowrap">Cabang:</label>
                                    <select value={selectedCabang} onChange={(e) => setSelectedCabang(e.target.value)} className="w-full sm:w-40 p-2.5 border border-slate-200 rounded-2xl bg-white text-sm outline-none font-medium">
                                        {cabangListFilter.map((cabang, idx) => <option key={idx} value={cabang}>{cabang}</option>)}
                                    </select>
                                </div>
                                <div className="flex items-center space-x-2 w-full sm:w-auto">
                                    <label className="text-xs font-bold text-slate-500 whitespace-nowrap">Outlet:</label>
                                    <select value={selectedOutlet} onChange={(e) => setSelectedOutlet(e.target.value)} className="w-full sm:w-40 p-2.5 border border-slate-200 rounded-2xl bg-white text-sm outline-none font-medium">
                                        {outletList.map((outlet, idx) => <option key={idx} value={outlet}>{outlet}</option>)}
                                    </select>
                                </div>
                                <button onClick={downloadPDF} className={`w-full sm:w-auto px-5 py-2.5 ${conf.badge} text-white rounded-2xl hover:opacity-90 transition flex items-center justify-center font-bold text-sm shadow-sm`}>
                                    <i className="fas fa-file-pdf mr-2"></i> Cetak PDF
                                </button>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center">
                            <i className="fas fa-search text-slate-400 ml-2 mr-3 text-sm"></i>
                            <input 
                                type="text" 
                                value={searchTerm} 
                                onChange={(e) => setSearchTerm(e.target.value)}
                                placeholder="Cari berdasarkan nama nasabah, no kontrak, atau status tindak lanjut..."
                                className="w-full text-xs md:text-sm outline-none bg-transparent font-medium text-slate-800 placeholder:text-slate-400"
                            />
                            {searchTerm && (
                                <button onClick={() => setSearchTerm('')} className="text-slate-400 hover:text-slate-600 px-2 text-xs">
                                    <i className="fas fa-times"></i>
                                </button>
                            )}
                        </div>

                        {data.length === 0 ? (
                            <div className={`${conf.bg} ${conf.text} p-10 text-center rounded-3xl border ${conf.border} flex flex-col items-center justify-center`}>
                                <div className={`w-16 h-16 ${conf.iconBg} ${conf.iconText} rounded-3xl flex items-center justify-center text-3xl mb-4 shadow-sm`}>
                                    <i className={`fas ${icon}`}></i>
                                </div>
                                <h3 className="text-xl font-bold">Belum Ada Data {title} di Perangkat Ini</h3>
                                <p className="text-sm mt-1.5 opacity-80 max-w-md">

                                </p>
                                <button 
                                    onClick={() => syncFromSheet(null, true)}
                                    className="mt-5 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-600/30 transition flex items-center"
                                >
                                    <i className="fas fa-sync-alt mr-2.5"></i> Tarik Data dari Cloud Sekarang
                                </button>
                            </div>
                        ) : (
                            <div>

                };

                const processMasterCSVUpload = (e, type) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, "");
                            const lines = csv.split(/\r\n|\n/).map(line => line.trim().replace(/["']/g, "")).filter(line => line.length > 0);
                            if (lines.length > 0 && ['AO', 'NAMA', 'NAMA AO', 'NAMA_AO', 'ADMIN', 'ADMIN MIKRO', 'ADMIN_MIKRO', 'PRODUK', 'NAMA PRODUK', 'NAMA_PRODUK', 'CABANG', 'NAMA CABANG', 'NAMA_CABANG'].includes(lines[0].toUpperCase())) {
                                lines.shift(); 
                            }
                            if (lines.length === 0) throw new Error("File CSV kosong atau format tidak valid.");

                            if (type === 'CABANG') {
                                const cleanCabang = lines.map(l => l.toUpperCase());
                                const updated = [...new Set([...cabangList, ...cleanCabang])];
                                setCabangList(updated); localStorage.setItem('cabangList', JSON.stringify(updated));
                                syncMasterToSheet(aoList, productList, adminList, updated);
                            } else if (type === 'AO') {
                                const cleanAo = lines.map(l => l.toUpperCase());
                                const updated = [...new Set([...aoList, ...cleanAo])];
                                setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated));
                                syncMasterToSheet(updated, productList, adminList, cabangList);
                            } else if (type === 'ADMIN') {
                                const cleanAdmin = lines.map(l => l.toUpperCase());
                                const updated = [...new Set([...adminList, ...cleanAdmin])];
                                setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated));
                                syncMasterToSheet(aoList, productList, updated, cabangList);
                            } else if (type === 'PRODUK') {
                                const cleanProd = lines.map(l => l.toUpperCase());
                                const updated = [...new Set([...productList, ...cleanProd])];
                                setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated));
                                syncMasterToSheet(aoList, updated, adminList, cabangList);
                            }
                            showToast(`Berhasil menambahkan ${lines.length} data baru ke daftar ${type}!`);
                        } catch (error) { showToast(`Gagal Upload CSV ${type}: ${error.message}`, 'error'); }
                        e.target.value = null;
                    };
                    reader.readAsText(file);
                };

                const processCSVUpload = (e, type) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    setIsLoading(true);
                    
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const csv = event.target.result.replace(/^\uFEFF/, "");
                            const lines = csv.split(/\r\n|\n/).filter(line => line.trim().length > 0);
                            if (lines.length < 2) throw new Error("Data kosong atau format tidak valid");
                            
                            let delimiter = ',';
                            if (lines[0].includes(';')) delimiter = ';';
                            else if (lines[0].includes('\t')) delimiter = '\t';
                            
                            const parseLine = (line) => {
                                const result = [];
                                let start = 0; let inQuotes = false;
                                for (let i = 0; i < line.length; i++) {
                                    if (line[i] === '"') inQuotes = !inQuotes;
                                    else if (line[i] === delimiter && !inQuotes) {
                                        result.push(line.substring(start, i).replace(/^"|"$/g, '').trim());
                                        start = i + 1;
                                    }
                                }
                                result.push(line.substring(start).replace(/^"|"$/g, '').trim());
                                return result;
                            };

                            const headers = parseLine(lines[0].toUpperCase());
                            
                            const reqKOL1 = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];
                            const reqLARNPL = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'UP', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];
                            const reqREPORT = ['NAMA_CABANG', 'TARGET_OSL', 'REALISASI_OSL', 'PENCAPAIAN_OSL', 'TARGET_NPL', 'REALISASI_NPL', 'PENCAPAIAN_NPL', 'TARGET_LAR', 'REALISASI_LAR', 'PENCAPAIAN_LAR', 'TARGET_RATA2', 'REALISASI_RATA2', 'PENCAPAIAN_RATA2', 'TARGET_NOA', 'REALISASI_NOA', 'PENCAPAIAN_NOA'];
                            const reqKLAIM = ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG', 'TINDAK LANJUT KLAIM'];
                            
                            let reqHeaders = type === 'REPORT' ? reqREPORT : (type === 'KOL1' ? reqKOL1 : (type === 'KLAIM' ? reqKLAIM : reqLARNPL));

                            const cleanHeaderMap = {};
                            headers.forEach((h, idx) => {
                                const cleanKey = h.replace(/[^A-Z0-9]/g, '');
                                if (cleanKey) cleanHeaderMap[cleanKey] = idx;
                            });

                            const dataArray = [];
                            const sheetData = [reqHeaders];

                            for (let i = 1; i < lines.length; i++) {
                                const currentline = parseLine(lines[i]);
                                if (currentline.length < 3) continue;
                                const obj = {}; const rowData = [];
                                reqHeaders.forEach((header) => {
                                    let cleanReq = header.replace(/[^A-Z0-9]/g, '');
                                    let headerIndex = cleanHeaderMap[cleanReq] !== undefined ? cleanHeaderMap[cleanReq] : headers.indexOf(header);
                                    if (headerIndex === -1 && cleanReq.includes('TINDAKLANJUTKLAIM')) {
                                        headerIndex = cleanHeaderMap['TINDAKLANJUT'] !== undefined ? cleanHeaderMap['TINDAKLANJUT'] : cleanHeaderMap['KLAIM'];
                                    }
                                    const val = headerIndex > -1 && currentline[headerIndex] !== undefined ? currentline[headerIndex] : '';
                                    obj[header] = val;
                                    rowData.push(val);
                                });
                                dataArray.push(obj);
                                sheetData.push(rowData);
                            }

                            if (type === 'KOL1') { setKol1Data(dataArray); localStorage.setItem('kol1Data', JSON.stringify(dataArray)); }
                            else if (type === 'LAR') { setLarData(dataArray); localStorage.setItem('larData', JSON.stringify(dataArray)); }
                            else if (type === 'NPL') { setNplData(dataArray); localStorage.setItem('nplData', JSON.stringify(dataArray)); }
                            else if (type === 'KLAIM') { setKlaimData(dataArray); localStorage.setItem('klaimData', JSON.stringify(dataArray)); }
                            else if (type === 'REPORT') { setReportData(dataArray); localStorage.setItem('reportData', JSON.stringify(dataArray)); }
                            
                            const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                            if (targetUrl) {
                                await fetch(targetUrl, {
                                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                    body: JSON.stringify({ action: `upload_${type.toLowerCase()}`, data: sheetData })
                                });
                            }
                            showToast(`Data ${type} sukses disimpan dan disinkronkan ke Cloud!`);
                        } catch (err) { showToast(`Gagal: ${err.message}`, 'error'); }
                        e.target.value = null; 
                        setIsLoading(false);
                    };
                    reader.readAsText(file);
                };

                const resetData = (type) => {
                    setConfirmModal({
                        open: true,
                        title: `Kosongkan Data ${type}`,
                        message: `Hapus seluruh data ${type} saat ini dari aplikasi dan database Google Sheet? Tindakan ini akan mengosongkan tabel.`,
                        onConfirm: async () => {
                            setIsLoading(true);
                            if (type === 'KOL1') { setKol1Data([]); localStorage.removeItem('kol1Data'); }
                            else if (type === 'LAR') { setLarData([]); localStorage.removeItem('larData'); }
                            else if (type === 'NPL') { setNplData([]); localStorage.removeItem('nplData'); }
                            else if (type === 'KLAIM') { setKlaimData([]); localStorage.removeItem('klaimData'); }
                            else if (type === 'REPORT') { setReportData([]); localStorage.removeItem('reportData'); }
                            
                            const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                            if (targetUrl) {
                                try {
                                    await fetch(targetUrl, {
                                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                        body: JSON.stringify({ action: `upload_${type.toLowerCase()}`, data: [] })
                                    });
                                } catch(e) {}
                            }
                            showToast(`Data ${type} berhasil dikosongkan`);
                            setIsLoading(false);
                            setConfirmModal({ open: false, title: '', message: '', onConfirm: null });
                        }
                    });
                };

                const downloadTemplateCSV = (type) => {
                    let headers = '';
                    if (type === 'REPORT') headers = 'NAMA_CABANG,TARGET_OSL,REALISASI_OSL,PENCAPAIAN_OSL,TARGET_NPL,REALISASI_NPL,PENCAPAIAN_NPL,TARGET_LAR,REALISASI_LAR,PENCAPAIAN_LAR,TARGET_RATA2,REALISASI_RATA2,PENCAPAIAN_RATA2,TARGET_NOA,REALISASI_NOA,PENCAPAIAN_NOA\nMEDAN PETISAH,17.698.150.629,17.792.220.707,100.53%,1.66,4.33,38.33%,11.57,18.72,61.81%,16.843.528.392,16.973.417.363,100.77%,175,56,32.01%';
                    else if (type === 'KOL1') headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,TGL_JATUH_TEMPO,KOLEKTIBILITAS,HARI_TUNGGAKAN,OSL,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,01-10-2026,1,5,5000000,UPC A,CH-1,CABANG A';
                    else if (type === 'KLAIM') headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,TGL_JATUH_TEMPO,KOLEKTIBILITAS,HARI_TUNGGAKAN,OSL,OUTLET,OUTLET_CHANNELING,CABANG,TINDAK LANJUT KLAIM\n01-09-2026,123456,K-999,Nasabah Klaim,KREASI BARU,01-01-2026,12,01-10-2026,4,95,15000000,UPC PASAR MERAH,CH-1,MEDAN UTAMA,PROSES PENGAJUAN ASURANSI';
                    else headers = 'TGL_DATA,CIF,NO_KONTRAK,CUSTOMER_NM,SUB PRODUK,TGL_KREDIT,TENOR,KOLEKTIBILITAS,HARI_TUNGGAKAN,UP,OUTLET,OUTLET_CHANNELING,CABANG\n01-09-2026,123456,K-001,Budi Santoso,KREASI BARU,01-01-2026,12,2,45,5000000,UPC A,CH-1,CABANG A';
                    
                    const blob = new Blob([headers], { type: 'text/csv' });
                    const a = document.createElement('a');
                    a.href = window.URL.createObjectURL(blob);
                    a.download = `Template_Upload_${type}.csv`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };

                return (
                    <div className="space-y-8">
                        {/* Pengaturan Koneksi Database Google Apps Script */}
                        <div className="bg-white p-6 md:p-8 border border-slate-200 rounded-3xl shadow-sm">
                            <h3 className="font-bold text-slate-900 mb-2 text-lg"><i className="fas fa-database mr-2 text-blue-600"></i>Koneksi Database Google Spreadsheet</h3>
                            <p className="text-xs text-slate-500 mb-4">Pastikan Web App Google Apps Script disetel dengan akses <strong>"Siapa saja / Anyone"</strong>.</p>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <input 
                                    type="text" 
                                    value={sheetInput} 
                                    onChange={(e) => setSheetInput(e.target.value)}
                                    placeholder="https://script.google.com/macros/s/.../exec"
                                    className="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-mono text-xs focus:bg-white focus:ring-2 focus:ring-blue-600"
                                />
                                <button onClick={testConnection} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-2xl text-xs font-bold transition flex items-center justify-center">
                                    <i className="fas fa-plug mr-2"></i> Uji Koneksi & Simpan
                                </button>
                            </div>
                        </div>

                        {/* 5 Kotak Upload CSV Data Nasabah Berwarna (KOL1, LAR, NPL, KLAIM, REPORT) */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div className="bg-amber-50/70 border border-amber-200 p-6 rounded-3xl shadow-sm relative overflow-hidden">
                                <div className="flex justify-between mb-4">
                                    <div><h3 className="font-bold text-amber-900 text-base">Upload KOL 1</h3><p className="text-xs text-amber-700">Tunggakan 1-10 Hari</p></div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => downloadTemplateCSV('KOL1')} className="px-2.5 py-1 bg-white text-amber-800 border border-amber-300 rounded-xl text-xs hover:bg-amber-100 font-bold">Template</button>
                                        <button onClick={() => resetData('KOL1')} className="px-2.5 py-1 bg-amber-600 text-white rounded-xl text-xs hover:bg-amber-700 font-bold">Reset</button>
                                    </div>
                                </div>
                                <div className="relative">
                                    <input type="file" accept=".csv" onChange={(e) => processCSVUpload(e, 'KOL1')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center pointer-events-none shadow-sm"><i className="fas fa-upload mr-2"></i> Pilih CSV KOL 1</button>
                                </div>
                            </div>
                            
                            <div className="bg-orange-50/70 border border-orange-200 p-6 rounded-3xl shadow-sm relative overflow-hidden">
                                <div className="flex justify-between mb-4">
                                    <div><h3 className="font-bold text-orange-900 text-base">Upload LAR</h3><p className="text-xs text-orange-700">Tunggakan 11-30 Hari</p></div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => downloadTemplateCSV('LAR')} className="px-2.5 py-1 bg-white text-orange-800 border border-orange-300 rounded-xl text-xs hover:bg-orange-100 font-bold">Template</button>
                                        <button onClick={() => resetData('LAR')} className="px-2.5 py-1 bg-orange-600 text-white rounded-xl text-xs hover:bg-orange-700 font-bold">Reset</button>
                                    </div>
                                </div>
                                <div className="relative">
                                    <input type="file" accept=".csv" onChange={(e) => processCSVUpload(e, 'LAR')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-orange-500 hover:bg-orange-600 text-white py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center pointer-events-none shadow-sm"><i className="fas fa-upload mr-2"></i> Pilih CSV LAR</button>
                                </div>
                            </div>

                            <div className="bg-red-50/70 border border-red-200 p-6 rounded-3xl shadow-sm relative overflow-hidden">
                                <div className="flex justify-between mb-4">
                                    <div><h3 className="font-bold text-red-900 text-base">Upload NPL</h3><p className="text-xs text-red-700">KOL 3 - KOL 5</p></div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => downloadTemplateCSV('NPL')} className="px-2.5 py-1 bg-white text-red-800 border border-red-300 rounded-xl text-xs hover:bg-red-100 font-bold">Template</button>
                                        <button onClick={() => resetData('NPL')} className="px-2.5 py-1 bg-red-600 text-white rounded-xl text-xs hover:bg-red-700 font-bold">Reset</button>
                                    </div>
                                </div>
                                <div className="relative">
                                    <input type="file" accept=".csv" onChange={(e) => processCSVUpload(e, 'NPL')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center pointer-events-none shadow-sm"><i className="fas fa-upload mr-2"></i> Pilih CSV NPL</button>
                                </div>
                            </div>

                            <div className="bg-teal-50/70 border border-teal-200 p-6 rounded-3xl shadow-sm relative overflow-hidden">
                                <div className="flex justify-between mb-4">
                                    <div><h3 className="font-bold text-teal-900 text-base">Upload Klaim</h3><p className="text-xs text-teal-700">Tindak Lanjut Klaim</p></div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => downloadTemplateCSV('KLAIM')} className="px-2.5 py-1 bg-white text-teal-800 border border-teal-300 rounded-xl text-xs hover:bg-teal-100 font-bold">Template</button>
                                        <button onClick={() => resetData('KLAIM')} className="px-2.5 py-1 bg-teal-600 text-white rounded-xl text-xs hover:bg-teal-700 font-bold">Reset</button>
                                    </div>
                                </div>
                                <div className="relative">
                                    <input type="file" accept=".csv" onChange={(e) => processCSVUpload(e, 'KLAIM')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-teal-600 hover:bg-teal-700 text-white py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center pointer-events-none shadow-sm"><i className="fas fa-upload mr-2"></i> Pilih CSV Klaim</button>
                                </div>
                            </div>

                            <div className="bg-blue-50/70 border border-blue-200 p-6 rounded-3xl shadow-sm relative overflow-hidden">
                                <div className="flex justify-between mb-4">
                                    <div><h3 className="font-bold text-blue-900 text-base">Upload Report</h3><p className="text-xs text-blue-700">Report Realisasi Cabang</p></div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => downloadTemplateCSV('REPORT')} className="px-2.5 py-1 bg-white text-blue-800 border border-blue-300 rounded-xl text-xs hover:bg-blue-100 font-bold">Template</button>
                                        <button onClick={() => resetData('REPORT')} className="px-2.5 py-1 bg-blue-600 text-white rounded-xl text-xs hover:bg-blue-700 font-bold">Reset</button>
                                    </div>
                                </div>
                                <div className="relative">
                                    <input type="file" accept=".csv" onChange={(e) => processCSVUpload(e, 'REPORT')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center pointer-events-none shadow-sm"><i className="fas fa-upload mr-2"></i> Pilih CSV Report</button>
                                </div>
                            </div>
                        </div>

                        {/* Kelola Master Data: 4 Kolom (Cabang, AO, Admin Mikro, Produk) */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <div className="bg-rose-50/50 p-6 border border-rose-200 rounded-3xl shadow-sm">

                                    <h3 className="font-bold text-rose-900 text-sm"><i className="fas fa-building mr-2 text-rose-600"></i>Kelola Cabang</h3>
                                    <div className="relative">
                                        <input type="file" accept=".csv" onChange={(e) => processMasterCSVUpload(e, 'CABANG')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Upload CSV 1 Kolom"/>
