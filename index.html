                                        className={`w-full text-left px-3.5 py-2.5 rounded-2xl mb-1 transition flex items-center text-xs font-bold ${activeTab === 'repReal' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                    >
                                        <i className="fas fa-chart-simple w-6 text-blue-400 text-sm"></i> Report Realisasi
                                    </button>
                                </div>

                                <div>
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 px-3 font-heading flex items-center justify-between">
                                        <span>Layanan & Portofolio</span>
                                        <span className="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded-full border border-emerald-500/30 font-bold">BARU</span>
                                    </p>
                                    <button
                                        onClick={() => { setActiveTab('simulasiRtt'); setIsSidebarOpen(false) }}
                                        className={`w-full text-left px-3.5 py-2.5 rounded-2xl mb-1 transition flex items-center justify-between text-xs font-bold ${activeTab === 'simulasiRtt' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md shadow-emerald-900/40' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                    >
                                        <span className="flex items-center">
                                            <i className="fas fa-calculator w-6 text-emerald-400 text-sm"></i> Simulasi RTT
                                        </span>
                                        <span className="text-[9px] bg-white/10 px-2 py-0.5 rounded-lg">CALC</span>
                                    </button>
                                    <button
                                        onClick={() => { setActiveTab('dashAsuransi'); setIsSidebarOpen(false) }}
                                        className={`w-full text-left px-3.5 py-2.5 rounded-2xl mb-1 transition flex items-center justify-between text-xs font-bold ${activeTab === 'dashAsuransi' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md shadow-blue-900/40' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                    >
                                        <span className="flex items-center">
                                            <i className="fas fa-shield-heart w-6 text-cyan-400 text-sm"></i> Asuransi Klaim & Premi
                                        </span>
                                        <span className="text-[9px] bg-cyan-400/20 text-cyan-300 px-1.5 py-0.5 rounded-md font-bold">LOOKER</span>
                                    </button>
                                </div>

                                {isAdmin && (
                                    <div>
                                        <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 px-3 font-heading">
                                            Manajemen Admin
                                        </p>
                                        <button
                                            onClick={() => { setActiveTab('rekReal'); setIsSidebarOpen(false) }}
                                            className={`w-full text-left px-3.5 py-2.5 rounded-2xl mb-1 transition flex items-center text-xs font-bold ${activeTab === 'rekReal' ? 'bg-white/15 text-white' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                        >
                                            <i className="fas fa-table-list w-6 text-sm"></i> Rekap Realisasi
                                        </button>
                                        <button
                                            onClick={() => { setActiveTab('rekEst'); setIsSidebarOpen(false) }}
                                            className={`w-full text-left px-3.5 py-2.5 rounded-2xl mb-1 transition flex items-center text-xs font-bold ${activeTab === 'rekEst' ? 'bg-white/15 text-white' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                        >
                                            <i className="fas fa-calendar-check w-6 text-sm"></i> Rekap Estimasi
                                        </button>
                                        <button
                                            onClick={() => { setActiveTab('admin'); setIsSidebarOpen(false) }}
                                            className={`w-full text-left px-3.5 py-2.5 rounded-2xl mb-1 transition flex items-center text-xs font-bold ${activeTab === 'admin' ? 'bg-emerald-500 text-slate-950 font-black shadow-lg shadow-emerald-500/20' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                        >
                                            <i className="fas fa-sliders w-6 text-sm"></i> Kelola & Setting
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="p-4 border-t border-white/10 bg-black/20">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-2.5 overflow-hidden">
                                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-white font-black text-xs flex items-center justify-center shadow-sm">
                                        {isAdmin ? 'AD' : 'AO'}
                                    </div>
                                    <div className="truncate">
                                        <p className="text-xs font-extrabold text-white truncate font-heading">{isAdmin ? 'Administrator' : 'Account Officer'}</p>
                                        <p className="text-[10px] text-slate-400 font-semibold">Area Medan 1</p>
                                    </div>
                                </div>
                                <button
                                    onClick={() => { setUserRole(null); localStorage.removeItem('userRole'); }}
                                    className="text-slate-400 hover:text-rose-400 p-2 transition"
                                    title="Keluar dari Akun"
                                >
                                    <i className="fas fa-power-off text-sm"></i>
                                </button>
                            </div>
                        </div>

                    </aside>

                    <main className="main-content">

                        <header className="flex justify-between items-center mb-8 bg-white/90 backdrop-blur-xl p-4 md:px-6 rounded-3xl shadow-sm border border-slate-200/80 sticky top-4 z-40">

                            <div className="flex items-center">
                                <button
                                    onClick={() => setIsSidebarOpen(true)}
                                    className="lg:hidden mr-3.5 text-slate-600 hover:text-slate-900 focus:outline-none p-2 rounded-xl bg-slate-100"
                                >
                                    <i className="fas fa-bars text-lg"></i>
                                </button>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h2 className="text-lg font-black text-slate-900 font-heading">
                                            Area Medan 1
                                        </h2>
                                        <span className="hidden sm:inline-block px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-extrabold uppercase">
                                            Juara 1
                                        </span>
                                    </div>
                                    <LiveClock />
                                </div>
                            </div>

                            <div className="flex items-center space-x-3">
                                <button
                                    onClick={() => setDbModal(true)}
                                    className={`px-3 py-1.5 rounded-2xl text-xs font-bold flex items-center transition shadow-sm border ${cloudStatus === 'connected' ? 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100' : 'bg-rose-50 text-rose-800 border-rose-200 hover:bg-rose-100 animate-pulse'}`}
                                    title="Cek Status Database Cloud"
                                >
                                    <span className={`w-2 h-2 rounded-full mr-2 ${cloudStatus === 'connected' ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                                    <span className="hidden sm:inline">{cloudStatus === 'connected' ? 'Cloud Terhubung' : 'Koneksi Terputus'}</span>
                                </button>

                                <button
                                    onClick={() => setIsDarkMode(prev => !prev)}
                                    className="w-10 h-10 rounded-2xl bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-amber-300 transition flex items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm"
                                    title={isDarkMode ? "Ganti ke Mode Terang" : "Ganti ke Mode Gelap"}
                                >
                                    <i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'} text-sm`}></i>
                                </button>

                                <button
                                    onClick={() => syncFromSheet(null, true)}
                                    className="w-10 h-10 rounded-2xl bg-slate-50 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 transition flex items-center justify-center border border-slate-200 shadow-sm"
                                    title="Tarik Sinkronisasi Data Cloud"
                                >
                                    <i className="fas fa-rotate text-sm"></i>
                                </button>

                                <div className="bg-slate-50 px-3.5 py-1.5 rounded-2xl flex items-center border border-slate-200 shadow-sm">
                                    <span className="text-xs font-extrabold text-slate-800 mr-3 hidden sm:inline">
                                        Hi, {isAdmin ? 'Admin' : 'AO'}
                                    </span>
                                    <button
                                        onClick={() => { setUserRole(null); localStorage.removeItem('userRole'); }}
                                        className="text-xs text-rose-600 hover:text-rose-700 font-extrabold border-l pl-3 border-slate-200 flex items-center"
                                        title="Keluar"
                                    >
                                        <i className="fas fa-power-off sm:mr-1"></i>
                                        <span className="hidden sm:inline">Logout</span>
                                    </button>
                                </div>

                            </div>
                        </header>

                        <div className="pb-12">
                            {activeTab === 'leaderboard' && (
                                <LeaderboardView
                                    dataPencairan={dataPencairan}
                                    cabangList={cabangList}
                                    aoList={aoList}
                                    adminList={adminList}
                                    showToast={showToast}
                                />
                            )}
                            {activeTab === 'dashReal' && (
                                <Dashboard
                                    type="realisasi"
                                    dataPencairan={dataPencairan}
                                    dataEstimasi={dataEstimasi}
                                    adminList={adminList}
                                    aoList={aoList}
                                    showToast={showToast}
                                />
                            )}
                            {activeTab === 'dashEst' && (
                                <Dashboard
                                    type="estimasi"
                                    dataPencairan={dataPencairan}
                                    dataEstimasi={dataEstimasi}
                                    adminList={adminList}
                                    aoList={aoList}
                                    showToast={showToast}
                                />
                            )}
                            {activeTab === 'inReal' && (
                                <InputForm
                                    type="realisasi"
                                    cabangList={cabangList}
                                    productList={productList}
                                    adminList={adminList}
                                    aoList={aoList}
                                    dataPencairan={dataPencairan}
                                    setDataPencairan={setDataPencairan}
                                    dataEstimasi={dataEstimasi}
                                    setDataEstimasi={setDataEstimasi}
                                    sheetUrl={sheetUrl}
                                    showToast={showToast}
                                    isLoading={isLoading}
                                    setIsLoading={setIsLoading}
                                />
                            )}
                            {activeTab === 'inEst' && (
                                <InputForm
                                    type="estimasi"
                                    cabangList={cabangList}
                                    productList={productList}
                                    adminList={adminList}
                                    aoList={aoList}
                                    dataPencairan={dataPencairan}
                                    setDataPencairan={setDataPencairan}
                                    dataEstimasi={dataEstimasi}
                                    setDataEstimasi={setDataEstimasi}
                                    sheetUrl={sheetUrl}
                                    showToast={showToast}
                                    isLoading={isLoading}
                                    setIsLoading={setIsLoading}
                                />
                            )}
                            {activeTab === 'rekReal' && (
                                <DataRekap
                                    type="realisasi"
                                    dataPencairan={dataPencairan}
                                    setDataPencairan={setDataPencairan}
                                    dataEstimasi={dataEstimasi}
                                    setDataEstimasi={setDataEstimasi}
                                    sheetUrl={sheetUrl}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                    setConfirmModal={setConfirmModal}
                                />
                            )}
                            {activeTab === 'rekEst' && (
                                <DataRekap
                                    type="estimasi"
                                    dataPencairan={dataPencairan}
                                    setDataPencairan={setDataPencairan}
                                    dataEstimasi={dataEstimasi}
                                    setDataEstimasi={setDataEstimasi}
                                    sheetUrl={sheetUrl}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                    setConfirmModal={setConfirmModal}
                                />
                            )}
                            {activeTab === 'repKol1' && (
                                <TableNasabahView
                                    title="KOL 1 (1-10 Hari)"
                                    data={kol1Data}
                                    type="kol1"
                                    icon="fa-triangle-exclamation"
                                    syncFromSheet={syncFromSheet}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                />
                            )}
                            {activeTab === 'repLar' && (
                                <TableNasabahView
                                    title="LAR (11-30 Hari)"
                                    data={larData}
                                    type="lar"
                                    icon="fa-clock-rotate-left"
                                    syncFromSheet={syncFromSheet}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                />
                            )}
                            {activeTab === 'repNpl' && (
                                <TableNasabahView
                                    title="NPL (KOL 3-5)"
                                    data={nplData}
                                    type="npl"
                                    icon="fa-circle-exclamation"
                                    syncFromSheet={syncFromSheet}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                />
                            )}
                            {activeTab === 'repKlaim' && (
                                <TableNasabahView
                                    title="Tindak Lanjut Klaim"
                                    data={klaimData}
                                    type="klaim"
                                    icon="fa-shield-halved"
                                    syncFromSheet={syncFromSheet}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                />
                            )}
                            {activeTab === 'repReal' && (
                                <ReportRealisasiView
                                    reportData={reportData}
                                    syncFromSheet={syncFromSheet}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                />
                            )}
                            {activeTab === 'simulasiRtt' && (
                                <SimulasiRttView
                                    showToast={showToast}
                                />
                            )}
                            {activeTab === 'dashAsuransi' && (
                                <DashboardAsuransiView
                                    showToast={showToast}
                                />
                            )}
                            {activeTab === 'admin' && isAdmin && (
                                <AdminPanel
                                    aoList={aoList} setAoList={setAoList}
                                    adminList={adminList} setAdminList={setAdminList}
                                    productList={productList} setProductList={setProductList}
                                    cabangList={cabangList} setCabangList={setCabangList}
                                    appUsers={appUsers} setAppUsers={setAppUsers}
                                    sheetUrl={sheetUrl} setSheetUrl={setSheetUrl}
                                    syncFromSheet={syncFromSheet}
                                    syncMasterToSheet={syncMasterToSheet}
                                    syncUsersToSheet={syncUsersToSheet}
                                    showToast={showToast}
                                    setIsLoading={setIsLoading}
                                    setConfirmModal={setConfirmModal}
                                    setKol1Data={setKol1Data}
                                    setLarData={setLarData}
                                    setNplData={setNplData}
                                    setKlaimData={setKlaimData}
                                    setReportData={setReportData}
                                />
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
