                            for (let i = 0; i < line.length; i++) {
                                if (line[i] === '"') inQuotes = !inQuotes;
                                else if (line[i] === delimiter && !inQuotes) {
                                    result.push(line.substring(start, i).replace(/^"|"$/g, '').trim());
                                    start = i + 1;

                            result.push(line.substring(start).replace(/^"|"$/g, '').trim());

                        const headers = parseLine(lines[0].toUpperCase());

                        const reqREPORT = ['NAMA_CABANG', 'TARGET_OSL', 'REALISASI_OSL', 'PENCAPAIAN_OSL', 'TARGET_NPL', 'REALISASI_NPL', 'PENCAPAIAN_NPL', 'TARGET_LAR', 'REALISASI_LAR', 'PENCAPAIAN_LAR', 'TARGET_RATA2', 'REALISASI_RATA2', 'PENCAPAIAN_RATA2', 'TARGET_NOA', 'REALISASI_NOA', 'PENCAPAIAN_NOA'];

                                let cleanReq = header.replace(/[^A-Z0-9]/g, '');
                                let headerIndex = cleanHeaderMap[cleanReq] !== undefined ? cleanHeaderMap[cleanReq] : headers.indexOf(header);
                                if (headerIndex === -1 && cleanReq.includes('TINDAKLANJUTKLAIM')) {
                                    headerIndex = cleanHeaderMap['TINDAKLANJUT'] !== undefined ? cleanHeaderMap['TINDAKLANJUT'] : cleanHeaderMap['KLAIM'];
                                }
                                const val = headerIndex > -1 && currentline[headerIndex] !== undefined ? currentline[headerIndex] : '';
                                obj[header] = val;
                                rowData.push(val);
                            });
                            dataArray.push(obj);
                            sheetData.push(rowData);

                        if (targetUrl) {
                            await fetch(targetUrl, {
                                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                body: JSON.stringify({ action: `upload_${type.toLowerCase()}`, data: sheetData })
                            });
                        }
                        showToast(`Data ${type} sukses disimpan dan disinkronkan ke Cloud!`);
                    } catch (err) { showToast(`Gagal: ${err.message}`, 'error'); }

        /* ==========================================================
   TOP-LEVEL COMPONENT: LeaderboardView (Paket 1 Enhanced with Date Range)
   (Klasemen Juara 17 Cabang & AO Bintang PT. Pegadaian Area Medan 1)
   - Khusus AO: Hanya menampilkan nama-nama Account Officer (TIDAK digabung dengan Admin Mikro)
   - Dilengkapi Filter Range Tanggal (Dari Tanggal s/d Sampai Tanggal), Harian (Hari Ini), Bulanan, Tahunan, dan Semua Data
========================================================== */
        const LeaderboardView = ({ dataPencairan, cabangList, aoList, adminList, showToast }) => {
            const [viewMode, setViewMode] = useState('cabang'); // 'cabang' | 'ao'
            const [timeframe, setTimeframe] = useState('today'); // 'today' | 'month' | 'year' | 'all' | 'custom'
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth() + 1;
            const todayStr = today.toLocaleDateString('en-CA'); // 'YYYY-MM-DD'
            const monthNamesIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const currentMonthName = monthNamesIndo[today.getMonth()];

            // Hitung jumlah hari dalam rentang jika custom
            const rangeDays = React.useMemo(() => {
                if (startDate && endDate) {
                    const d1 = new Date(startDate);
                    const d2 = new Date(endDate);
                    const diffTime = Math.abs(d2 - d1);
                    return Math.max(1, Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1);
                }
                return 1;
            }, [startDate, endDate]);

            // Format tanggal Indonesia rapi
            const formatIndoDate = (dateStr) => {
                if (!dateStr) return '';
                try {
                    const parts = dateStr.split('-');
                    if (parts.length === 3) {
                        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                    }
                    return dateStr;
                } catch (e) { return dateStr; }
            };

            // Deskripsi periode teks
            const getPeriodDescription = () => {
                if (startDate && endDate) {
                    return `Rentang Tanggal ${formatIndoDate(startDate)} s/d ${formatIndoDate(endDate)} (${rangeDays} Hari)`;
                }
                if (startDate) {
                    return `Mulai Tanggal ${formatIndoDate(startDate)}`;
                }
                if (endDate) {
                    return `Sampai Tanggal ${formatIndoDate(endDate)}`;
                }
                if (timeframe === 'today') {
                    return `Hari Ini (${today.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })})`;
                }
                if (timeframe === 'month') {
                    return `Bulan ${currentMonthName} ${currentYear}`;
                }
                if (timeframe === 'year') {
                    return `Tahun ${currentYear} (YTD)`;
                }
                return 'Semua Data';
            };

            // Filter data by timeframe & date range
            const filteredPencairan = React.useMemo(() => {
                return (dataPencairan || []).filter(item => {
                    if (!item.Tanggal) return timeframe === 'all';
                    const dStr = normalizeDate(item.Tanggal);
                    if (!dStr) return timeframe === 'all';

                    // Filter Range Tanggal eksplisit jika diisi
                    if (startDate || endDate || timeframe === 'custom') {
                        let match = true;
                        if (startDate && dStr < startDate) match = false;
                        if (endDate && dStr > endDate) match = false;
                        return match;
                    }

                    if (timeframe === 'today') {
                        return dStr === todayStr;
                    } else if (timeframe === 'month') {
                        const [y, m] = dStr.split('-').map(Number);
                        return y === currentYear && m === currentMonth;
                    } else if (timeframe === 'year') {
                        const [y] = dStr.split('-').map(Number);
                        return y === currentYear;
                    }
                    return true;
                });
            }, [dataPencairan, timeframe, startDate, endDate, currentYear, currentMonth, todayStr]);

            // Compute rankings (Strict separation: Cabang vs AO murni tanpa Admin Mikro)
            const rankingData = React.useMemo(() => {
                const cleanVal = (val) => Number(String(val || 0).replace(/\D/g, '')) || 0;

                // Set of Admin Mikro names to strictly exclude from AO leaderboard
                const adminNames = (adminList && adminList.length > 0 ? adminList : DEFAULT_ADMIN_LIST);
                const adminSet = new Set(adminNames.map(a => a.trim().toLowerCase()));

                if (viewMode === 'cabang') {
                    const map = {};
                    // Initialize with all 17 branches from cabangList
                    (cabangList && cabangList.length > 0 ? cabangList : DEFAULT_CABANG_LIST).forEach(c => {
                        const key = c.trim().toUpperCase();
                        map[key] = { name: c, totalUP: 0, noa: 0, products: {} };
                    });

                    filteredPencairan.forEach(item => {
                        const rawCab = (item.Cabang || 'Lainnya').trim();
                        const key = rawCab.toUpperCase();
                        if (!map[key]) {
                            map[key] = { name: rawCab, totalUP: 0, noa: 0, products: {} };
                        }
                        const up = cleanVal(item.Plafon);
                        map[key].totalUP += up;
                        map[key].noa += 1;
                        const prod = item.Produk || 'Lainnya';
                        map[key].products[prod] = (map[key].products[prod] || 0) + up;
                    });

                    // Target per Cabang proporsional:
                    // Harian (Hari Ini) = Rp 36.000.000 (36 Jt per hari)
                    // Range Tanggal = 36 Jt * rangeDays
                    // Bulanan = Rp 900.000.000 (900 Jt)
                    // Tahunan = Rp 10.800.000.000
                    const defaultBranchTarget =
                        (startDate || endDate || timeframe === 'custom') ? (36000000 * rangeDays) :
                            (timeframe === 'today' ? 36000000 :
                                (timeframe === 'month' ? 900000000 :
                                    (timeframe === 'year' ? 10800000000 : 15000000000)));

                    const list = Object.values(map).map(item => {
                        const target = defaultBranchTarget;
                        const achievement = target > 0 ? (item.totalUP / target) * 100 : 0;
                        const avgTicket = item.noa > 0 ? Math.round(item.totalUP / item.noa) : 0;
                        return {
                            ...item,
                            target,
                            achievement,
                            avgTicket
                        };
                    });

                    list.sort((a, b) => b.totalUP - a.totalUP || b.noa - a.noa);
                    return list;
                } else {
                    // Aggregate STRICTLY by AO (Account Officer saja, BUKAN Admin Mikro)
                    const map = {};

                    // Inisialisasi awal dengan seluruh daftar AO resmi Area Medan 1
                    const officialAoList = (aoList && aoList.length > 0 ? aoList : DEFAULT_AO_LIST);
                    officialAoList.forEach(ao => {
                        const clean = ao.trim();
                        if (!clean || adminSet.has(clean.toLowerCase())) return; // Filter ketat: jangan masukkan jika nama admin
                        const key = clean.toUpperCase();
                        map[key] = {
                            name: clean,
                            cabang: '-',
                            totalUP: 0,
                            noa: 0
                        };
                    });

                    filteredPencairan.forEach(item => {
                        // HANYA mengambil field item.AO (Pemrakarsa Kredit), TIDAK mengambil item.Petugas (Admin Mikro)!
                        const rawAO = (item.AO || '').trim();
                        if (!rawAO) return; // Lewati jika field AO kosong
                        if (adminSet.has(rawAO.toLowerCase())) return; // Filter ketat: jika nama tercatat sebagai Admin Mikro, abaikan!

                        const key = rawAO.toUpperCase();
                        if (!map[key]) {
                            map[key] = {
                                name: rawAO,
                                cabang: item.Cabang || '-',
                                totalUP: 0,
                                noa: 0
                            };
                        }
                        const up = cleanVal(item.Plafon);
                        map[key].totalUP += up;
                        map[key].noa += 1;
                        if ((!map[key].cabang || map[key].cabang === '-') && item.Cabang) {
                            map[key].cabang = item.Cabang;
                        }
                    });

                    // Target per AO proporsional:
                    // Harian (Hari Ini) = Rp 14.000.000 (14 Jt per hari)
                    // Range Tanggal = 14 Jt * rangeDays
                    // Bulanan = Rp 350.000.000 (350 Jt)
                    // Tahunan = Rp 4.200.000.000
                    const defaultAoTarget =
                        (startDate || endDate || timeframe === 'custom') ? (14000000 * rangeDays) :
                            (timeframe === 'today' ? 14000000 :
                                (timeframe === 'month' ? 350000000 :
                                    (timeframe === 'year' ? 4200000000 : 5000000000)));

                    const list = Object.values(map).map(item => {
                        const target = defaultAoTarget;
                        const achievement = target > 0 ? (item.totalUP / target) * 100 : 0;
                        const avgTicket = item.noa > 0 ? Math.round(item.totalUP / item.noa) : 0;
                        return {
                            ...item,
                            target,
                            achievement,
                            avgTicket
                        };
                    });

                    list.sort((a, b) => b.totalUP - a.totalUP || b.noa - a.noa);
                    return list;
                }
            }, [filteredPencairan, viewMode, cabangList, aoList, adminList, timeframe, startDate, endDate, rangeDays]);

            const totalAllUP = rankingData.reduce((acc, curr) => acc + curr.totalUP, 0);
            const totalAllNOA = rankingData.reduce((acc, curr) => acc + curr.noa, 0);

            // Filter by search
            const displayedRankings = rankingData.filter(item =>
                item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.cabang && item.cabang.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            // Top 3 Podium
            const top1 = rankingData[0] || null;
            const top2 = rankingData[1] || null;
            const top3 = rankingData[2] || null;

            // WA Share Generator
            const copyWAClassification = () => {
                const title = viewMode === 'cabang' ? 'KLASEMEN 17 CABANG' : 'KLASEMEN AO BINTANG';
                let text = `🏆 *${title} MIKRO AREA MEDAN 1*\n`;
                text += `📅 *Periode:* ${getPeriodDescription()}\n`;
                text += `💰 *Total Realisasi Area:* ${formatRupiah(totalAllUP)} (${totalAllNOA} Nasabah)\n\n`;
                text += `🥇 *TOP 3 JUARA:* \n`;
                if (top1 && top1.totalUP > 0) text += `1. 👑 *${top1.name}*: ${formatRupiah(top1.totalUP)} (${top1.noa} NOA) - Capaian: ${top1.achievement.toFixed(1)}%\n`;
                if (top2 && top2.totalUP > 0) text += `2. 🥈 *${top2.name}*: ${formatRupiah(top2.totalUP)} (${top2.noa} NOA) - Capaian: ${top2.achievement.toFixed(1)}%\n`;
                if (top3 && top3.totalUP > 0) text += `3. 🥉 *${top3.name}*: ${formatRupiah(top3.totalUP)} (${top3.noa} NOA) - Capaian: ${top3.achievement.toFixed(1)}%\n\n`;

                const activeList = rankingData.filter(item => item.totalUP > 0);
                if (activeList.length > 3) {
                    text += `📊 *Peringkat Selanjutnya:*\n`;
                    activeList.slice(3, 15).forEach((item, idx) => {
                        text += `${idx + 4}. ${item.name}: ${formatRupiah(item.totalUP)} (${item.noa} NOA)\n`;
                    });
                } else if (activeList.length === 0) {
                    text += `_Belum ada data pencairan yang terinput pada periode ini._\n`;
                }
                text += `\n🚀 *Mari terus pacu pencairan dan raih target bersama! Area Medan 1 Juara 1!*`;
                navigator.clipboard.writeText(text);
                showToast('Format teks Klasemen WhatsApp berhasil disalin!', 'success');
            };

            // PDF Export
            const exportPDF = () => {
                if (!window.jspdf) return showToast('Modul PDF belum siap', 'error');
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text('PT. PEGADAIAN - KANWIL MEDAN', 105, 15, { align: 'center' });
                doc.setFontSize(11);
                doc.setFont('helvetica', 'normal');
                doc.text(`LAPORAN KLASEMEN PERFORMA ${viewMode.toUpperCase()} MIKRO AREA MEDAN 1`, 105, 22, { align: 'center' });
                doc.setFontSize(9);
                doc.text(`Periode: ${getPeriodDescription()} | Dicetak: ${new Date().toLocaleDateString('id-ID')}`, 105, 27, { align: 'center' });

                const tableBody = rankingData.map((item, idx) => [
                    idx + 1,
                    item.name,
                    item.cabang || '-',
                    formatRupiah(item.totalUP),
                    item.noa,
                    formatRupiah(item.avgTicket),
                    `${item.achievement.toFixed(1)}%`
                ]);

                doc.autoTable({
                    startY: 32,
                    head: [['Rank', 'Nama', 'Cabang', 'Total Realisasi (UP)', 'NOA', 'Rata-rata UP', 'Capaian']],
                    body: tableBody,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 135, 68], textColor: 255, fontStyle: 'bold' },

                                                label: '🔥 On-Track',
                                                class: 'bg-blue-50 text-blue-800 border-blue-200 dark:bg-blue-950/40 dark:text-blue-400 dark:border-blue-800'
                                            };
                                        } else if (item.achievement >= 50) {
                                            statusBadge = {
                                                label: '⚡ Akselerasi',
                                                class: 'bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/40 dark:text-amber-400 dark:border-amber-800'
                                            };
                                        }

                                        return (
                                            <tr key={idx} className={`hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition ${isTop3 ? 'bg-amber-50/20 dark:bg-amber-950/10' : ''}`}>
                                                <td className="py-3.5 px-4 text-center">
                                                    {rank === 1 && <span className="inline-block p-1 bg-yellow-100 dark:bg-yellow-900/40 text-yellow-800 dark:text-yellow-300 rounded-full font-black text-xs px-2 shadow-xs">🥇 1</span>}
                                                    {rank === 2 && <span className="inline-block p-1 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-full font-black text-xs px-2 shadow-xs">🥈 2</span>}
                                                    {rank === 3 && <span className="inline-block p-1 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 rounded-full font-black text-xs px-2 shadow-xs">🥉 3</span>}
                                                    {rank > 3 && <span className="text-slate-500 dark:text-slate-400 font-bold">#{rank}</span>}
                                                </td>
                                                <td className="py-3.5 px-4 font-bold text-slate-900 dark:text-white">
                                                    {item.name}
                                                </td>
                                                {viewMode === 'ao' && (
                                                    <td className="py-3.5 px-4 text-slate-600 dark:text-slate-300">
                                                        {item.cabang || '-'}
                                                    </td>
                                                )}
                                                <td className="py-3.5 px-4 text-right font-black text-emerald-800 dark:text-emerald-400 tnum">
                                                    {formatRupiah(item.totalUP)}
                                                </td>
                                                <td className="py-3.5 px-4 text-center font-bold text-slate-800 dark:text-slate-200 tnum">
                                                    {item.noa}
                                                </td>
                                                <td className="py-3.5 px-4 text-right text-slate-600 dark:text-slate-400 tnum">
                                                    {formatRupiah(item.avgTicket)}
                                                </td>
                                                <td className="py-3.5 px-4 min-w-[140px]">
                                                    <div className="flex items-center space-x-2">
                                                        <div className="flex-1 h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                            <div
                                                                className={`h-full rounded-full ${item.achievement >= 100 ? 'bg-emerald-500' : (item.achievement >= 70 ? 'bg-blue-500' : (item.achievement >= 40 ? 'bg-amber-500' : 'bg-rose-500'))}`}
                                                                style={{ width: `${Math.min(100, item.achievement)}%` }}
                                                            ></div>
                                                        </div>
                                                        <span className="text-[11px] font-bold text-slate-700 dark:text-slate-300 tnum w-11 text-right">
                                                            {item.achievement.toFixed(0)}%
                                                        </span>
                                                    </div>
                                                </td>
                                                <td className="py-3.5 px-4 text-center">
                                                    <span className={`inline-block px-2.5 py-1 rounded-xl text-[10px] font-bold border ${statusBadge.class}`}>
                                                        {statusBadge.label}
                                                    </span>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };


        /* ==========================================================
           MAIN APP CONTAINER
        ========================================================== */
        const App = () => {
            const [userRole, setUserRole] = useState(localStorage.getItem('userRole'));
            const [activeTab, setActiveTab] = useState('dashReal');

            const [isDarkMode, setIsDarkMode] = useState(() => {
                try {
                    return localStorage.getItem('pegadaian_theme') === 'dark';
                } catch (e) { return false; }
            });

            useEffect(() => {
                try {
                    if (isDarkMode) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('pegadaian_theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('pegadaian_theme', 'light');
                    }
                } catch (e) { }
            }, [isDarkMode]);

            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [isLoading, setIsLoading] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            const [confirmModal, setConfirmModal] = useState({ open: false, title: '', message: '', onConfirm: null });
            const [dbModal, setDbModal] = useState(false);
            const [cloudStatus, setCloudStatus] = useState('unknown');

            const [sheetUrl, setSheetUrl] = useState(() => localStorage.getItem('customSheetUrl') || DEFAULT_SHEET_URL);

            const [dataPencairan, setDataPencairan] = useState(() => {
                try {
                    const local = localStorage.getItem('dataPencairan');
                    return local ? JSON.parse(local) : [];
                } catch (e) { return []; }
            });
            const [dataEstimasi, setDataEstimasi] = useState(() => {
                try {
                    const local = localStorage.getItem('dataEstimasi');
                    return local ? JSON.parse(local) : [];
                } catch (e) { return []; }
            });

            const [kol1Data, setKol1Data] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kol1Data')) || []; } catch (e) { return []; }
            });
            const [larData, setLarData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('larData')) || []; } catch (e) { return []; }
            });
            const [nplData, setNplData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('nplData')) || []; } catch (e) { return []; }
            });
            const [klaimData, setKlaimData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('klaimData')) || []; } catch (e) { return []; }
            });
            const [reportData, setReportData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('reportData')) || []; } catch (e) { return []; }
            });

            // Initializing master lists with defaults merged if local is empty
            const [aoList, setAoList] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('aoList'));
                    return (saved && saved.length > 0) ? saved : DEFAULT_AO_LIST;
                } catch (e) { return DEFAULT_AO_LIST; }
            });
            const [adminList, setAdminList] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('adminList'));
                    return (saved && saved.length > 0) ? saved : DEFAULT_ADMIN_LIST;
                } catch (e) { return DEFAULT_ADMIN_LIST; }
            });
            const [productList, setProductList] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('productList'));
                    return (saved && saved.length > 0) ? saved : DEFAULT_PRODUCT_LIST;
                } catch (e) { return DEFAULT_PRODUCT_LIST; }
            });
            const [cabangList, setCabangList] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('cabangList'));
                    return (saved && saved.length > 0) ? saved : DEFAULT_CABANG_LIST;
                } catch (e) { return DEFAULT_CABANG_LIST; }
            });

            const defaultUsers = [
                { username: 'admin', password: 'Area@123!!', role: 'admin' },
                { username: 'mikro', password: 'Mikro@123!', role: 'ao' },
                { username: 'ao', password: 'ao123', role: 'ao' }
            ];
            const [appUsers, setAppUsers] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('appUsers')) || defaultUsers;
                } catch (e) { return defaultUsers; }
            });

            useEffect(() => {
                const currentUsers = JSON.parse(localStorage.getItem('appUsers')) || [];
                const hasMasterAdmin = currentUsers.some(u => u.username && u.username.toLowerCase() === 'admin' && u.password === 'Area@123!');
                const hasMasterAo = currentUsers.some(u => u.username && u.username.toLowerCase() === 'mikro' && u.password === 'Mikro@123!');
                if (!hasMasterAdmin || !hasMasterAo) {
                    const cleanUsers = currentUsers.filter(u => u.username && u.username.toLowerCase() !== 'admin' && u.username.toLowerCase() !== 'mikro');
                    const mergedUsers = [...defaultUsers, ...cleanUsers];
                    setAppUsers(mergedUsers);
                    localStorage.setItem('appUsers', JSON.stringify(mergedUsers));
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3800);
            };

            const syncFromSheet = async (customUrl = null, showNotification = true) => {
                const targetBaseUrl = (customUrl || sheetUrl || DEFAULT_SHEET_URL).trim();
                if (!targetBaseUrl) {
                    if (showNotification) showToast('URL Google Sheet belum ditentukan', 'error');
                    setCloudStatus('error');
                    return false;
                }

                const separator = targetBaseUrl.includes('?') ? '&' : '?';
                const fetchUrl = `${targetBaseUrl}${separator}t=${Date.now()}`;

                setIsLoading(true);
                setCloudStatus('connecting');
                try {
                    const response = await fetch(fetchUrl);
                    if (response.ok) {
                        const result = await response.json();

                        if (result.error) {
                            throw new Error(`Google Apps Script Error: ${result.error}`);
                        }

                        if (result.pencairan && Array.isArray(result.pencairan)) {
                            const cleaned = result.pencairan.map(it => normalizeRecord(it, true)).filter(Boolean);
                            setDataPencairan(cleaned);
                            localStorage.setItem('dataPencairan', JSON.stringify(cleaned));
                        }

                        if (result.estimasi && Array.isArray(result.estimasi)) {
                            const cleaned = result.estimasi.map(it => normalizeRecord(it, false)).filter(Boolean);
                            setDataEstimasi(cleaned);
                            localStorage.setItem('dataEstimasi', JSON.stringify(cleaned));
                        }

                        if (result.kol1 && Array.isArray(result.kol1)) {
                            setKol1Data(result.kol1);
                            localStorage.setItem('kol1Data', JSON.stringify(result.kol1));
                        }
                        if (result.lar && Array.isArray(result.lar)) {
                            setLarData(result.lar);
                            localStorage.setItem('larData', JSON.stringify(result.lar));
                        }
                        if (result.npl && Array.isArray(result.npl)) {
                            setNplData(result.npl);
                            localStorage.setItem('nplData', JSON.stringify(result.npl));
                        }

                        let klaimCount = 0;
                        if (result.klaim && Array.isArray(result.klaim)) {
                            setKlaimData(result.klaim);
                            localStorage.setItem('klaimData', JSON.stringify(result.klaim));
                            klaimCount = result.klaim.length;
                        }

                        if (result.report && Array.isArray(result.report)) {
                            setReportData(result.report);
                            localStorage.setItem('reportData', JSON.stringify(result.report));
                        }

                        if (result.master && Array.isArray(result.master) && result.master.length > 0) {
                            const ao = [], prod = [], adm = [], cab = [];
                            result.master.forEach(item => {
                                if (item.AO && String(item.AO).trim() !== '') ao.push(String(item.AO).trim());
                                if (item.Produk && String(item.Produk).trim() !== '') prod.push(String(item.Produk).trim());
                                if (item.AdminMikro && String(item.AdminMikro).trim() !== '') adm.push(String(item.AdminMikro).trim());
                                if (item.Cabang && String(item.Cabang).trim() !== '') cab.push(String(item.Cabang).trim());
                            });
                            const uniqueAo = [...new Set(ao)];
                            const uniqueProd = [...new Set(prod)];
                            const uniqueAdm = [...new Set(adm)];
                            const uniqueCab = [...new Set(cab)];

                            if (uniqueAo.length > 0) { setAoList(uniqueAo); localStorage.setItem('aoList', JSON.stringify(uniqueAo)); }
                            if (uniqueProd.length > 0) { setProductList(uniqueProd); localStorage.setItem('productList', JSON.stringify(uniqueProd)); }
                            if (uniqueAdm.length > 0) { setAdminList(uniqueAdm); localStorage.setItem('adminList', JSON.stringify(uniqueAdm)); }
                            if (uniqueCab.length > 0) { setCabangList(uniqueCab); localStorage.setItem('cabangList', JSON.stringify(uniqueCab)); }
                        }

                        if (result.users && Array.isArray(result.users) && result.users.length > 0) {
                            const mappedUsers = result.users.map(u => ({
                                username: u.Username || u.username,
                                password: u.Password || u.password,
                                role: u.Role || u.role
                            })).filter(u => u.username);

                            const cleanUsers = mappedUsers.filter(u => u.username && u.username.toLowerCase() !== 'admin' && u.username.toLowerCase() !== 'mikro');
                            const finalUsers = [...defaultUsers, ...cleanUsers];

                            setAppUsers(finalUsers);
                            localStorage.setItem('appUsers', JSON.stringify(finalUsers));
                        }

                        setCloudStatus('connected');
                        if (showNotification) {
                            if (result.klaim === undefined) {
                                showToast('Tersambung, namun server Google belum mengirim data KLAIM. Wajib Deploy Versi Baru di Apps Script!', 'error');
                            } else {
                                showToast(`Database Cloud Terhubung! Sinkronisasi sukses.`);
                            }
                        }
                        setIsLoading(false);
                        return true;
                    } else {
                        throw new Error(`HTTP ${response.status}: Server Google menolak permintaan.`);
                    }
                } catch (error) {
                    console.error("Sync Error:", error);
                    setCloudStatus('error');
                    if (showNotification) {
                        showToast(`Gagal menarik data: ${error.message || 'Periksa izin deployment Web App'}.`, 'error');
                    }
                    setIsLoading(false);
                    return false;
                }
            };

            const syncMasterToSheet = (newAoList, newProductList, newAdminList, newCabangList) => {
                const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                if (!targetUrl) return;
                const maxLen = Math.max(newAoList.length, newProductList.length, newAdminList.length, newCabangList.length);
                const dataToSave = [['AO', 'Produk', 'AdminMikro', 'Cabang']];
                for (let i = 0; i < maxLen; i++) {
                    dataToSave.push([
                        newAoList[i] || '',
                        newProductList[i] || '',
                        newAdminList[i] || '',
                        newCabangList[i] || ''
                    ]);
                }
                fetch(targetUrl, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'save_master', data: dataToSave })
                });
            };

            const syncUsersToSheet = (usersList) => {
                const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                if (!targetUrl) return;
                const dataToSave = [['Username', 'Password', 'Role']];
                usersList.forEach(u => dataToSave.push([u.username, u.password, u.role]));
                fetch(targetUrl, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'save_users', data: dataToSave })
                });
            };

            useEffect(() => {
                syncFromSheet(null, false);
            }, [userRole]);

            const handleLoginSuccess = (validUser) => {
                setUserRole(validUser.role);
                localStorage.setItem('userRole', validUser.role);
                setActiveTab(validUser.role === 'admin' ? 'dashReal' : 'inReal');
                showToast(`Selamat datang, ${validUser.username}!`);
            };

            if (!userRole) {
                return <Login appUsers={appUsers} onLoginSuccess={handleLoginSuccess} />;
            }

            const isAdmin = userRole === 'admin';

            return (
                <div className="flex bg-slate-50 font-sans text-slate-800 min-h-screen">

                    {toast.show && (
                        <div className={`fixed top-5 right-5 z-50 px-5 py-3.5 rounded-2xl shadow-2xl text-white font-bold text-xs md:text-sm flex items-center toast-enter ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-3 text-lg`}></i>
                            {toast.message}

                    {isLoading && (

                                <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl mb-3">
                                    <i className="fas fa-circle-notch fa-spin"></i>
                                </div>
                                <p className="font-extrabold text-slate-900 text-sm font-heading">Menyinkronkan Cloud...</p>
                                <p className="text-xs text-slate-400 mt-1">Mengambil data terbaru dari Google Apps Script</p>
                            </div>
                        </div>
                    )}

                    {confirmModal.open && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 md:p-7 shadow-2xl border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
                                <div className="flex items-center space-x-3 text-rose-600 mb-3">
                                    <div className="w-11 h-11 rounded-2xl bg-rose-50 flex items-center justify-center text-lg">
                                        <i className="fas fa-triangle-exclamation"></i>
                                    </div>
                                    <h3 className="font-black text-slate-900 text-lg font-heading">{confirmModal.title}</h3>
                                </div>
                                <p className="text-slate-600 text-xs md:text-sm mb-6 leading-relaxed font-medium">{confirmModal.message}</p>
                                <div className="flex space-x-2.5 justify-end">
                                    <button
                                        onClick={() => setConfirmModal({ open: false, title: '', message: '', onConfirm: null })}
                                        className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition"
                                    >
                                        Batal
                                    </button>
                                    <button
                                        onClick={() => { if (confirmModal.onConfirm) confirmModal.onConfirm(); }}
                                        className="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs transition shadow-md shadow-rose-600/30"
                                    >
                                        Lanjutkan Hapus
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {dbModal && (

                                            <p className="text-[11px] mt-0.5 opacity-90">{cloudStatus === 'connected' ? 'Seluruh data nasabah, rekap, dan master data berhasil disinkronisasi.' : 'Google Spreadsheet menolak akses atau URL belum tepat.'}</p>

                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 font-mono text-[11px] break-all">

                                        {sheetUrl || DEFAULT_SHEET_URL}

                                    <div className="p-4 bg-amber-50 rounded-2xl border border-amber-200 text-amber-950 leading-relaxed">
                                        <p className="font-bold mb-1 flex items-center"><i className="fas fa-circle-info mr-1.5 text-amber-600"></i>Panduan untuk Admin:</p>
                                        <p>Jika perangkat AO tidak bisa membaca data, pastikan di Google Spreadsheet Apps Script: <strong>Deploy &gt; Manage Deployments &gt; Who has access</strong> diatur ke <strong>"Anyone (Siapa saja)"</strong>, dan <strong>Execute as: "Me"</strong>.</p>
                                    </div>

                                <div className="mt-6 flex space-x-3 justify-end">
                                    <button
                                        onClick={() => { syncFromSheet(null, true); setDbModal(false); }}

                                    >
                                        <i className="fas fa-rotate mr-2"></i> Sinkronkan Ulang Sekarang
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className={`mobile-overlay ${isSidebarOpen ? 'open' : ''}`} onClick={() => setIsSidebarOpen(false)}></div>

                    <aside className={`sidebar-container ${isSidebarOpen ? 'open' : ''} flex flex-col justify-between text-slate-300`}>

                                <div className="p-1.5 rounded-2xl bg-white/10 shadow-sm border border-white/10">
                                    <RocketLogo size={46} />
                                </div>
                                <div className="overflow-hidden">
                                    <h2 className="font-black text-white text-base tracking-tight font-heading leading-tight truncate">
                                        AREA MEDAN 1
                                    </h2>
                                    <p className="text-[11px] font-extrabold text-emerald-400 uppercase tracking-wider flex items-center mt-0.5">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                                        {isAdmin ? 'Administrator' : 'Account Officer'}
                                    </p>
                                </div>
                            </div>

                            <div className="p-4 overflow-y-auto hide-scroll space-y-6">
                                <div>
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 px-3 font-heading">
                                        Dashboard
                                    </p>
                                    <button
                                        onClick={() => { setActiveTab('dashReal'); setIsSidebarOpen(false) }}
                                        className={`w-full text-left px-3.5 py-2.5 rounded-2xl mb-1 transition flex items-center text-xs font-bold ${activeTab === 'dashReal' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md shadow-emerald-900/40' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                    >
                                        <i className="fas fa-chart-pie w-6 text-sm opacity-80"></i> Realisasi (Admin)
                                    </button>
