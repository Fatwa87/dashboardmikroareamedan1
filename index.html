        const normalizeDate = (d) => {
            if (!d) return '';
            if (typeof d === 'string') {
                const s = d.trim();
                if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
                const parts = s.split(/[-/]/);
                if (parts.length === 3 && parts.every(p => !p.includes('T') && !p.includes(' ') && !p.includes(':'))) {
                    if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                    if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
            }
            const dt = new Date(d);
            if (isNaN(dt.getTime())) return '';
            const year = dt.getFullYear();
            const month = String(dt.getMonth() + 1).padStart(2, '0');
            const day = String(dt.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatRupiah = (angka) => {
            if (typeof angka === 'number') {
                if (!Number.isFinite(angka)) return '-';
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Math.round(angka));
            }
            const cleanNum = Number(String(angka || 0).replace(/\D/g, '')) || 0;
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(cleanNum);
        };

        const normalizeRecord = (item, isReal = true) => {
            if (!item || typeof item !== 'object') return null;

            const getVal = (keys) => {
                for (let k of keys) {
                    if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== '') {
                        return String(item[k]).trim();
                    }
                }
                const itemKeys = Object.keys(item);
                for (let target of keys) {
                    const cleanTarget = target.toLowerCase().replace(/[^a-z0-9]/g, '');
                    const foundKey = itemKeys.find(ik => ik.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanTarget);
                    if (foundKey && item[foundKey] !== undefined && item[foundKey] !== null && String(item[foundKey]).trim() !== '') {
                        return String(item[foundKey]).trim();
                    }
                }
                return '';
            };

            const rawTanggal = getVal(['Tanggal', 'TGL_DATA', 'Tgl', 'Date']);
            const cleanTanggal = normalizeDate(rawTanggal) || new Date().toLocaleDateString('en-CA');
            const nama = getVal(['Nama', 'CUSTOMER_NM', 'Nama Nasabah', 'NamaNasabah']);
            const noKredit = getVal(['NoKredit', 'NO_KONTRAK', 'No_Kredit', 'NoKontrak', 'NomorKredit']);
            const cabang = getVal(['Cabang', 'CABANG', 'Nama Cabang', 'NamaCabang']);
            const outlet = getVal(['Outlet', 'OUTLET', 'Outlet Pencairan', 'Outlet Penyalur', 'Unit', 'UPC']);
            const produk = getVal(['Produk', 'SUB PRODUK', 'SubProduk', 'JenisProduk']);
            const rawPlafon = getVal(['Plafon', 'UP', 'OSL', 'Nominal', 'Plafon Pencairan', 'Estimasi']);
            const cleanPlafon = String(rawPlafon).replace(/\D/g, '') || '0';
            const tenor = getVal(['Tenor', 'TENOR', 'JangkaWaktu']);
            const petugas = getVal(['Petugas', 'AdminMikro', 'Admin Mikro', 'Nama Petugas', 'Admin']);
            const ao = getVal(['AO', 'Nama AO', 'NamaAO', 'AO Pemrakarsa', 'Pemrakarsa']);

            return {
                Tanggal: cleanTanggal,
                Nama: nama,
                NoKredit: noKredit,
                Cabang: cabang,
                Outlet: outlet,
                Produk: produk,
                Plafon: cleanPlafon,
                Tenor: tenor,
                Petugas: petugas,
                AO: ao
            };
        };

        const generatePdfReport = ({
            title = 'LAPORAN REKAPITULASI',
            subtitle = '',
            filename = 'Laporan_AreaMedan1.pdf',
            tableId = null,
            customHeaders = null,
            customBody = null,
            summaryStats = [],
            orientation = 'landscape',
            format = 'a4',
            excludeLastCol = false
        }) => {
            try {
                if (!window.jspdf || !window.jspdf.jsPDF) {
                    throw new Error("Pustaka PDF belum dimuat. Periksa koneksi internet Anda.");
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: orientation,
                    unit: 'mm',
                    format: format
                });

                const pageWidth = doc.internal.pageSize.getWidth();
                const todayStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                doc.setFillColor(0, 135, 68);
                doc.rect(12, 10, pageWidth - 24, 2, 'F');

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(14);
                doc.setTextColor(11, 19, 41);
                doc.text("PT. PEGADAIAN AREA MEDAN 1", 12, 18);

                doc.setFontSize(10.5);
                doc.setTextColor(0, 135, 68);
                doc.text(title.toUpperCase(), 12, 23.5);

                if (subtitle) {
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8.5);
                    doc.setTextColor(100, 116, 139);
                    doc.text(subtitle, 12, 28);
                }

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7.5);
                doc.setTextColor(100, 116, 139);
                doc.text(`Dicetak: ${todayStr}`, pageWidth - 12, 18, { align: 'right' });
                doc.text(`Sistem Rekapitulasi Mikro Digital Area Juara 1`, pageWidth - 12, 22.5, { align: 'right' });

                let startY = subtitle ? 32 : 29;

                if (summaryStats && summaryStats.length > 0) {
                    let badgeX = 12;
                    summaryStats.forEach((stat) => {
                        const boxW = 58;
                        const boxH = 12;
                        doc.setFillColor(248, 250, 252);
                        doc.setDrawColor(226, 232, 240);
                        doc.roundedRect(badgeX, startY, boxW, boxH, 2, 2, 'FD');

                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(6.5);
                        doc.setTextColor(100, 116, 139);
                        doc.text(stat.label.toUpperCase(), badgeX + 3.5, startY + 4.5);

                        doc.setFontSize(9);
                        doc.setTextColor(15, 23, 42);
                        doc.text(String(stat.value), badgeX + 3.5, startY + 9.5);

                        badgeX += boxW + 4;
                    });
                    startY += 16;
                }

                let head = customHeaders || [];
                let body = customBody || [];

                if (!customHeaders && tableId) {
                    const tableElem = document.getElementById(tableId);
                    if (!tableElem) throw new Error("Elemen tabel tidak ditemukan.");

                    head = [];
                    tableElem.querySelectorAll('thead tr').forEach(tr => {
                        const row = [];
                        const ths = tr.querySelectorAll('th');
                        ths.forEach((th, idx) => {
                            if (excludeLastCol && idx === ths.length - 1) return;
                            row.push({
                                content: th.innerText.trim(),
                                colSpan: parseInt(th.getAttribute('colspan')) || 1,
                                rowSpan: parseInt(th.getAttribute('rowspan')) || 1,
                                styles: { halign: 'center', fontStyle: 'bold' }
                            });
                        });
                        if (row.length > 0) head.push(row);
                    });

                    body = [];
                    tableElem.querySelectorAll('tbody tr').forEach(tr => {
                        const row = [];
                        const tds = tr.querySelectorAll('td');
                        if (tds.length === 1 && tds[0].getAttribute('colspan')) return;
                        tds.forEach((td, idx) => {
                            if (excludeLastCol && idx === tds.length - 1) return;
                            row.push(td.innerText.trim());
                        });
                        if (row.length > 0) body.push(row);
                    });
                }

                if (body.length === 0) {
                    body.push([{ content: 'Tidak ada data untuk ditampilkan pada laporan ini.', colSpan: head[0]?.length || 1, styles: { halign: 'center', fontStyle: 'italic', textColor: 150 } }]);
                }

                const colCount = head[0]?.length || 8;
                const isDense = colCount > 8;

                doc.autoTable({
                    head: head,
                    body: body,
                    startY: startY,
                    margin: { top: 12, bottom: 14, left: 12, right: 12 },
                    theme: 'grid',
                    tableWidth: 'auto',
                    styles: {
                        font: 'helvetica',
                        fontSize: isDense ? 6.5 : 8,
                        cellPadding: isDense ? 1.5 : 2.2,
                        textColor: [30, 41, 59],
                        lineColor: [203, 213, 225],
                        lineWidth: 0.15,
                        valign: 'middle',
                        overflow: 'linebreak'
                    },
                    headStyles: {
                        fillColor: [11, 19, 41],
                        textColor: [255, 255, 255],
                        fontStyle: 'bold',
                        halign: 'center',
                        lineWidth: 0.2,
                        lineColor: [11, 19, 41]
                    },
                    alternateRowStyles: {
                        fillColor: [248, 250, 252]
                    },
                    didDrawPage: (data) => {
                        const totalPages = doc.internal.getNumberOfPages();
                        const pageCurrent = data.pageNumber;
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(7);
                        doc.setTextColor(148, 163, 184);
                        doc.text(
                            `Dokumen Resmi PT. Pegadaian Area Medan 1  •  Halaman ${pageCurrent} dari ${totalPages}`,
                            pageWidth / 2,
                            doc.internal.pageSize.getHeight() - 6,
                            { align: 'center' }
                        );
                    }
                });

                doc.save(filename);
                return true;
            } catch (err) {
                console.error("Gagal cetak PDF:", err);
                return false;
            }
        };

                            <text x="122" y="184" fill="#ffffff" fontFamily="Plus Jakarta Sans, sans-serif" fontWeight="900" fontStyle="italic" fontSize="21" letterSpacing="0.5">MEDAN</text>
                            <text x="124" y="206" fill="#ffffff" fontFamily="Plus Jakarta Sans, sans-serif" fontWeight="900" fontStyle="italic" fontSize="20" letterSpacing="0.8">JUARA</text>
                            <text x="210" y="196" fill="#f97316" stroke="#0c1e35" strokeWidth="2.5" fontFamily="Plus Jakarta Sans, sans-serif" fontWeight="900" fontStyle="italic" fontSize="62">1</text>
                        </g>
                    </svg>

            );
        };

        // Self-contained Clock Component so it NEVER re-renders App or any input fields!
        const LiveClock = () => {

                return () => clearInterval(timer);

            return (

                    <div className="hidden md:flex items-center bg-slate-50 px-3.5 py-1.5 rounded-2xl border border-slate-200 text-xs font-bold text-slate-700 tnum">
                        <i className="fas fa-clock mr-2 text-slate-400 text-xs"></i>
                        {time.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} WIB
                    </div>
                </div>
            );
        };

        /* ==========================================================
           TOP-LEVEL COMPONENT: Login
           (Defined OUTSIDE App to guarantee input focus is NEVER lost)
        ========================================================== */
        const Login = ({ appUsers, onLoginSuccess }) => {
            const [username, setUsername] = useState('');

            const [showPassword, setShowPassword] = useState(false);

                setUsername(e.target.value);
                setLoginError("");

                setPassword(e.target.value);

            };

                e.preventDefault();
                const cleanUser = username.trim().toLowerCase();
                const cleanPass = password.trim();

                const validUser = appUsers.find(u =>
                    u.username &&
                    u.username.toLowerCase() === cleanUser &&
                    u.password === cleanPass
                );

                                            <i className="fas fa-lock text-sm"></i>

                                            placeholder="Masukkan password"
                                            required
                                        />

                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'} text-sm`}></i>
                                        </button>
                                    </div>
                                </div>

                                <button
                                    type="submit"
                                    className="w-full mt-2 bg-gradient-to-r from-emerald-600 to-pegadaian-900 hover:from-emerald-500 hover:to-pegadaian-800 text-white font-bold py-3.5 px-4 rounded-2xl transition shadow-lg shadow-emerald-700/30 flex items-center justify-center text-sm font-heading tracking-wide hover:translate-y-[-1px] active:translate-y-[0px]"

        /* ==========================================================
           TOP-LEVEL COMPONENT: InputForm
           (Robust Dropdowns & Step-grouped inputs)
        ========================================================== */
        const InputForm = ({
            type,
            cabangList,
            productList,
            adminList,
            aoList,
            dataPencairan,
            setDataPencairan,
            dataEstimasi,
            setDataEstimasi,

            const isReal = type === 'realisasi';

            const [formData, setFormData] = useState({

                NoKredit: '',
                Produk: productList.length > 0 ? productList[0] : '',

                Tenor: '',

            // Set initial defaults safely without resetting when user selects
            useEffect(() => {
                if (!formData.Cabang && cabangList.length > 0) {
                    setFormData(prev => ({ ...prev, Cabang: cabangList[0] }));

                if (!formData.Produk && productList.length > 0) {
                    setFormData(prev => ({ ...prev, Produk: productList[0] }));

                const targetPetugas = isReal ? adminList : aoList;

                    setFormData(prev => ({ ...prev, Petugas: targetPetugas[0] }));

                    setFormData(prev => ({ ...prev, AO: aoList[0] }));

            const quickAmounts = [5000000, 10000000, 20000000, 50000000, 100000000];

                e.preventDefault();

                if (isReal && !formData.AO) return showToast('Harap pilih Nama AO Pemrakarsa!', 'error');

                setIsLoading(true);

                const cleanPlafon = formData.Plafon.toString().replace(/\D/g, '');
                const cleanDate = normalizeDate(formData.Tanggal) || new Date().toLocaleDateString('en-CA');
                const newData = {
                    ...formData,
                    Tanggal: cleanDate,
                    Plafon: cleanPlafon,
                    Outlet: formData.Outlet.trim().toUpperCase(),
                    AO: (formData.AO || '').trim().toUpperCase()
                };

                if (isReal) {
                    const updated = [newData, ...dataPencairan];
                    setDataPencairan(updated);
                    localStorage.setItem('dataPencairan', JSON.stringify(updated));
                } else {
                    const updated = [newData, ...dataEstimasi];
                    setDataEstimasi(updated);
                    localStorage.setItem('dataEstimasi', JSON.stringify(updated));
                }

                const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                if (targetUrl) {
                    try {
                        await fetch(targetUrl, {
                            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: isReal ? 'add_pencairan' : 'add_estimasi', data: newData })
                        });
                        showToast(`Data ${isReal ? 'Realisasi' : 'Estimasi'} berhasil disimpan ke Cloud!`);
                    } catch (error) {
                        showToast('Gagal mengirim ke Cloud Database.', 'error');
                    }
                }
                setIsLoading(false);
                setFormData(prev => ({
                    ...prev,
                    Nama: '',
                    NoKredit: '',
                    Outlet: '',
                    Plafon: '',
                    Tenor: '',
                    Cabang: cabangList.length > 0 ? cabangList[0] : '',
                    AO: aoList.length > 0 ? aoList[0] : ''

                                            type="date"
                                            value={formData.Tanggal}
                                            onChange={(e) => {

                                                setFormData(prev => ({ ...prev, Tanggal: val }));
                                            }}
                                            className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500"
                                            required
                                        />
                                    </div>

                                    {/* MENU DROPDOWN CABANG - EXPLICIT & CLICKABLE */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center">
                                            <i className="fas fa-building mr-1.5 text-emerald-600"></i>
                                            Cabang Pegadaian <span className="text-rose-500 ml-1">*</span>
                                        </label>
                                        <div className="relative">
                                            <select
                                                value={formData.Cabang}

                                                    const val = e.target.value;
                                                    setFormData(prev => ({ ...prev, Cabang: val }));
                                                }}
                                                className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 cursor-pointer transition shadow-xs"

                                            type="text"
                                            value={formData.Nama}

                                                setFormData(prev => ({ ...prev, Nama: val }));

                                    </div>
                                    {isReal ? (

                                            <label className="block text-xs font-bold text-slate-600 mb-1.5">Nomor Kredit (Kontrak)</label>

                                                type="text"
                                                value={formData.NoKredit}
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    setFormData(prev => ({ ...prev, NoKredit: val }));

                                                required

                                                {aoList.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                                            </select>
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <div className="flex justify-between items-center mb-1.5">

                                            Nominal {isReal ? 'Plafon Pencairan' : 'Estimasi Pinjaman'} (Rp)

                                        {formData.Plafon && (

                                            </span>

                                            Rp

                                        <input
                                            type="text"
                                            value={formData.Plafon}

                                                setFormData(prev => ({ ...prev, Plafon: formatRupiah(raw).replace('Rp', '').trim() }));

                                            className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-base font-extrabold text-slate-900 outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500 placeholder:text-slate-400 tnum"

                                            required

                                        {quickAmounts.map((amt, idx) => (

                                                key={idx}

                                            >

                                        <span className="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-bold flex items-center justify-center font-heading">3</span>

        /* ==========================================================
           TOP-LEVEL COMPONENT: DataRekap
        ========================================================== */
        const DataRekap = ({
            type,
            dataPencairan,
            setDataPencairan,
            dataEstimasi,
            setDataEstimasi,
            sheetUrl,
            showToast,
            setIsLoading,
            setConfirmModal
        }) => {
            const isReal = type === 'realisasi';
            const data = isReal ? dataPencairan : dataEstimasi;
            const [searchTerm, setSearchTerm] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            const handleDelete = (item) => {
                setConfirmModal({
                    open: true,
                    title: `Hapus Data ${item.Nama}`,
                    message: `Apakah Anda yakin ingin menghapus data nasabah ${item.Nama}? Data yang dihapus tidak dapat dipulihkan.`,
                    onConfirm: async () => {
                        setIsLoading(true);
                        const newData = data.filter(d => isReal ? (d.NoKredit !== item.NoKredit) : (d.Nama !== item.Nama || d.Produk !== item.Produk));
                        if (isReal) {
                            setDataPencairan(newData);
                            localStorage.setItem('dataPencairan', JSON.stringify(newData));
                        } else {
                            setDataEstimasi(newData);
                            localStorage.setItem('dataEstimasi', JSON.stringify(newData));
                        }

                        const targetUrl = sheetUrl || DEFAULT_SHEET_URL;
                        if (targetUrl) {
                            try {
                                await fetch(targetUrl, {
                                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                                    body: JSON.stringify({ action: isReal ? 'delete_pencairan' : 'delete_estimasi', NoKredit: item.NoKredit, Nama: item.Nama, Produk: item.Produk })
                                });
                                showToast('Data berhasil dihapus dari Cloud!');
                            } catch (e) { showToast('Gagal hapus di Cloud Database', 'error'); }
                        }
                        setIsLoading(false);
                        setConfirmModal({ open: false, title: '', message: '', onConfirm: null });
                    }
                });
            };

            const copyRowToClipboard = (item) => {
                const rowText = `${item.Tanggal} | ${item.Nama} | ${item.Cabang} | ${item.Outlet} | ${item.Produk} | ${formatRupiah(item.Plafon)} | AO: ${item.AO || '-'}`;
                navigator.clipboard.writeText(rowText);
                showToast('Rincian nasabah disalin ke clipboard!');
            };

            const filtered = data.filter(item => {
                const term = searchTerm.toLowerCase();
                const matchSearch =
                    (item.Nama && item.Nama.toLowerCase().includes(term)) ||
                    (isReal && item.NoKredit && String(item.NoKredit).toLowerCase().includes(term)) ||
                    (item.Cabang && item.Cabang.toLowerCase().includes(term)) ||
                    (item.Outlet && item.Outlet.toLowerCase().includes(term)) ||
                    (item.Produk && item.Produk.toLowerCase().includes(term)) ||
                    (item.Petugas && item.Petugas.toLowerCase().includes(term)) ||
                    (item.AO && item.AO.toLowerCase().includes(term));

                let matchDate = true;
                if (startDate || endDate) {
                    const itemDateStr = normalizeDate(item.Tanggal);
                    if (startDate && itemDateStr < startDate) matchDate = false;
                    if (endDate && itemDateStr > endDate) matchDate = false;
                }
                return matchSearch && matchDate;
            });

            const totalFilteredPlafon = filtered.reduce((sum, item) => sum + (Number(String(item.Plafon || 0).replace(/\D/g, '')) || 0), 0);

            const downloadPDF = () => {
                setIsLoading(true);
                const success = generatePdfReport({
                    title: `REKAPITULASI ${isReal ? 'REALISASI' : 'ESTIMASI'} PENCAIRAN`,
                    subtitle: `Periode: ${startDate || 'Awal'} s/d ${endDate || 'Kini'} | Pencarian: "${searchTerm || 'Semua'}"`,
                    filename: `Rekap_${isReal ? 'Realisasi' : 'Estimasi'}_AreaMedan1_${new Date().toISOString().split('T')[0]}.pdf`,
                    tableId: `table-rekap-${type}`,
                    summaryStats: [
                        { label: 'Total Nasabah', value: `${filtered.length} Nasabah` },
                        { label: 'Total Nominal Plafon', value: formatRupiah(totalFilteredPlafon) }
                    ],
                    orientation: 'landscape',
                    format: 'a4',
                    excludeLastCol: true
                });
                setIsLoading(false);
                if (success) showToast('PDF berhasil diunduh tanpa terpotong!');
                else showToast('Gagal memproses dokumen PDF', 'error');
            };

            const resetDateFilter = () => { setStartDate(''); setEndDate(''); };

            const setDatePreset = (preset) => {
                const today = new Date();
                if (preset === 'today') {
                    const iso = today.toLocaleDateString('en-CA');
                    setStartDate(iso);
                    setEndDate(iso);
                } else if (preset === 'month') {
                    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1).toLocaleDateString('en-CA');
                    const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).toLocaleDateString('en-CA');
                    setStartDate(firstDay);
                    setEndDate(lastDay);
                } else if (preset === 'all') {
                    resetDateFilter();
                }
            };

            return (
                <div className="space-y-6">

                            <div>
                                <div className="flex items-center space-x-2.5">
                                    <span className={`w-3 h-3 rounded-full ${isReal ? 'bg-emerald-500' : 'bg-orange-500'}`}></span>
                                    <h2 className="text-2xl font-black text-slate-900 font-heading">
                                        Rekapitulasi {isReal ? 'Realisasi' : 'Estimasi'}
                                    </h2>
                                </div>
                                <p className="text-xs md:text-sm text-slate-500 mt-1 font-medium">
                                    Menampilkan <span className="font-extrabold text-slate-900">{filtered.length} Data</span> | Total Plafon: <span className="font-extrabold text-emerald-600 tnum">{formatRupiah(totalFilteredPlafon)}</span>
                                </p>
                            </div>
                            <div className="flex flex-wrap items-center gap-2.5 w-full lg:w-auto">
                                <button
                                    onClick={downloadPDF}
                                    className="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2.5 rounded-2xl text-xs font-bold transition flex items-center shadow-md shadow-rose-600/20"
                                >
                                    <i className="fas fa-file-pdf mr-2 text-sm"></i> Unduh PDF Laporan
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-12 gap-4 mt-6">
                            <div className="md:col-span-5 relative">
                                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                    <i className="fas fa-magnifying-glass text-xs"></i>
                                </div>
                                <input
                                    type="text"
                                    placeholder="Cari nama nasabah, no kredit, cabang, AO..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-emerald-600 focus:bg-white text-xs md:text-sm font-medium transition"
                                />
                            </div>

                            <div className="md:col-span-3">
                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-bold text-slate-400 whitespace-nowrap">Dari:</span>
                                    <input
                                        type="date"
                                        value={startDate}
                                        onChange={(e) => setStartDate(e.target.value)}
                                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-2xl outline-none text-xs font-semibold focus:bg-white focus:border-emerald-600"
                                    />
                                </div>
                            </div>

                            <div className="md:col-span-3">
                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-bold text-slate-400 whitespace-nowrap">S/d:</span>
                                    <input
                                        type="date"
                                        value={endDate}
                                        onChange={(e) => setEndDate(e.target.value)}

                                    />

                            </div>

                            <div className="md:col-span-1 flex items-center">
                                {(startDate || endDate) ? (
                                    <button
                                        onClick={resetDateFilter}
                                        title="Reset Filter Tanggal"
                                        className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-xs font-bold transition flex items-center justify-center"
                                    >
                                        <i className="fas fa-times mr-1"></i> Reset
                                    </button>
                                ) : (
                                    <button
                                        onClick={() => setDatePreset('today')}
                                        className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-xs font-bold transition flex items-center justify-center"
                                    >
                                        Hari ini
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="glass-card rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                        <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <div>
                                <h3 className="font-extrabold text-slate-900 text-base font-heading">
                                    Tabel Data {isReal ? 'Realisasi Pencairan' : 'Estimasi'}
                                </h3>
                                <p className="text-xs text-slate-400 font-medium">PT. Pegadaian Area Medan 1</p>
                            </div>
                            <span className="text-xs font-extrabold px-3 py-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-xl tnum">
                                Total: {formatRupiah(totalFilteredPlafon)}
                            </span>
                        </div>

                        <div className="overflow-x-auto">
                            <table id={`table-rekap-${type}`} className="w-full text-left border-collapse text-xs md:text-sm">
                                <thead>
                                    <tr className="bg-slate-100/70 text-slate-700 uppercase tracking-wider text-[11px] font-heading border-b border-slate-200">

                                        <th className="p-3.5 font-extrabold">Nama Nasabah</th>
                                        {isReal && <th className="p-3.5 font-extrabold">No. Kredit</th>}
                                        <th className="p-3.5 font-extrabold">Produk</th>
                                        <th className="p-3.5 font-extrabold">Plafon</th>
                                        {isReal && <th className="p-3.5 font-extrabold text-center">Tenor</th>}
                                        <th className="p-3.5 font-extrabold">{isReal ? 'Admin Mikro' : 'Petugas / AO'}</th>
                                        {isReal && <th className="p-3.5 font-extrabold">AO Pemrakarsa</th>}
                                        <th className="p-3.5 font-extrabold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filtered.map((item, idx) => (
                                        <tr key={idx} className="hover:bg-slate-50/80 transition-colors">

                                            <td className="p-3.5 font-bold text-slate-800 whitespace-nowrap">{item.Cabang || '-'}</td>
                                            <td className="p-3.5 whitespace-nowrap">
                                                <span className="inline-flex items-center px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-100 text-[11px] font-bold">
                                                    <i className="fas fa-store mr-1 text-[10px] text-emerald-600"></i>{item.Outlet || '-'}
                                                </span>
                                            </td>
                                            <td className="p-3.5 font-extrabold text-slate-900">{item.Nama}</td>
                                            {isReal && <td className="p-3.5 text-slate-600 font-mono text-xs">{item.NoKredit}</td>}
                                            <td className="p-3.5 text-slate-600 font-medium">{item.Produk}</td>
                                            <td className="p-3.5 font-black text-emerald-700 tnum">{formatRupiah(item.Plafon)}</td>
                                            {isReal && <td className="p-3.5 text-center text-slate-600 font-semibold">{item.Tenor ? `${item.Tenor} bln` : '-'}</td>}
                                            <td className="p-3.5 text-slate-600 font-medium">{item.Petugas || '-'}</td>

                                                        <i className="fas fa-user-tie mr-1 text-[10px] text-orange-500"></i>{item.AO || '-'}
                                                    </span>
                                                </td>

                                                    title="Salin Rincian"

                                                    <i className="fas fa-copy"></i>
                                                </button>
                                                <button
                                                    onClick={() => handleDelete(item)}

                                                    title="Hapus Data"
                                                >
                                                    <i className="fas fa-trash-can"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {filtered.length === 0 && (
                                        <tr>
                                            <td colSpan={isReal ? 11 : 8} className="p-12 text-center text-slate-400 font-medium">
                                                <i className="fas fa-folder-open text-3xl mb-2 text-slate-300 block"></i>
                                                Tidak ditemukan data transaksi yang sesuai filter pencarian.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        /* ==========================================================
           TOP-LEVEL COMPONENT: TableNasabahView (KOL1, LAR, NPL, KLAIM)
        ========================================================== */
        const TableNasabahView = ({ title, data, type, icon, syncFromSheet, showToast, setIsLoading }) => {
            const [selectedCabang, setSelectedCabang] = useState('Semua');
            const [selectedOutlet, setSelectedOutlet] = useState('Semua');
            const [searchTerm, setSearchTerm] = useState('');

            const displayColumns = type === 'kol1'
                ? ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG']
                : type === 'klaim'
                    ? ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'TGL_JATUH_TEMPO', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG', 'TINDAK LANJUT KLAIM']
                    : ['TGL_DATA', 'CIF', 'NO_KONTRAK', 'CUSTOMER_NM', 'SUB PRODUK', 'TGL_KREDIT', 'TENOR', 'KOLEKTIBILITAS', 'HARI_TUNGGAKAN', 'OSL', 'OUTLET', 'OUTLET_CHANNELING', 'CABANG'];

            useEffect(() => { setSelectedOutlet('Semua'); }, [selectedCabang]);

            const getCabangVal = (item) => String(item.CABANG || item.Cabang || item.NamaCabang || '').trim();
            const getOutletVal = (item) => String(item.OUTLET || item.Outlet || '').trim();

            const cabangListFilter = ['Semua', ...new Set(data.map(getCabangVal).filter(Boolean))];
            const availableOutlets = data.filter(item => selectedCabang === 'Semua' || getCabangVal(item).toLowerCase() === selectedCabang.toLowerCase()).map(getOutletVal).filter(Boolean);
            const outletList = ['Semua', ...new Set(availableOutlets)];

            const filteredData = data.filter(item => {
                const cVal = getCabangVal(item);
                const oVal = getOutletVal(item);
                const matchCabang = selectedCabang === 'Semua' || cVal.toLowerCase() === selectedCabang.toLowerCase();
                const matchOutlet = selectedOutlet === 'Semua' || oVal.toLowerCase() === selectedOutlet.toLowerCase();

                let matchSearch = true;
                if (searchTerm.trim()) {
                    const term = searchTerm.toLowerCase();
                    matchSearch = displayColumns.some(column => String(item[column] || '').toLowerCase().includes(term));
                }
                return matchCabang && matchOutlet && matchSearch;
            });

            const totalOut = filteredData.reduce((sum, item) => sum + (Number(String(item.OSL || item.UP || item.Plafon || 0).replace(/\D/g, '')) || 0), 0);

            const colorConfig = {
                kol1: {
                    bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-900',
                    badge: 'bg-amber-600 hover:bg-amber-700', iconBg: 'bg-amber-100', iconText: 'text-amber-700'
                },
                lar: {
                    bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-900',
                    badge: 'bg-orange-600 hover:bg-orange-700', iconBg: 'bg-orange-100', iconText: 'text-orange-700'
                },
                npl: {
                    bg: 'bg-rose-50', border: 'border-rose-200', text: 'text-rose-900',
                    badge: 'bg-rose-600 hover:bg-rose-700', iconBg: 'bg-rose-100', iconText: 'text-rose-700'
                },
                klaim: {
                    bg: 'bg-teal-50', border: 'border-teal-200', text: 'text-teal-900',
                    badge: 'bg-teal-600 hover:bg-teal-700', iconBg: 'bg-teal-100', iconText: 'text-teal-700'
                }
            };
            const conf = colorConfig[type] || colorConfig.lar;

            const downloadPDF = () => {
                setIsLoading(true);
                const success = generatePdfReport({
                    title: `DATA PEMANTAUAN ${title.toUpperCase()}`,
                    subtitle: `Cabang: ${selectedCabang} | Outlet: ${selectedOutlet}`,
                    filename: `Data_${title.replace(/[^a-zA-Z0-9]/g, '_')}_AreaMedan1.pdf`,
                    tableId: `table-nasabah-${type}`,
                    summaryStats: [
                        { label: `Total Nasabah ${title}`, value: `${filteredData.length} Nasabah` },
                        { label: `Total Outstanding`, value: formatRupiah(totalOut) }
                    ],
                    orientation: 'landscape',
                    format: 'legal',
                    excludeLastCol: false
                });
                setIsLoading(false);
                if (success) showToast('PDF berhasil diunduh tanpa terpotong!');

                                </div>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2.5 w-full lg:w-auto">
                            <button
                                onClick={() => syncFromSheet(null, true)}
                                className="px-4 py-2.5 bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 rounded-2xl text-xs font-bold transition flex items-center shadow-sm"
                                title="Tarik Data Terbaru dari Cloud Google Sheet"
                            >
                                <i className="fas fa-cloud-arrow-down mr-2 text-emerald-600 text-sm"></i> Tarik Cloud
                            </button>

                            <div className="flex items-center space-x-2">
                                <select
                                    value={selectedCabang}
                                    onChange={(e) => setSelectedCabang(e.target.value)}
                                    className="p-2.5 border border-slate-200 rounded-2xl bg-slate-50 text-xs font-bold text-slate-700 outline-none"
                                >
                                    {cabangListFilter.map((cabang, idx) => <option key={idx} value={cabang}>{cabang === 'Semua' ? 'Semua Cabang' : cabang}</option>)}
                                </select>
                            </div>

                            <div className="flex items-center space-x-2">
                                <select
                                    value={selectedOutlet}
                                    onChange={(e) => setSelectedOutlet(e.target.value)}
                                    className="p-2.5 border border-slate-200 rounded-2xl bg-slate-50 text-xs font-bold text-slate-700 outline-none"
                                >
                                    {outletList.map((outlet, idx) => <option key={idx} value={outlet}>{outlet === 'Semua' ? 'Semua Outlet' : outlet}</option>)}

        /* ==========================================================

        ========================================================== */
        const AdminPanel = ({
            aoList, setAoList,

        }) => {

                if (!sheetInput.trim()) return showToast('URL tidak boleh kosong!', 'error');

                showToast('URL Google Sheet berhasil disimpan!');
            };

            const testConnection = async () => {
                const success = await syncFromSheet(sheetInput.trim(), true);
                if (success) {
                    saveCustomUrl();
                }
            };

            const addCabang = () => {
                if (!newCabang.trim()) return;
                const cleanName = newCabang.trim().toUpperCase();
                const updated = [...new Set([...cabangList, cleanName])];
                setCabangList(updated); localStorage.setItem('cabangList', JSON.stringify(updated));
                syncMasterToSheet(aoList, productList, adminList, updated);
                setNewCabang(""); showToast('Cabang berhasil ditambahkan');
            };

            const removeCabang = (cab) => {
                const updated = cabangList.filter(c => c !== cab);
                setCabangList(updated); localStorage.setItem('cabangList', JSON.stringify(updated));
                syncMasterToSheet(aoList, productList, adminList, updated);
                showToast('Cabang dihapus', 'error');
            };

            const addAo = () => {
                if (!newAo.trim()) return;
                const updated = [...new Set([...aoList, newAo.trim().toUpperCase()])];
                setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated));
                syncMasterToSheet(updated, productList, adminList, cabangList); setNewAo(""); showToast('AO berhasil ditambahkan');
            };
            const removeAo = (ao) => {
                const updated = aoList.filter(c => c !== ao);
                setAoList(updated); localStorage.setItem('aoList', JSON.stringify(updated));
                syncMasterToSheet(updated, productList, adminList, cabangList); showToast('AO dihapus', 'error');
            };

            const addAdmin = () => {
                if (!newAdmin.trim()) return;
                const updated = [...new Set([...adminList, newAdmin.trim().toUpperCase()])];
                setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated));
                syncMasterToSheet(aoList, productList, updated, cabangList); setNewAdmin(""); showToast('Admin berhasil ditambahkan');
            };
            const removeAdmin = (adm) => {
                const updated = adminList.filter(c => c !== adm);
                setAdminList(updated); localStorage.setItem('adminList', JSON.stringify(updated));
                syncMasterToSheet(aoList, productList, updated, cabangList); showToast('Admin dihapus', 'error');
            };

            const addProduct = () => {
                if (!newProduct.trim()) return;
                const updated = [...new Set([...productList, newProduct.trim().toUpperCase()])];
                setProductList(updated); localStorage.setItem('productList', JSON.stringify(updated));
                syncMasterToSheet(aoList, updated, adminList, cabangList); setNewProduct(""); showToast('Produk berhasil ditambahkan');
            };
            const removeProduct = (prod) => {
                const updated = productList.filter(p => p !== prod);
